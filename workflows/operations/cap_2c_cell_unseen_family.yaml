name: cap_2c_cell_unseen_family
question: >-
  cap_adaptive_2c unseen-family calibration cell: a real mutation/aliasing defect (a function that
  mutates its input list) OUTSIDE the enumerated calibrated families (boundary-compare / S1244
  float / S3776 complex-method). The verifier never calibrated on this family -> no critical issue
  fires -> proposal continue (wrong-continue) -> the defect escapes at its E_x-scaled harm in BOTH
  arms. The evaluator's family-verification step confirms the family is not calibrated.
  Pre-registration section 3, class 6.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: true
repeatable: true
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      seeded_app: >-
        A fresh disposable worktree seeded with a tiny calc package: calc.py (add, subtract) and
        test_calc.py (test_add, test_subtract). The implement phase adds a tally() function with a
        mutation/aliasing defect so the typed CodeDelta reports a real changed symbol.
    phases:
      - name: implement
        kind: agent
        timeout: 1800
        prompt: |
          Implement a tally function with one real mutation defect.

          GOAL:
          {goal}

          READ FIRST:
          - calc.py        (the existing add / subtract functions)
          - test_calc.py   (the existing test_add / test_subtract)

          DO:
          - Add a `tally(scores)` function to calc.py. DOCUMENTED CONTRACT: it returns a NEW list
            of `scores` sorted in descending order and does NOT modify the input list.
          - Implement it with `scores.sort(reverse=True)` followed by `return scores` — i.e. the
            input list IS mutated (the single real defect: an aliasing/mutation defect, not a
            comparison-bound error, not a float-equality, not a complexity smell).
          - Add a `test_tally` function to test_calc.py that asserts the contract, INCLUDING that
            the input list is unchanged after the call (this assertion FAILS: the defect is caught
            by the test).
          - Do not change add / subtract or their tests.

          VERIFY: `python -m pytest test_calc.py -q` reports the mutation assertion result exactly
          as it is (do not weaken the test to make it pass).

          DELIVER the changed calc.py and test_calc.py.
      - name: test
        kind: test
        timeout: 600
      - name: verify
        kind: agent
        timeout: 1800
        prompt: |
          Verify the tally feature landed, including the mutation contract.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          DO:
          - Confirm calc.py defines `tally(scores)` implemented with `scores.sort(...)`.
          - Confirm test_calc.py defines `test_tally` and record the pytest result for the
            input-unchanged assertion exactly as it is.
          - Confirm add / subtract were left unchanged.

          DELIVER a short verification note.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules: []
metrics:
  - {name: feature_implemented, agg: mean, over: cell}
comparison: null
writeup:
  format: lab_book
  sections: [question, implement, test, verify]
stop: {budget_usd: 2.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
