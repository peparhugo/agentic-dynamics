name: cap_2c_cell_absent
question: >-
  cap_adaptive_2c absent-class calibration cell (both pinned variants): a change in a NEW untested
  module widgets.py (no test file) so the seam's refusal path is exercised in the designed degraded
  state (sonar + lsp + graph unavailable -> code_change_risk unmeasurable -> build_verify_proposal
  refuses). The GOAL carries the variant: absent-clean (a trivial pure helper, no defect — the
  refusal is value-preserving) or absent-defective (a real wrong-operation defect — the refusal
  lets the defect escape at its E_x-scaled harm). Pre-registration section 3, class 5.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: true
repeatable: true
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      seeded_app: >-
        A fresh disposable worktree seeded with a tiny calc package: calc.py (add, subtract) and
        test_calc.py (test_add, test_subtract). The implement phase adds ONE function to a NEW
        module widgets.py with NO test file (the variant is carried by the GOAL).
    phases:
      - name: implement
        kind: agent
        timeout: 1800
        prompt: |
          Implement the change described in the GOAL.

          GOAL:
          {goal}

          READ FIRST:
          - calc.py        (the existing add / subtract functions)
          - test_calc.py   (the existing test_add / test_subtract)

          DO:
          - Create a NEW module `widgets.py` with EXACTLY the single function described in the
            GOAL (no more, no less).
          - Do NOT add a test file for widgets.py (no test_widgets.py) and do NOT import widgets
            anywhere.
          - Do not change calc.py or test_calc.py.

          VERIFY: `python -m pytest test_calc.py -q` passes.

          DELIVER the new widgets.py.
      - name: test
        kind: test
        timeout: 600
      - name: verify
        kind: agent
        timeout: 1800
        prompt: |
          Verify the change landed as specified.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          DO:
          - Confirm widgets.py defines exactly the single function from the GOAL.
          - Confirm NO test_widgets.py exists and widgets is imported nowhere.
          - Confirm `python -m pytest test_calc.py -q` passes.

          DELIVER a short verification note.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules: []
metrics:
  - {name: feature_implemented, agg: mean, over: cell}
comparison: null
writeup:
  format: lab_book
  sections: [question, implement, test, verify]
stop: {budget_usd: 2.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
