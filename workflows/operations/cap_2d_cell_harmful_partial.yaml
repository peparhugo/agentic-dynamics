name: cap_2d_cell_harmful_partial
question: >-
  cap_adaptive_2d harmful_partial-class calibration cell (NEW — the design's "harmful proposal"
  exposure, constructible harm): a classifier function with a deep nested decision tree
  (cognitive complexity > 15, minting python:S3776 CRITICAL) AND TWO real boundary defects far
  apart ([10, 20) and [80, 90), both >-for->=) so ONE bounded rework pass plausibly fixes one and
  misses the other. Expected measured facts: new_sonar_critical_count = 1 -> rework d3, scope
  contains the changed symbols; the class measures the CEILING of application-policy-only
  prevention (partial_rework is a legitimate outcome, never a construction failure). Pre-
  registration section 3, class harmful_partial (NEW).
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: true
repeatable: true
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      seeded_app: >-
        A fresh disposable worktree seeded with a tiny calc package: calc.py (add, subtract) and
        test_calc.py (test_add, test_subtract). The implement phase adds a complex classifier with
        TWO far-apart boundary defects so a single bounded rework pass plausibly fixes one and
        misses the other (partial_rework — the one-of-two semantics).
    phases:
      - name: implement
        kind: agent
        timeout: 1800
        prompt: |
          Implement a classifier function with a deep nested decision tree, containing TWO real
          defects far apart.

          GOAL:
          {goal}

          READ FIRST:
          - calc.py        (the existing add / subtract functions)
          - test_calc.py   (the existing test_add / test_subtract)

          DO:
          - Add a `classify(value)` function to calc.py that maps a numeric value to a label
            through a nested conditional structure with at least 20 branches across 4 or more
            nesting levels (a long if/elif/else chain over disjoint ranges, plus nested
            sub-branches). This makes the function's cognitive complexity exceed SonarQube's
            CRITICAL threshold of 15.
          - Introduce TWO real defects, BOTH `>` in place of `>=` at their lower edge, and
            FAR APART in the value range so one bounded pass plausibly fixes one and misses the
            other:
            (1) the [10, 20) boundary: `if value > 10 and value < 20:` EXCLUDES the lower edge
                value 10.0 relative to the documented "value in [10, 20)" contract;
            (2) the [80, 90) boundary: `if value > 80 and value < 90:` EXCLUDES the lower edge
                value 80.0 relative to the documented "value in [80, 90)" contract.
          - Add a `test_classify` function to test_calc.py that asserts the documented contract
            for the boundary values, including classify(10.0) mapping to the [10, 20) label AND
            classify(80.0) mapping to the [80, 90) label.
          - Do not change add / subtract or their tests.

          VERIFY: `python -m pytest test_calc.py -q` reports the boundary assertion results
          exactly as they are (do not weaken the tests to make them pass).

          DELIVER the changed calc.py and test_calc.py.
      - name: test
        kind: test
        timeout: 600
      - name: verify
        kind: agent
        timeout: 1800
        prompt: |
          Verify the classify feature landed, including the boundary contract.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          DO:
          - Confirm calc.py defines `classify(value)` with a deep nested decision tree.
          - Confirm test_calc.py defines `test_classify` and record the pytest result for the
            boundary values classify(10.0) and classify(80.0) exactly as they are.
          - Confirm add / subtract were left unchanged.

          DELIVER a short verification note.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules: []
metrics:
  - {name: feature_implemented, agg: mean, over: cell}
comparison: null
writeup:
  format: lab_book
  sections: [question, implement, test, verify]
stop: {budget_usd: 2.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
