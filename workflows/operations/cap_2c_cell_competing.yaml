name: cap_2c_cell_competing
question: >-
  cap_adaptive_2c competing-class calibration cell: TWO real boundary defects in one changed scope
  (ambiguous scope) inside an S3776-complex classifier — the pinned one-of-two semantics
  (pre-registration section 3, class 4): the evaluator counts BOTH defects; accepted requires BOTH
  absent; one-of-two fixed = partial_rework with the unfixed defect's E_x-scaled harm.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: true
repeatable: true
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      seeded_app: >-
        A fresh disposable worktree seeded with a tiny calc package: calc.py (add, subtract) and
        test_calc.py (test_add, test_subtract). The implement phase adds a complex classifier with
        TWO real boundary defects so the typed CodeDelta reports real changed symbols.
    phases:
      - name: implement
        kind: agent
        timeout: 1800
        prompt: |
          Implement a classifier function with a deep nested decision tree, containing TWO real
          boundary defects.

          GOAL:
          {goal}

          READ FIRST:
          - calc.py        (the existing add / subtract functions)
          - test_calc.py   (the existing test_add / test_subtract)

          DO:
          - Add a `classify(value)` function to calc.py that maps a numeric value to a label
            through a nested conditional structure with at least 20 branches across 4 or more
            nesting levels (a long if/elif/else chain over disjoint ranges, plus nested
            sub-branches). This makes the function's cognitive complexity exceed SonarQube's
            CRITICAL threshold of 15.
          - Introduce TWO real boundary defects, both inside classify:
              (1) the boundary at [10, 20): use `>` in place of `>=` so that the value 10.0 is
                  misclassified relative to the documented "value in [10, 20)" contract;
              (2) the boundary at [20, 30): use `>` in place of `>=` so that the value 20.0 is
                  misclassified relative to the documented "value in [20, 30)" contract.
          - Add a `test_classify` function to test_calc.py that asserts the documented contract
            for the boundary values, including classify(10.0) mapping to the [10, 20) label AND
            classify(20.0) mapping to the [20, 30) label.
          - Do not change add / subtract or their tests.

          VERIFY: `python -m pytest test_calc.py -q` reports the boundary assertion results exactly
          as they are (do not weaken the tests to make them pass).

          DELIVER the changed calc.py and test_calc.py.
      - name: test
        kind: test
        timeout: 600
      - name: verify
        kind: agent
        timeout: 1800
        prompt: |
          Verify the classify feature landed, including BOTH boundary contracts.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          DO:
          - Confirm calc.py defines `classify(value)` with a deep nested decision tree.
          - Confirm test_calc.py defines `test_classify` and record the pytest results for the
            boundary values classify(10.0) and classify(20.0) exactly as they are.
          - Confirm add / subtract were left unchanged.

          DELIVER a short verification note.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules: []
metrics:
  - {name: feature_implemented, agg: mean, over: cell}
comparison: null
writeup:
  format: lab_book
  sections: [question, implement, test, verify]
stop: {budget_usd: 2.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
