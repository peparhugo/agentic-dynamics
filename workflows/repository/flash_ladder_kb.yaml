name: flash_ladder_kb
question: >-
  The flash-exploration ladder's generation cell for the KB-augmented condition (C3): the
  shared-scope retrieval arm, where deepseek/deepseek-v4-flash receives patterns and findings
  from the accumulated corpus (`repository_id: agentic-dynamics`, `acl_scope: public`,
  `pattern_projection: true`) while implementing the `taskman` contract in one session. The
  spec is pinned by SHA256 in the pre-registration addendum; no KB emission, no deploy.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: true
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    rag_augment: true
    rag:
      repository_id: agentic-dynamics
      acl_scope: public
      pattern_projection: true
      emit_self: false
    phases:
      - name: generate
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          Work only in this worktree. Implement a pure-Python, stdlib-only package `taskman`
          (exposing `TaskManager`) satisfying the behavioural contract in
          tests/flash_ladder/taskman_contract_test.py. Read the contract test if useful; do NOT
          modify any test file. Choose the internal design yourself.
          Verify with: python3 -m pytest tests/flash_ladder/taskman_contract_test.py -q
          Iterate until it passes.
          LOG: a brief note on the design and the test result; commit.
      - name: g_test
        kind: test
        scope: implementation
        timeout: 900
        tests:
          - tests/flash_ladder/taskman_contract_test.py
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules:
  - name: ladder_cell_measured
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [ladder_cell_quality]
metrics:
  - {name: ladder_cell_quality, agg: mean, over: cell}
comparison: null
writeup: {format: lab_book, sections: [question, generate, g_test]}
stop: {budget_usd: 2.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
