name: world_model_loop
question: >-
  Can a prior -> execute -> posterior loop with an explicit world model and a written plan
  improve an agent task's quality and verifiability, and produce a posterior update set
  (violations, unknowns discovered, KB/skill updates) at the end?
version: "0.1"
artifact_kind: workflow
intent: measure
side_effects:
  repository: true
  external_services: false
repeatable: true
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules: []
metrics: []
comparison: null
writeup: {format: lab_book, sections: [question, evidence]}
stop: {budget_usd: 2.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_uncertainty}
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    rag_augment: false
    rag:
      emit_self: true
      emit_report: true
      emit_scope: agentic-dynamics
    context:
      domain_context: >-
        THE WORLD-MODEL LOOP. You are one phase of a three-phase loop over the SAME task:
        PRIOR (read + world model + plan) -> EXECUTE (do the work, record deviations) ->
        POSTERIOR (diff the model against reality; name violations and unknowns; produce the
        update set). Read the KB with your scope: `python3 scripts/kb_read.py --query "..."
        --scope agentic-dynamics` (ranked; add `--contains` for an offline scan). Ground every
        claim in a file, a KB record, or a command output — never in memory.
    phases:
      - name: prior
        kind: agent
        scope: proposal_write
        timeout: 1800
        prompt: |
          You are the PRIOR phase of a world-model loop. The task is: {goal}

          Before any implementation:
          1. READ what is known. Use `python3 scripts/kb_read.py --query "..." --scope
             agentic-dynamics` for prior findings/decisions/sessions; `git log` and the code
             tree for the current state; and `python3 scripts/research_fetch.py <url> --out-dir
             notes/sources` only if an external fact is genuinely needed.
          2. WRITE `notes/world_model.md` with these SECTIONS (the execute gate checks them):
             `## Problem`, `## What Exists`, `## Gaps`, `## Sources` — SOURCES lists every KB
             record id, file, and fetched URL (+sha256) you actually used.
          3. WRITE `notes/plan.md` with these SECTIONS (the execute gate checks them):
             `## Files`, `## Tests`, `## Acceptance`, `## Risks`, `## Workstreams`.
             `## Workstreams` decomposes the plan into the units step 4 encodes.
          4. WRITE `notes/plan.units.json` — the MACHINE-READABLE plan the execute phase EXPANDS
             into bounded sub-phases (one per unit, each with its own commit and its own test
             gate). Its shape:
             `{"units": [{"id": "u1", "goal": "...", "files": ["src/..."],
             "tests": ["tests/test_x.py"], "acceptance": "...", "budget_usd": 0.5,
             "depends_on": []}]}`.
             One unit per workstream; `id` a stable token (letters/digits, then `._-`);
             `depends_on` names other unit ids; `tests` the `tests/` paths that verify THAT
             unit (empty for an analysis-only unit); `budget_usd` your estimate — the units'
             budgets must not sum above the run's budget. Scale the count to the work: a small
             plan is ONE unit; a large plan is several bounded ones, never one unbounded turn.
          5. WRITE `notes/sources.jsonl` — one JSON line per source you ACTUALLY used
             (`{"kind": "kb"|"file"|"url", "ref": "<id|path|url>", "sha256": "<hex>"}`; a
             fetched URL carries the sha256 `research_fetch` returned). When no external fact
             was needed, write exactly one line `{"none": true, "reason": "..."}`. The
             `## Sources` section above and this file must agree.

          Do NOT implement — the plan gates the execute phase. Commit all four files.
      - name: execute
        kind: agent
        scope: implementation
        timeout: 3600
        requires_files: [notes/plan.md, notes/sources.jsonl, notes/plan.units.json]
        requires_content:
          notes/plan.md: ["## Files", "## Tests", "## Acceptance"]
        # The loop's open extension (2026-09-21): the runner EXPANDS this one phase into one
        # bounded agent slice per unit in `notes/plan.units.json` plus one independent
        # `kind: test` gate per unit — so a plan with N workstreams becomes N sub-phases, each
        # with its own commit and its own gate, in ONE run. The prompt below is the per-unit
        # template the runner renders (`{unit_id}` / `{unit_goal}` / `{unit_files}` /
        # `{unit_acceptance}`). A malformed plan FAILS this phase with `PLAN_EXPANSION` before
        # any spend.
        expand_from_plan: notes/plan.units.json
        prompt: |
          You are the EXECUTE phase for ONE workstream of a plan ({goal}). The runner has
          expanded this phase into one bounded slice per unit in `notes/plan.units.json`; this
          slice is unit `{unit_id}`.

          THIS UNIT'S GOAL: {unit_goal}
          FILES: {unit_files}
          ACCEPTANCE: {unit_acceptance}

          Implement ONLY this unit, against `notes/plan.md` and `notes/world_model.md`. Do not
          attempt a sibling unit's work — another slice owns it.

          ALWAYS record deviations: APPEND to `notes/deviations.md` — unconditionally. Where
          reality differs from the plan or the world model, do not silently adapt: record it
          (what the plan said, what was true, what you did instead). When this unit deviated in
          nothing, append the explicit-empty record `no deviations`. Never skip the write: a
          stale note left in the slot from a prior run is worse than no note.
          Create the tests the unit names; run the local verification commands it lists.
          Commit your unit's work.
      - name: g_test_gate
        kind: test
        scope: implementation
        timeout: 1800
        requires_files: [notes/plan.md]
        tests_from_plan: notes/plan.md
        prompt: |
          The independent test runner verifies the execute phase's worktree against the
          targets `notes/plan.md` names in its `## Tests` section. Analysis-only runs that
          name no targets SKIP explicitly (recorded on the ledger as `test_gate_note`, with
          no fabricated verdict); code-producing runs are verified by their own declared
          suites — never by the agent's self-report.
      - name: posterior
        kind: agent
        scope: proposal_write
        timeout: 1800
        requires_files: [notes/world_model.md, notes/plan.md, notes/deviations.md]
        prompt: |
          You are the POSTERIOR phase of the world-model loop. The task was: {goal}

          Before trusting any inherited note, check its provenance: run
          `git log -1 -- notes/<file>` for each note you read. A note whose last commit is not
          a commit of THIS run is stale and describes a different task — name it as an unknown,
          never treat it as this run's reality.

          Read `notes/world_model.md`, `notes/plan.md`, `notes/deviations.md`, and the run's
          commits (`git log`, `git diff`). Do NOT change code. WRITE `notes/posterior.md`:

          1. VIOLATIONS: where reality differed from the world model (cite a file/line or commit).
          2. UNKNOWNS DISCOVERED: what we did not know at prior-time (what the next model must carry).
          3. UPDATES: the concrete update set — KB findings to emit, skills/knowledge to create,
             conventions to record — and what should change in the next loop's prior phase.

          Commit the file.
      - name: p2_mint
        kind: agent
        scope: implementation
        timeout: 1800
        requires_files: [notes/posterior.md]
        prompt: |
          You are the MINT phase: turn the loop's own update set into knowledge, through the
          EXISTING producer path — never a hand-written record.

          1. Read `notes/posterior.md` §UPDATES. For every SKILL/PATTERN candidate it names,
             write `notes/skills/<slug>.json` in the producer's shape: `claim`, `population`,
             `conditions`, `support`, `uncertainty`, `evidence` (record ids you cite),
             `source_experiment`, `subject`.
          2. Mint each candidate: `python3 scripts/kb_produce_skill.py --skill-json
             notes/skills/<slug>.json` (the pattern/v1 projection).
          3. WRITE `notes/minted.md`: one line per candidate — `minted | skipped (reason)`.
             A candidate that is not mintable MUST be recorded, never silently dropped.
          4. Generated surfaces are NEVER hand-edited: a candidate lands in the KB; promotion
             to an agent-facing skill is a reviewed commit, not a phase side effect.

          If the posterior names no candidates, write `notes/minted.md` with a single
          `none: <reason>` line — an explicit empty, never a silent skip. Commit your files.
      - name: g_adversarial
        kind: agent
        # F8 (live run-0fad6c313dcd): a read-only scope cannot write the review file this
        # prompt orders it to commit — and a phase without a commit blocks the candidate's
        # promotion (promote verifies per-phase commits). proposal_write carries
        # assemble_docs + git_commit: exactly this phase's job (its review document), while
        # the attack itself stays analytics-only by prompt.
        scope: proposal_write
        timeout: 1800
        requires_files: [notes/world_model.md, notes/plan.md, notes/posterior.md]
        run_model: openai/gpt-5.6-terra
        prompt: |
          ADVERSARIAL REVIEW — you are a DIFFERENT model by design (independence, the canonical
          adversarial phase every cap_* workflow carries). Read `notes/world_model.md`,
          `notes/plan.md`, `notes/sources.jsonl`, `notes/deviations.md`, `notes/posterior.md`,
          `notes/minted.md`, and the run's commits.

          Attack the analysis: which claims are unsupported by a file? which recommendations are
          misleading? where does the posterior overclaim? Check the sources file against the
          world model: every gap marked external must carry a fetched source with a sha256 — an
          external gap with no fetch is a finding. Name at least one falsifier per major claim;
          recompute any number you cite. Write `notes/adversarial_review.md` with a final
          `## FINDING` paragraph and commit it.
