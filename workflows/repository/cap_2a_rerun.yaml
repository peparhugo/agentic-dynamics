name: cap_2a_rerun
question: >-
  Rerun of the 2a shadow calibration with the missing instrumentation wired: does the adaptive
  verifier's proposal (verify_code_change/v1: depth/scope/rework) predict the outcome the
  baseline actually produced, when code_change_risk can actually be minted? The first campaign
  (cap_2a_shadow_calibration, superseded) returned hit-rate undefined (n=0) — the seam refused
  because no risk term was measurable. This campaign fixes that (p1) and re-runs the calibration
  (p2-p6) against the same fixed scoring semantics and the same 2b gate (hit-rate >= 0.6 with a
  stated n and Wilson interval). Design: cap_evidence_integrity_design.md §6.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: true
repeatable: false
supersedes: cap_2a_shadow_calibration
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      domain_context: >-
        PROVISIONAL DomainProfile. domain: software_delivery / CAP evidence integrity.
        canonical_sources: [docs/designs/current/cap_evidence_integrity_design.md §6,
        docs/designs/current/cap_2a_shadow_calibration.md (the FIRST campaign's verdict —
        the blocker chain + fix path this campaign executes),
        docs/reviews/cap_2a_shadow_calibration_adversary.md + _known_safe.md (p6 limitations
        F1 duplicate-qname CALLS, F2 no test_gate cells, F3 canonical KB facts on killed runs),
        src/agentic_dynamics/control/verify_proposal.py (the seam + refuse-to-run contract),
        src/agentic_dynamics/control/evidence_analyzer.py (graph leg + 30s deadline),
        src/agentic_dynamics/control/reducers/code_change_facts.py (RISK_WEIGHTS [P] provenance),
        src/agentic_dynamics/measurement/sonar.py (run_sonar_analysis — fetch-first,
        revision-scoped key, stale-refused), src/agentic_dynamics/measurement/
        lsp_diagnostics.py (run_diagnostics -> LSPReport),
        src/agentic_dynamics/runtime/change_analyzer.py (ChangeInput.sonar/lsp payloads)].
        policies: [measure_before_actuate, apply_stays_off, shadow_is_never_applied,
        measure_one_cell_cost_before_budget, fixed_scoring_semantics]
      challenge_context: >-
        PROVISIONAL ChallengeProfile. challenge: research (measurement campaign rerun).
        deliberation: [wire analyzers, run cells under shadow, score proposals vs realized
        outcomes, hit-rate gate, verdict].
        session_policy: {default: fork_per_phase}
      current_state: >-
        First campaign COMPLETED (cap_2a_shadow_calibration, superseded): 2b gate NOT met —
        hit-rate undefined, n=0. Blocker: the proposal seam refused (ValueError, refuse-to-run)
        because code_change_risk was never minted: _run_change_analysis injects no sonar/lsp
        into ChangeInput, the chosen cells changed no Python symbols (tests-ratio term deferred),
        and the graph leg was impractical at full-repo scale. Two live-found fixes landed during
        that campaign and are MERGED: the graph-leg 30s client deadline (929435714) and the
        versioned entity_id indexes (df71d7c32). The seam, manifests, scoring SEMANTICS, and the
        p6 two-output discipline all worked — the campaign measured zero outcomes for exactly one
        reason: no risk term. THIS campaign wires the analyzers (p1) and re-runs against the
        SAME fixed scoring semantics. p6 accepted limitations carried forward: F1 duplicate
        qualified names can collapse in the CALLS edge (impact expansion may be imprecise for
        same-named symbols; never exercised in the first campaign); F2 no candidate had
        test_gate/kind:test (independent test evidence missing — cells HERE must have it);
        F3 canonical KB facts silently absent when a run is killed mid-phase.
      hard_rules: >-
        (1) Every phase commits '[workflow] <phase>' with green checks; every measurement phase
        writes a durable PASS/FAIL log even when it stops early. (2) APPLY STAYS OFF:
        verify/rework/continue proposals are shadow-only, never applied, never armed; no
        control_route, no actuation event, and no proposal may trigger rework. (3) The proposal,
        baseline, outcome, and score are separate records; a model narrative is never the sole
        evidence for any of them. (4) Before a cell runs, write an immutable candidate manifest
        containing cell_id, exact spec path and git revision, goal, model/backend, source
        baseline revision, worktree path, forecast cost, and graph mode. A cell not in that
        manifest is not run. (5) p2 measures ONE representative cell's full target-model cost;
        p3 may use that result only as a forecast and must report forecast versus actual
        separately. (6) Every cell gets a fresh disposable worktree and unique FINOPS_CELL_ID
        from the same source revision; no worktree reuse, reset, or cross-cell artifacts. (7) A
        graph-down or analyzer-down cell is FLAGGED, never silently dropped or mislabeled;
        delta-only facts survive, impacted counts are unknown (not zero), and blast-radius error
        is null with an explicit reason. (8) Every proposal and outcome records the same cell_id,
        baseline revision, analyzed revision, and contract/schema version; mismatches are
        invalid, not scored. (9) Every number in the verdict cites a produced JSON and its
        SHA256; unknown outcomes stay in the dataset with numerator/denominator/unknown counts
        printed. (10) The 2b threshold is hit-rate >= 0.6 with stated n; report a Wilson 95%
        interval and mark small-n results descriptive-only. (11) No generated-surface edits, no
        secrets in artifacts, no external actuation. (12) p6 is mandatory: every finding
        re-verified against the tree, every non-finding in a known-safe output; no bare PASS.
        (13) Resumable only when spec version, goal hash, source revision, and candidate-manifest
        hash match; otherwise restart. (14) CELLS MUST HAVE INDEPENDENT TEST EVIDENCE: every ran
        cell's spec must include a kind:test phase (test_gate) so test_executed_success comes
        from runtime.test_runner — if none of the candidates has one, amend the smallest
        candidate (recorded side effect committed on this branch) or author the bespoke
        calibration cell (p2). (15) THE p4 SCORING SEMANTICS ARE FIXED: they are reused verbatim
        from cap_2a_shadow_calibration v0.2 (hit table, denominators, Wilson interval) — this
        campaign measures against them, it does not renegotiate them.
      read_first: >-
        docs/designs/current/cap_2a_shadow_calibration.md (the verdict — the blocker chain),
        docs/reviews/cap_2a_shadow_calibration_adversary.md + _known_safe.md (F1/F2/F3),
        src/agentic_dynamics/control/verify_proposal.py (refusal contract),
        src/agentic_dynamics/runtime/workflow_runner.py (_run_change_analysis — the p1 seam),
        src/agentic_dynamics/measurement/sonar.py (run_sonar_analysis at :190 — fetch-first,
        revision-scoped key, stale-refused) + lsp_diagnostics.py (run_diagnostics at :121),
        src/agentic_dynamics/control/reducers/code_change_facts.py (RISK_WEIGHTS, the
        sonar_analysis/lsp_analysis evidence payload shapes),
        src/agentic_dynamics/runtime/change_analyzer.py (ChangeInput.sonar/lsp),
        scripts/run_workflow.py (--change-analysis, --change-analysis-graph),
        experiments/contexts/verify_code_change.yaml (actions: verify/rework/continue)
      run_shape: >-
        SINGLE-model: --model deepseek/deepseek-v4-pro --backend opencode (operator preference;
        sonnet when Claude OAuth is up). One branch (feature/cap-2a-rerun); each phase commits
        [workflow] <phase>. Each measurement cell uses a fresh disposable worktree from the
        recorded source revision with a unique FINOPS_CELL_ID, then copies only its immutable
        ledger/proposal/outcome artifacts into the outer worktree. Never put a live Neo4j
        password, token, or full connection URI with credentials in a committed artifact.
    phases:
      - name: p1_wire_analyzers
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          SHAPE: wire sonar + lsp into the phase-boundary evidence seam so code_change_risk can
          be minted (the first campaign's named blocker). In src/agentic_dynamics/runtime/
          workflow_runner.py's _run_change_analysis, populate ChangeInput.sonar and
          ChangeInput.lsp before analyze():
          * sonar: run_sonar_analysis(wd, revision=<full analyzed sha>) — fetch-first,
            revision-scoped project key, stale-refused honored (a stale-refused result is a
            measured status, not a fabrication); the payload matches the reducer's
            sonar_analysis evidence shape ({status, revision_matches|None, ...}).
          * lsp: run_diagnostics(wd, profile) at the phase commit's tree state (the worktree IS
            at the analyzed commit when this runs) — payload matches lsp_analysis
            ({status, new_error_count|None, tool}).
          Both calls run under the SAME hard-deadline discipline as the graph leg (the first
          campaign's hang lesson): a non-returning analyzer degrades to its measured unavailable
          status (terms omitted, never a fabricated zero, never a hung phase).
          VERIFY: hermetic tests — (a) a phase commit with a real symbol change + injected
          sonar/lsp payloads mints new_sonar_critical_count/new_lsp_error_count and
          code_change_risk is non-None; (b) unavailable/stale-refused analyzers omit the terms
          and risk renormalizes (or stays None when NO term is measurable — the null-not-zero
          rule); (c) a hanging analyzer call degrades within the deadline, never hangs; (d) the
          seam's refusal contract still holds (a malformed proposal is still refused). Run
          python3 -m pytest tests/test_change_analyzer.py tests/test_workflow_runner.py
          tests/test_run_workflow_graph_cli.py tests/test_code_change_facts.py
          tests/test_versioned_graph.py tests/test_graph.py tests/test_dependency_direction.py
          tests/test_evidence_prereq_gate.py — all green.
          LIVE PROBE (mandatory): run ONE real phase commit of a small symbol-level spec with
          --change-analysis (and the graph) and show the ledger records code_change_risk
          non-None — the blocker chain is broken. If the probe still shows risk=None for a
          symbol-changing commit, FAIL the phase with the evidence; do not declare p1 complete
          on hermetic tests alone.
          GUARD: without --change-analysis the run is byte-identical to the merged main (the
          seam stays inert); no credentials in logs or committed artifacts.
          DELIVER: the wired seam + tests + the live-probe ledger row, committed.
          LOG: files touched, test result, probe result (risk value per commit); PASS/FAIL;
          commit.
      - name: p2_measure_one_cell
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          SHAPE: measure ONE full target-model cell end-to-end before any p3 budget is committed
          (E4 lesson, unchanged from the first campaign). Candidate paths, with historical index
          costs (NOT target-model measurements):
          workflows/repository/finding_economics_closure.yaml ($1.2820),
          workflows/repository/canonical_publication_closure.yaml ($1.4475),
          workflows/operations/queue_steer.yaml ($0.0330),
          workflows/operations/labbook_refresh.yaml ($0.0275).
          SELECTION RULE (hard rule 14): the chosen cell MUST change Python symbols in its agent
          phases AND have independent test evidence (a kind:test phase / test_gate: true so
          test_executed_success comes from runtime.test_runner). Check each candidate's phases,
          side effects, and latest ledger first. If no candidate has a kind:test phase, either
          amend the smallest candidate (add a kind:test verify phase; the amendment is a
          RECORDED SIDE EFFECT committed on this branch, and the manifest records the amended
          path hash) or author the bespoke calibration cell
          (workflows/operations/cap_2a_calibration_cell.yaml — a 3-phase workflow: implement a
          small symbol-level feature against the seeded app, kind:test phase, verify phase).
          Write the candidate manifest FIRST (candidate_id, exact path, path SHA256, target
          model/backend, goal, source baseline revision, fresh worktree, FINOPS_CELL_ID, graph
          mode, historical cost); then select exactly one candidate and state the reason.
          RUN from the recorded source revision in a fresh disposable worktree:
          python3 scripts/run_workflow.py --spec <exact path> --goal <short goal>
          --model deepseek/deepseek-v4-pro --backend opencode --change-analysis
          [--change-analysis-graph bolt://localhost:7687] --workdir <worktree>.
          The proposal seam MUST emit for this cell (that is p1's promise): if
          record_verify_proposal still refuses, record the refusal reason + the facts present,
          and FAIL the phase — a refused proposal here is a p1 defect, not a cell problem.
          RECORD one immutable cell manifest and one ledger row per committed phase: cell_id,
          spec_id/version, model/backend, baseline revision, analyzed full revision, graph_status,
          sonar/lsp status (available/unavailable/stale-refused), facts (omitted facts explicitly
          listed), proposal id/schema (applied=false), cost, duration, test result, artifact
          SHA256s. Graph-down or analyzer-down: flag, never silently drop; the cell still
          contributes to the shadow dataset.
          DELIVER: candidate manifest, selected cell manifest, phase ledger, validated proposal
          records, analyzer reachability results, exact actual cost/duration, and a p3 forecast
          budget of measured target cost x 2 headroom, labeled FORECAST. No p3 cell may run
          until p2's manifest and measured-cost JSON are committed.
          LOG: cost/duration/facts/proposal table; PASS/FAIL; commit.
      - name: p3_run_shadow_cells
        kind: agent
        timeout: 14400
        prompt: |
          GOAL: {goal}
          SHAPE: run 2-3 remaining small cells selected from the p2 candidate manifest. Before
          ANY execution, commit a p3 execution manifest (cell_id, exact spec path + path SHA256,
          source baseline revision, goal hash, model/backend, fresh worktree, FINOPS_CELL_ID,
          graph mode, p2-derived FORECAST budget, stop condition). Do not add an unlisted cell
          after the fact. Each cell: fresh worktree from the recorded source revision; baseline
          runs exactly once; BEFORE the outcome is known, emit + persist one verify_code_change/
          v1 shadow proposal ({verify, rework, continue}, depth, scope, facts_used, analyzed
          revision, expected effect, schema version, applied=false) and validate it against the
          contract — malformed/stale proposals rejected, never hand-authored. Then let the
          baseline complete WITHOUT consuming the proposal (no adaptive retry, no rework, no
          route change, no control_route, no actuation, no hidden second attempt).
          Define the realized outcome INDEPENDENTLY from the proposal: the baseline's immutable
          commit + the runtime.test_runner verdict (test_executed_success) + an independent
          post-hoc evaluator. Fixed enum {no_rework, verification_only, targeted_rework,
          broad_rework, unknown}; record realized_depth and a stable realized_symbol_set
          (repository_id + revision + file_path + qualified_name + kind). Mismatched baseline/
          worktree/input/analyzed revision/test result/outcome evidence => outcome=unknown +
          invalid_for the requiring metric; never repair by inference.
          Graph-down or analyzer-down cells run and stay in the dataset with a flag; the
          predicted impacted count and blast-radius error are null when unavailable, never zero.
          Persist one cell manifest, one proposal record, one independent outcome record, and
          one cost/phase ledger per cell. Hash every input and output. Stop before the next cell
          if cumulative actual cost would exceed the p2-derived forecast envelope or the stop
          budget; record the stopped cell as not-run, never silently omitted.
          DELIVER: immutable p3 manifest, cell ledgers, validated proposals, independent
          outcomes, status flags, forecast-vs-actual cost table, artifact SHA256 index.
          LOG: per-cell cost/duration/proposal/outcome table; PASS/FAIL; commit.
      - name: p4_score_hit_rate
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          SHAPE: score only immutable p2/p3 artifacts and first validate their joins. Emit
          experiments/results/cap_2a_rerun_score_<UTC timestamp>.json with schema_version
          cap_2a_score/v1, input artifact paths + SHA256s, spec version, source revision,
          candidate-manifest hash, and a per-cell row. Refuse to score a row whose cell_id,
          baseline revision, analyzed revision, proposal_id, or contract version does not match;
          emit it as invalid/flagged instead.
          SEMANTICS — FIXED, reused verbatim from cap_2a_shadow_calibration v0.2 (hard rule 15):
          * proposal hit-rate is a binary per-proposal field. 1 only when the proposal's action
            AND depth match the independently adjudicated realized need. `continue` hits only
            `no_rework` (and may not claim verification depth); `verify` hits
            `verification_only` when proposed depth >= realized_depth; `rework` hits
            `targeted_rework` or `broad_rework` only when its scope contains the realized scope
            and its depth is >= realized_depth. A proposal with missing/invalid action, depth,
            scope, or an unknown outcome is not a hit.
          * numerator = sum(hit=1); denominator = proposals with a complete proposal and
            recorded non-unknown outcome. Publish n_scored, n_hits, n_unknown_outcome,
            n_invalid_join, n_not_run separately; unknown rows remain in the table.
          * predicted-vs-observed blast-radius error =
            abs(predicted_impacted_symbol_count - len(realized_symbol_set)), both with stable
            symbol identity; realized set from the independent evaluator, not the proposal.
            Graph unavailable => error=null (graph_flagged), never 0; report n_available.
          * risk calibration: distribution/table of code_change_risk bucket vs realized rework
            enum; not called causal or predictive with this counterfactual design.
          Compute per-cell rows FIRST, then aggregates: graph-unavailable rate,
          outcome-recorded rate, proposal-validation rate, hit-rate, n, Wilson 95% interval,
          blast-radius mean/median over available predictions, all flagged/unknown counts.
          Compare against the first campaign: the rerun must report whether risk was minted
          (risk_mint_rate = cells with non-None code_change_risk / ran cells) — the blocker
          chain's fix is a measured outcome, not a claim.
          DELIVER: the scoring JSON + a validation result proving every verdict number traces to
          one JSON field. No recommendation about 2b is made in this phase.
          LOG: hit-rate, blast-radius delta, risk_mint_rate, flagged cells; PASS/FAIL; commit.
      - name: p5_verdict
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          DELIVER exactly one file: docs/designs/current/cap_2a_rerun.md
          SHAPE: include the source revision, spec version, candidate-manifest hash, and SHA256
          for every p4 JSON used. Cells table: cell_id, exact spec/path, model and backend,
          baseline/analyzed revisions, graph_status + sonar/lsp status, forecast and actual
          cost, duration, proposal action/depth/scope, proposal validity, realized
          outcome/depth/symbol-set size, hit/miss/unknown/invalid status, blast-radius error or
          null + reason.
          ANALYSIS: proposal hit-rate as n_hits/n_scored, Wilson 95% interval, printed
          unknown/invalid/not-run denominators, graph-down + analyzer-down rates,
          outcome-recorded rate, risk_mint_rate, predicted-vs-observed blast radius over rows
          with an available prediction.
          VERDICT: state exactly whether the raw 2b calibration threshold (hit-rate >= 0.6) is
          met, with n and interval; descriptive-only when n is below the declared minimum or the
          lower confidence bound is below 0.6 — never a tiny sample as authorization. If the
          gate clears, state that 2b is eligible for design review, NOT that 2b has run. If it
          does not clear, state the additional valid outcomes needed and the blocker — including
          whether p1's wiring worked (risk_mint_rate) or the blocker moved.
          Compare with the first campaign explicitly: zero outcomes -> now N — the fix path
          either worked or did not, and the verdict says which with the numbers.
          2b prerequisites per design §6 are mandatory and must be restated (randomized
          static-vs-adaptive assignment, pre-registered non-inferiority margin + outcome metric,
          independent test execution, budget/SLA guard, outcome non-inferiority under adaptive
          control). p5 itself never launches a run, flips control_route, or arms actuation.
          GUARD: every number cites a p4 JSON field; no recommendation without n, denominator,
          uncertainty, and flagged-cell treatment.
          LOG: PASS/FAIL; commit.
      - name: p6_adversarial
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          ROLE: adversarial verifier — try to falsify the campaign. Attack (each re-verified
          against the tree, never imagined): the first campaign's accepted limitations re-attacked
          — (F1) duplicate qualified names collapsing in the CALLS edge (did ANY scored number
          use impacted expansion over same-named symbols?), (F2) cells without independent
          test_runner evidence (test_executed_success must come from runtime.test_runner for
          every ran cell), (F3) canonical KB facts silently absent (any phase whose fact
          auto-emit is missing?); plus: wrong baseline (verifier and baseline on different
          inputs/worktrees), cherry-picked cells, proposals recorded but never validated against
          realized outcomes, graph-down or analyzer-down cells silently dropped or mislabeled,
          stale sonar facts (analyzed_sha mismatch, stale-refused ignored), risk weights drifting
          from the [P] provenance in the reducer docstring, hit-rate denominator games, p1 wiring
          that changes no-graph/no-analyzer behavior (byte-identical claim falsifiable by diff),
          risk minted but the live probe's ledger row falsified, proposal/outcome circular
          labeling, malformed or stale proposal accepted, `applied` true or any actuation call,
          unclosed Neo4j driver, leaked credentials, p4 JSON hashes that do not match the verdict
          citations. Every finding: fix it in code/spec/artifacts or record it as an accepted
          limitation with reasoning and residual risk.
          Deliver TWO exact outputs:
          1. docs/reviews/cap_2a_rerun_adversary.md — attack, evidence path/line, result, fix or
             accepted limitation, re-test for every finding; include a re-stated verdict.
          2. docs/reviews/cap_2a_rerun_known_safe.md — every attempted attack that did not
             falsify the campaign, what was tried, artifact/tree evidence, and why it is safe.
             Not a generic checklist; must not say only PASS.
          Do not silently rewrite p4 JSONs or the p5 verdict; corrections point to the corrected
          artifact with both old/new hashes.
          LOG: finding table + known-safe list; PASS/FAIL; commit.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules:
  - name: cap_2a_rerun_analyzer_wiring
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [sonar_wired, lsp_wired, risk_mintable]
  - name: cap_2a_rerun_cells_run
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [shadow_cells_run, proposals_recorded, outcomes_recorded]
  - name: cap_2a_rerun_scoring
    plane: measurement
    evidence_class: "[C]"
    requires: [shadow_cells_run, proposals_recorded, outcomes_recorded]
    produces: [proposal_hit_rate, predicted_vs_observed_blast_radius, risk_mint_rate]
  - name: cap_2a_rerun_verifier_gate
    plane: control
    evidence_class: "[H]"
    decision_type: verify_code_change
    requires_facts:
      - {fact: sonar_analysis_status, scope: self, value_type: enum,
         on_missing: classify, on_conflict: halt}
      - {fact: lsp_analysis_status, scope: self, value_type: enum,
         on_missing: classify, on_conflict: halt}
      - {fact: analysis_revision_matches, scope: self, value_type: bool,
         on_missing: classify, on_conflict: halt}
      - {fact: changed_symbol_count, scope: self, value_type: int, on_missing: halt}
      - {fact: ast_parse_coverage, scope: self, value_type: float,
         on_missing: halt, on_conflict: halt}
      - {fact: code_change_risk, scope: self, value_type: float,
         on_missing: halt, on_conflict: halt}
      - {fact: new_sonar_critical_count, scope: self, value_type: int,
         on_missing: classify, on_conflict: halt}
      - {fact: new_lsp_error_count, scope: self, value_type: int,
         on_missing: classify, on_conflict: halt}
      - {fact: impacted_symbol_count, scope: self, value_type: int,
         on_missing: classify, on_conflict: halt}
      - {fact: changed_symbols_with_tests_ratio, scope: self, value_type: float,
         on_missing: classify, on_conflict: halt}
    produces: [gate_decision]
metrics:
  - {name: shadow_cells_run, agg: mean, over: cell}
  - {name: proposal_hit_rate, agg: mean, over: cell}
  - {name: risk_mint_rate, agg: mean, over: cell}
  - {name: predicted_vs_observed_blast_radius, agg: mean, over: cell}
  - {name: gate_decision, agg: mean, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
writeup:
  format: lab_book
  sections: [question, p1_wire_analyzers, p2_measure_one_cell, p3_run_shadow_cells, p4_score_hit_rate, p5_verdict, p6_adversarial]
stop: {budget_usd: 20.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
