name: control_room_apply_skills
question: >-
  Make the Control Room's resting screen WORKING and honest — the run row reads without
  mid-word truncation, the state language renders lifecycle + attention from the packet's
  EMITTED fields only, and the truth strip carries real provenance or a labelled unknown —
  executed through the workflow path with the RENDER GATE's required acceptance profile
  (captured screenshots), never by hand-editing.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: true
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules: []
metrics: []
comparison: null
writeup: {format: lab_book, sections: [question, evidence]}
stop: {budget_usd: 4.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_uncertainty}
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    rag_augment: true
    rag:
      emit_self: true
      emit_report: true
      emit_scope: agentic-dynamics
    context:
      domain_context: >-
        CONTROL ROOM, APPLYING OUR SKILLS. The committed specs are the brief (read them FIRST,
        they carry the detail): workflows/repository/control_room_run_states.yaml (the E10 run
        row + per-state screens; no mid-word truncation at 1440x900 / 1024x768 / 390x844;
        packet-emitted values only; unknown renders as a labelled unknown) and
        workflows/repository/control_room_working_slice.yaml (the bounded UI slice; the
        dynamic-workflow execution is PARKED). The server is apps/control_room/server.py
        (routes under apps/control_room/routes/, clients/, static/); its read contracts are
        documented in docs/architecture/current/supervisor_design.md and apps/website-style
        truth rules. THE ACCEPTANCE IS THE RENDER GATE: a UI change's acceptance is the render
        gate's REQUIRED profile with CAPTURED screenshots at the declared viewports — a run
        that records zero captures is a FAIL, structurally, and `--live` alone is not the full
        profile. The server must be up for the capture passes (start it if needed:
        `python3 apps/control_room/server.py`, FINOPS_PORT default 8000). The control-room
        skill is the read-side how-to (skills: control-room) — use it, don't guess. This spec
        exists because the room "has been restored but is still clunky" (controller,
        2026-09-22): the fix rides the workflow path, not hand edits.
    phases:
      - name: prior
        kind: agent
        scope: proposal_write
        timeout: 1200
        prompt: |
          Read the two committed control_room specs, the server's routes, the render gate's
          required profile (find it in the repo: grep for the render gate / acceptance profile
          tooling and its fixtures), and the current resting-screen code. Write
          `notes/world_model.md` (`## Problem`, `## What Exists`, `## Gaps`, `## Sources`) and
          `notes/plan.md` (`## Files`, `## Tests`, `## Acceptance`, `## Risks`): the concrete
          slices (run row first, then state language, then truth strip), the selectors/fixtures
          that keep working, and the exact render-gate command with its capture list. Write
          `notes/sources.jsonl`. Commit.
      - name: execute
        kind: agent
        scope: implementation
        timeout: 3600
        requires_files: [notes/plan.md, notes/sources.jsonl]
        prompt: |
          Implement the plan's slices, packet-emitted values only; unknown renders as a
          labelled unknown; never fabricate a value the read services do not emit. Keep every
          render-gate fixture and selector working. Run the server and the render gate with its
          REQUIRED acceptance profile — the captured screenshots are the evidence, and a
          zero-capture run is a failure. Commit your work.
      - name: g_test_gate
        kind: test
        scope: implementation
        timeout: 1800
        requires_files: [notes/plan.md]
        tests_from_plan: notes/plan.md
        prompt: |
          The independent runner verifies the worktree against the plan's targets.
      - name: posterior
        kind: agent
        scope: proposal_write
        timeout: 900
        requires_files: [notes/world_model.md, notes/plan.md]
        prompt: |
          Diff the plan against what landed. WRITE `notes/posterior.md` (`## Violations`,
          `## Unknowns`, `## UPDATES`): which slices landed, the capture artifacts' paths, the
          clunkiness that remains (ordered). Commit.
      - name: g_adversarial
        kind: agent
        scope: proposal_write
        timeout: 1800
        run_model: openai/gpt-5.6-terra
        prompt: |
          ADVERSARIAL REVIEW — a different model by design. Read the notes, the code, and the
          captures. Attack: does any cell derive a consequential value on the client? does an
          "unknown" label hide a value the packet actually carried? do the captures show the
          declared viewports with the declared content, or merely exist? Name at least one
          falsifier per major claim. Write `notes/adversarial_review.md` with a final
          `## FINDING` paragraph and commit it.
