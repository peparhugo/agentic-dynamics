name: cap_2a_rerun2
question: >-
  Fix the verifier's measured over-prediction and re-run the calibration: the rerun's p6
  diagnosed severity conflation (new_sonar_critical_count counts ALL bugs+vulnerabilities —
  a MAJOR test-style finding drove p3b's rework) as the root cause of hit-rate 0/3, and the
  verifier's action/depth mapping is unfitted ("deliberately not fitted to any data"). This
  campaign (a) runs a dedicated RESEARCH phase (p0) that pins the measurement semantics before
  any code, (b) implements the pinned reducer v2 (severity-filtered, change-introduced),
  (c) runs outcome-spread cells (clean/critical/style) so the rework branch finally has
  calibration data, and (d) delivers the fitted v2 mapping as the verdict's core output.
  Design: docs/designs/current/cap_2a_rerun2_design.md (accepted — the authority this campaign
  executes).
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: true
repeatable: false
supersedes: cap_2a_rerun
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      domain_context: >-
        PROVISIONAL DomainProfile. domain: software_delivery / CAP evidence integrity.
        canonical_sources: [docs/designs/current/cap_2a_rerun2_design.md (ACCEPTED — the
        pinned semantics; read FIRST), docs/designs/current/cap_2a_rerun.md (the prior
        verdict), docs/reviews/cap_2a_rerun_adversary.md (severity-conflation limitation),
        src/agentic_dynamics/control/reducers/code_change_facts.py (RISK_WEIGHTS + term
        definitions), src/agentic_dynamics/control/verify_proposal.py (the v1 mapping — the
        TREATMENT, code-unchanged this campaign), src/agentic_dynamics/measurement/sonar.py
        (run_sonar_analysis, compute_sonar_diff, SonarMetrics), src/agentic_dynamics/
        measurement/lsp_diagnostics.py (run_diagnostics, _parse_mypy), src/agentic_dynamics/
        runtime/workflow_runner.py (_run_change_analysis — the seam), experiments/results/
        cap_2a_rerun_score_20260826T001107Z.json (the rerun's rows — the first calibration
        rows)].
        policies: [measure_before_actuate, apply_stays_off, shadow_is_never_applied,
        measure_one_cell_cost_before_budget, fixed_scoring_semantics, research_before_code]
      challenge_context: >-
        PROVISIONAL ChallengeProfile. challenge: research (measurement campaign — fix + rerun).
        deliberation: [research and pin semantics, implement pinned measurement, outcome-spread
        cells, score with calibration table, fitted-mapping verdict, adversarial re-attack].
        session_policy: {default: fork_per_phase}
      current_state: >-
        rerun COMPLETED (cap_2a_rerun, superseded): hit-rate 0/3 (Wilson [0, 0.5615],
        descriptive-only n=3); risk_mint_rate=1.0 (the campaign-1 blocker is broken). The
        failure is systematic over-prediction, root-caused by p6: new_sonar_critical_count
        counts bugs+vulnerabilities at ANY severity (SonarMetrics is measures-only — no
        severity dimension), so MAJOR test-style findings (python:S1244) inflate risk and fire
        the rework/verify branches; "new" is not a delta (count at the analyzed revision, not
        change-introduced); _risk_depth (0.15/0.3) and VERIFY_RISK_THRESHOLD are unfitted;
        all 3 cells realized no_rework (the rework branch has zero calibration data). Also
        known: pyright CLI is broken on this machine (bundled nodeenv node cannot load
        libatomic.so.1); mypy is supported by lsp_diagnostics and pure-python; SonarQube runs
        at 127.0.0.1:9000 and held the analyses the rerun's fetch-first used. p0 must pin
        every one of these before p1 writes code.
      hard_rules: >-
        (1) Every phase commits '[workflow] <phase>' with green checks; every measurement phase
        writes a durable PASS/FAIL log even when it stops early. (2) APPLY STAYS OFF:
        verify/rework/continue proposals are shadow-only, never applied, never armed; no
        control_route, no actuation event, and no proposal may trigger rework. (3) Proposal,
        baseline, outcome, and score are separate records; a model narrative is never the sole
        evidence for any of them. (4) Candidate manifest FIRST (cell_id, exact spec path + path
        SHA256, goal, model/backend, source baseline revision, worktree, FINOPS_CELL_ID, graph
        mode, forecast cost); a cell not in the manifest is not run. (5) p2 measures ONE cell's
        full target-model cost; p3 uses it only as forecast and reports forecast vs actual
        separately. (6) Fresh disposable worktree + unique FINOPS_CELL_ID per cell; no worktree
        reuse or cross-cell artifacts. (7) Graph-down or analyzer-down cells are FLAGGED, never
        silently dropped; counts unknown (not zero); blast-radius error null with a reason. (8)
        Proposal and outcome record the same cell_id, baseline revision, analyzed revision,
        contract version; mismatches are invalid, not scored. (9) Every verdict number cites a
        produced JSON and its SHA256; unknown outcomes stay in the dataset with printed
        denominators. (10) 2b threshold is hit-rate >= 0.6 with stated n and Wilson 95%;
        small-n is descriptive-only. (11) No generated-surface edits, no secrets in artifacts,
        no external actuation. (12) p6 mandatory: findings re-verified against the tree,
        known-safe output, no bare PASS. (13) Resumable only when spec version, goal hash,
        source revision, and candidate-manifest hash match. (14) RESEARCH BEFORE CODE: p1 MUST
        NOT start until p0's measurement design doc
        (docs/designs/current/cap_2a_rerun2_measurement_design.md) is committed with no
        placeholders; a p0 that cannot pin a deliverable must state the design-doc fallback
        (§RC6) — recording a capability gap is fine, inventing semantics is not. (15) THE p4
        SCORING SEMANTICS ARE FIXED (verbatim from cap_2a_shadow_calibration v0.2 / the rerun);
        this campaign adds the calibration table but renegotiates nothing. (16) THE VERIFIER
        MAPPING IS THE TREATMENT: build_verify_proposal / _risk_depth / VERIFY_RISK_THRESHOLD
        are code-unchanged this campaign; the fitted v2 mapping is the p5 verdict's deliverable.
      read_first: >-
        docs/designs/current/cap_2a_rerun2_design.md (FIRST — the accepted authority, §4 p0's
        R1-R4 + deliverables), docs/designs/current/cap_2a_rerun.md, docs/reviews/
        cap_2a_rerun_adversary.md (limitation 1 — severity conflation),
        src/agentic_dynamics/control/reducers/code_change_facts.py (RISK_WEIGHTS, sonar/lsp
        evidence shapes), src/agentic_dynamics/control/verify_proposal.py (the treatment),
        src/agentic_dynamics/measurement/sonar.py (:190 run_sonar_analysis, :162
        compute_sonar_diff, :89 SonarMetrics), src/agentic_dynamics/measurement/
        lsp_diagnostics.py (:121 run_diagnostics, :234 _parse_mypy),
        src/agentic_dynamics/runtime/workflow_runner.py (_run_change_analysis, _sonar_evidence,
        _lsp_evidence, _call_with_deadline), experiments/results/
        cap_2a_rerun_score_20260826T001107Z.json (the first calibration rows)
      run_shape: >-
        SINGLE-model: --model deepseek/deepseek-v4-pro --backend opencode (operator preference;
        sonnet when Claude OAuth is up). One branch (feature/cap-2a-rerun2); each phase commits
        [workflow] <phase>. Each measurement cell uses a fresh disposable worktree from the
        recorded source revision with a unique FINOPS_CELL_ID, then copies only its immutable
        ledger/proposal/outcome artifacts into the outer worktree. Never put credentials in
        committed artifacts.
    phases:
      - name: p0_research
        kind: agent
        timeout: 14400
        prompt: |
          GOAL: {goal}
          ROLE: the research phase — DEEP RESEARCH BEFORE ANY CODE. Design doc §4 (p0) is the
          authority; execute R1-R4 and deliver the measurement design doc. NO implementation in
          this phase (no reducer edits, no seam edits, no cell-spec edits beyond drafts in the
          doc).
          R1 — PROBE the local SonarQube server (127.0.0.1:9000): authenticate with the
          scanner env credentials (see sonar.py SONAR_URL_DEFAULT/USER/PASSWORD); enumerate the
          API — does api/issues/search exist and return per-issue records (rule, severity,
          component, line)? Does it support sinceLeakPeriod / new-code filtering? Do the
          existing analyses (the rerun's fetch-first cache) carry issue records or measures
          only? Can the server report issues per analysis revision (before vs after)? Record
          every endpoint probed with its response shape.
          R2 — PROBE the scanner: is sonar-scanner/java obtainable on this machine (existing
          binary, apt, docker)? Can a FRESH analysis be produced at all? (The rerun's cells
          were sonar=available via fetch-first — establish whether rerun2 cells can get fresh
          per-revision analyses or must reuse the existing analysis shape.)
          R3 — PROBE the LSP tool: pyright is broken here (bundled nodeenv node cannot load
          libatomic.so.1) — is mypy runnable (pip-installable, pure-python, _parse_mypy
          supported)? Pin the tool + the exact invocation.
          R4 — READ the pinned semantics: code_change_facts.py RISK_WEIGHTS + term definitions;
          verify_proposal.py (the v1 mapping — the TREATMENT, must stay code-unchanged);
          sonar.py compute_sonar_diff; the rerun's p4 score JSON rows (the first three
          calibration rows: risk -> realized outcome).
          DELIVER exactly one committed file: docs/designs/current/cap_2a_rerun2_measurement_design.md
          with NO placeholders, containing: (1) the chosen transport — option A server-native
          (api/issues/search severity+leak filter) or option B client diff (before/after issue
          identity) or the design-doc §RC6 fallback — with the exact API calls / signatures and
          their output shapes; (2) the reducer v2 term definitions verbatim (severity filter
          BLOCKER+CRITICAL, novelty rule by (rule,file,line) identity) + the [P] weight table
          (unchanged, or re-weighted ONLY with design-doc provenance) + the version bump
          (code_change_facts/v1 -> /v2); (3) the LSP tool pin + diagnostics delta rule; (4) the
          three cell-variant specs' exact prompts (clean / critical / style stimulus per design
          §RC5); (5) the p4 calibration-table JSON schema (field names). If any deliverable is
          impossible, state the §RC6 fallback (dropped sonar term + renormalized weights,
          recorded capability gap) — never a placeholder.
          GUARD: every claim about the server/API is backed by a recorded probe (endpoint +
          response); the doc is committed BEFORE any implementation phase runs.
          LOG: probe results, decisions (A/B/fallback per deliverable), PASS/FAIL; commit.
      - name: p1_implement_measurement
        kind: agent
        timeout: 14400
        prompt: |
          GOAL: {goal}
          SHAPE: implement the PINNED measurement design doc (docs/designs/current/
          cap_2a_rerun2_measurement_design.md) — it is the authority; deviations are recorded
          findings, never silent invention. Per the doc: reducer v2 (code_change_facts/v2:
          new_sonar_critical_count = severity-filtered {BLOCKER, CRITICAL} AND change-introduced
          by (rule, file, line) identity; new_lsp_error_count = diagnostics errors introduced
          by the change), the seam's before/after analyzer legs (parent revision + phase
          revision; the deadline discipline carried from the rerun — sonar/lsp legs under the
          ANALYZER_LEG_TIMEOUT_SECONDS envelope, never a hung phase), the pinned LSP tool.
          VERIFY (mandatory, in this order): (a) the severity regression test — a change whose
          only sonar finding is python:S1244 (MAJOR, bug-type) mints new_sonar_critical_count=0
          and MUST NOT produce a rework proposal; (b) the novelty test — a pre-existing BLOCKER
          in an untouched file counts 0, a change-introduced BLOCKER counts exactly 1; (c) the
          deadline tests; (d) the full affected suite (test_change_analyzer, test_workflow_runner,
          test_run_workflow_graph_cli, test_code_change_facts, test_versioned_graph, test_graph,
          test_dependency_direction, test_evidence_prereq_gate). LIVE PROBE (mandatory): run
          the clean and critical cell variants (per the design doc's cell prompts) with
          --change-analysis; the critical variant must mint new_sonar_critical_count >= 1 and
          the clean variant 0 — or the design doc's recorded fallback state, with evidence.
          GUARD: without --change-analysis the run is byte-identical to merged main; no
          credentials in logs or artifacts; verify_proposal.py / _risk_depth /
          VERIFY_RISK_THRESHOLD untouched (the treatment).
          DELIVER: the implemented measurement + tests + probe ledger rows, committed.
          LOG: files touched, test results, probe counts per variant; PASS/FAIL; commit.
      - name: p2_measure_one_cell
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          SHAPE: measure ONE full target-model cell end-to-end before any p3 budget (E4
          lesson, unchanged). The cell is the CLEAN variant per the measurement design doc
          (cap_2a_cell_clean.yaml — add a small pure function + test, no defects; expected
          realized class no_rework). Write the candidate manifest FIRST (candidate_id, exact
          path, path SHA256, target model/backend, goal, source baseline revision, fresh
          worktree, FINOPS_CELL_ID, graph mode, forecast cost). RUN from the recorded source
          revision in a fresh disposable worktree: python3 scripts/run_workflow.py --spec
          <exact path> --goal <short goal> --model deepseek/deepseek-v4-pro --backend opencode
          --change-analysis [--change-analysis-graph bolt://localhost:7687] --workdir
          <worktree>. The proposal seam MUST emit (a refusal here is a p1 defect — record the
          reason + facts present and FAIL the phase). RECORD one immutable cell manifest + one
          ledger row per committed phase: cell_id, spec/version, model/backend, baseline
          revision, analyzed full revision, graph_status, sonar/lsp status, facts (omitted
          facts listed), proposal id/schema (applied=false), cost, duration, test result,
          artifact SHA256s. DELIVER: candidate manifest, cell manifest, phase ledger, validated
          proposal records, analyzer statuses, exact actual cost/duration, p3 FORECAST budget
          (measured x 2, labeled FORECAST). No p3 cell runs until these are committed.
          LOG: cost/duration/facts/proposal table; PASS/FAIL; commit.
      - name: p3_run_shadow_cells
        kind: agent
        timeout: 14400
        prompt: |
          GOAL: {goal}
          SHAPE: run the outcome-spread cells — the CRITICAL and STYLE variants per the
          measurement design doc (cap_2a_cell_critical.yaml — a real BLOCKER/CRITICAL defect +
          test, expected realized targeted_rework; cap_2a_cell_style.yaml — a MAJOR-style
          finding only, expected no_rework/verification_only). Commit a p3 execution manifest
          FIRST (cell_id, exact spec path + SHA256, source baseline revision, goal hash,
          model/backend, fresh worktree, FINOPS_CELL_ID, graph mode, FORECAST budget, stop
          condition); no unlisted cells. Per cell: fresh worktree from the recorded source
          revision; baseline runs exactly once; BEFORE the outcome is known, emit + persist one
          verify_code_change/v1 proposal (action/depth/scope/facts_used/analyzed revision/
          expected effect/schema version/applied=false) and validate it — malformed or stale
          proposals rejected, never hand-authored; the baseline completes WITHOUT consuming the
          proposal. Realized outcome INDEPENDENTLY from the proposal: immutable commit +
          runtime.test_runner verdict + a post-hoc evaluator that verifies the defect is (or is
          not) present in the committed code — enum {no_rework, verification_only,
          targeted_rework, broad_rework, unknown} + realized_depth + stable realized_symbol_set
          (repository_id + revision + file_path + qualified_name + kind). Mismatches =>
          outcome=unknown + invalid_for the requiring metric, never repaired by inference.
          Graph-down/analyzer-down cells: run, stay in the dataset, flagged. Persist one cell
          manifest, one proposal record, one independent outcome record, one cost/phase ledger
          per cell; hash every input/output. Stop before the next cell if cumulative actual
          cost would exceed the FORECAST envelope or the stop budget; record stopped cells as
          not-run. The dataset MUST end with >= 1 realized targeted_rework and >= 1 realized
          no_rework (the calibration contrast) — if a variant's realized class differs from
          expected, that is DATA (recorded), not a reason to rerun the cell.
          DELIVER: immutable p3 manifest, cell ledgers, validated proposals, independent
          outcomes, flags, forecast-vs-actual table, artifact SHA256 index.
          LOG: per-cell cost/duration/proposal/outcome table; PASS/FAIL; commit.
      - name: p4_score_hit_rate
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          SHAPE: score only immutable p2/p3 artifacts and first validate their joins. Emit
          experiments/results/cap_2a_rerun2_score_<UTC timestamp>.json (schema cap_2a_score/v1)
          with input artifact paths + SHA256s, spec version, source revision, candidate-manifest
          hash, per-cell rows. Refuse to score rows whose cell_id / baseline revision /
          analyzed revision / proposal_id / contract version mismatch; emit invalid/flagged.
          SEMANTICS — FIXED, verbatim from the rerun (hard rule 15): proposal hit-rate binary;
          `continue` hits only no_rework; `verify` hits verification_only when proposed depth >=
          realized_depth; `rework` hits targeted/broad_rework only when scope contains the
          realized scope and depth >= realized_depth; missing/invalid action/depth/scope or
          unknown outcome is not a hit. numerator = sum(hit); denominator = proposals with
          complete proposal + recorded non-unknown outcome; publish n_scored, n_hits,
          n_unknown_outcome, n_invalid_join, n_not_run separately. Blast-radius error =
          abs(predicted_impacted_symbol_count - len(realized_symbol_set)); graph unavailable =>
          error=null (graph_flagged), never 0; report n_available. Risk calibration is a
          distribution, not causation.
          NEW — the CALIBRATION TABLE (design doc §F2, the rerun's missing deliverable): emit a
          `calibration` block with (1) per-cell rows (cell_id, action, depth, scope_size,
          code_change_risk, sonar/lsp term values, realized_outcome, realized_depth, hit); (2)
          risk->outcome buckets [0,0.15) [0.15,0.3) [0.3,inf) vs realized rework enum; (3)
          finding->outcome: new_sonar_critical_count in {0, >=1} vs realized rework enum; (4)
          risk_mint_rate; (5) severity-strictness check: for every cell, the set of
          BLOCKER/CRITICAL change-introduced issues (from the ledger rows) — proving the
          conflation fix is data, not prose.
          Aggregates: graph-unavailable rate, outcome-recorded rate, proposal-validation rate,
          hit-rate, n, Wilson 95% interval, blast-radius mean/median over available
          predictions, all flagged/unknown counts. Compare against the rerun (0/3): report
          whether over-prediction shrank and by how much (per-cell proposal vs realized
          distance). No recommendation about 2b in this phase.
          DELIVER: the scoring JSON + a validation result tracing every verdict number to a
          JSON field.
          LOG: hit-rate, blast-radius delta, risk_mint_rate, calibration summary; PASS/FAIL;
          commit.
      - name: p5_verdict
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          DELIVER exactly one file: docs/designs/current/cap_2a_rerun2.md
          SHAPE: source revision, spec version, candidate-manifest hash, SHA256 for every p4
          JSON used; cells table (cell_id, spec, model/backend, baseline/analyzed revisions,
          graph/sonar/lsp status, forecast/actual cost, duration, proposal action/depth/scope,
          proposal validity, realized outcome/depth/symbol-set, hit/miss/unknown/invalid,
          blast-radius error or null + reason). ANALYSIS: hit-rate n_hits/n_scored + Wilson
          95%, printed denominators, graph-down + analyzer-down rates, outcome-recorded rate,
          risk_mint_rate, blast-radius over available predictions.
          THE FITTED MAPPING (design doc §F2 — this campaign's core deliverable): read the p4
          calibration table and state the empirical v2 mapping — e.g. "BLOCKER/CRITICAL
          change-introduced count T separated rework from no_rework in this sample; v2 should
          map risk r in [a,b) -> depth d; MAJOR-only changes realized no_rework so v2 maps them
          to verify-or-continue" — or state the exact n needed to fit it. This is prescriptive
          for the NEXT campaign, backed by this campaign's rows. VERDICT: 2b threshold
          (hit-rate >= 0.6, stated n, Wilson interval) met or not; descriptive-only under n;
          if cleared, 2b is eligible for design review (it has NOT run). Compare with the rerun
          explicitly: over-prediction shrank, persisted, or moved — with the numbers. Restate
          the mandatory 2b prerequisites (randomized static-vs-adaptive, pre-registered
          non-inferiority margin + outcome metric, independent test execution, budget/SLA
          guard, non-inferiority under adaptive control). p5 never launches a run, flips
          control_route, or arms actuation.
          GUARD: every number cites a p4 JSON field; no recommendation without n, denominator,
          uncertainty, and flagged-cell treatment.
          LOG: PASS/FAIL; commit.
      - name: p6_adversarial
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          ROLE: adversarial verifier — try to falsify the campaign. Attack in THIS order
          (design doc §4 p6): (1) severity conflation REGRESSED? — a cell whose only sonar
          finding is a MAJOR (e.g. python:S1244) must mint new_sonar_critical_count=0 and must
          never produce a rework proposal; if any scored row violates this it is a FAILED
          finding, not an accepted limitation. (2) novelty rule bypassed? — a pre-existing
          BLOCKER in an untouched file counted as new, or the before/after identity rule
          (rule,file,line) misapplied. (3) the calibration table's provenance — every row
          traceable to a p4 JSON field; the fitted-mapping statement derivable from the table.
          (4) the rerun's carried limitations re-attacked: duplicate qualified names in the
          CALLS edge, single-agent adjudication (independence is procedural — the outcome is
          derivable from commit + test_runner + evaluator), canonical KB facts absent on killed
          runs. (5) the usual suite: wrong baselines, cherry-picked cells, proposals recorded
          but never validated, graph-down/analyzer-down cells dropped or mislabeled, stale
          sonar facts (analyzed_sha mismatch), risk weights drifted from [P] provenance,
          denominator games, p1 byte-identical claim falsifiable by diff, applied=true or any
          actuation, unclosed drivers, leaked credentials, p4 hashes not matching verdict
          citations. Every finding: fix in code/spec/artifacts or record as accepted limitation
          with reasoning + residual risk. Deliver TWO outputs:
          1. docs/reviews/cap_2a_rerun2_adversary.md — attack, evidence path/line, result, fix
             or accepted limitation, re-test; include a re-stated verdict.
          2. docs/reviews/cap_2a_rerun2_known_safe.md — every attempted non-falsifying attack,
             what was tried, artifact/tree evidence, why safe. Not a generic checklist; must
             not say only PASS.
          Do not silently rewrite p4 JSONs or the p5 verdict; corrections point to the
          corrected artifact with both old/new hashes.
          LOG: finding table + known-safe list; PASS/FAIL; commit.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules:
  - name: cap_2a_rerun2_research
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [measurement_design_pinned]
  - name: cap_2a_rerun2_measurement
    plane: measurement
    evidence_class: "[M]"
    requires: [measurement_design_pinned]
    produces: [reducer_v2_wired, severity_filter_proven, novelty_rule_proven]
  - name: cap_2a_rerun2_cells_run
    plane: measurement
    evidence_class: "[M]"
    requires: [reducer_v2_wired]
    produces: [shadow_cells_run, proposals_recorded, outcomes_recorded]
  - name: cap_2a_rerun2_scoring
    plane: measurement
    evidence_class: "[C]"
    requires: [shadow_cells_run, proposals_recorded, outcomes_recorded]
    produces: [proposal_hit_rate, calibration_table, fitted_mapping, risk_mint_rate]
  - name: cap_2a_rerun2_verifier_gate
    plane: control
    evidence_class: "[H]"
    decision_type: verify_code_change
    requires_facts:
      - {fact: sonar_analysis_status, scope: self, value_type: enum,
         on_missing: classify, on_conflict: halt}
      - {fact: lsp_analysis_status, scope: self, value_type: enum,
         on_missing: classify, on_conflict: halt}
      - {fact: analysis_revision_matches, scope: self, value_type: bool,
         on_missing: classify, on_conflict: halt}
      - {fact: changed_symbol_count, scope: self, value_type: int, on_missing: halt}
      - {fact: ast_parse_coverage, scope: self, value_type: float,
         on_missing: halt, on_conflict: halt}
      - {fact: code_change_risk, scope: self, value_type: float,
         on_missing: halt, on_conflict: halt}
      - {fact: new_sonar_critical_count, scope: self, value_type: int,
         on_missing: classify, on_conflict: halt}
      - {fact: new_lsp_error_count, scope: self, value_type: int,
         on_missing: classify, on_conflict: halt}
      - {fact: impacted_symbol_count, scope: self, value_type: int,
         on_missing: classify, on_conflict: halt}
      - {fact: changed_symbols_with_tests_ratio, scope: self, value_type: float,
         on_missing: classify, on_conflict: halt}
    produces: [gate_decision]
metrics:
  - {name: shadow_cells_run, agg: mean, over: cell}
  - {name: proposal_hit_rate, agg: mean, over: cell}
  - {name: risk_mint_rate, agg: mean, over: cell}
  - {name: calibration_table, agg: mean, over: cell}
  - {name: fitted_mapping, agg: mean, over: cell}
  - {name: gate_decision, agg: mean, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
writeup:
  format: lab_book
  sections: [question, p0_research, p1_implement_measurement, p2_measure_one_cell, p3_run_shadow_cells, p4_score_hit_rate, p5_verdict, p6_adversarial]
stop: {budget_usd: 25.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
