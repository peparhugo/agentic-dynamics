name: task_vocabulary_unify
question: >-
  Unify the task-type vocabulary and remove the scripts/ reverse-import (R3 + R9 + BUG-2).
  ledger_ingestion exec's scripts/_constants.py at import time (the only src -> scripts edge) to
  load EXPERIMENT_SESSION_PATTERNS — but classify_session's pattern branch is dead (both branches
  return the same value), so the whole load is useless yet can break `import instrument` if the
  scripts tree is missing. normalize_task is also duplicated in routing.py and _constants.py.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: false
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      finding: >-
        BUG-2/R3: ledger_ingestion.py:79-103 _load_experiment_session_patterns exec's
        scripts/_constants.py at module import (line 103 is a module-level call); classify_session
        (:106-126) has both its `if any(p in ...)` branch and fallthrough return SOURCE_TYPE_ATTEMPT,
        so EXPERIMENT_SESSION_PATTERNS never changes output. R9: normalize_task duplicated in
        routing.py:16 and _constants.py:53; EXPERIMENT_SESSION_PATTERNS hard-coded at _constants.py:23.
      hard_rules: >-
        (1) The dependency edge must point src <- scripts, never src -> scripts: move the vocabulary
        into src/instrument (or experiment_spec); scripts/_constants.py imports it. (2) classify_session
        becomes a real discriminator or collapses to the meta_ prefix check it actually is today —
        do not keep a dead branch. (3) Test-driven; no weakening tests. (4) Behavior for existing
        meta_/non-meta titles must be preserved unless a test explicitly asserts the change.
      run_shape: >-
        SINGLE-model: run with --model deepseek/deepseek-v4-pro. One worktree, one branch
        (feature/task-vocabulary-unify); each phase commits [workflow] <phase>.
    phases:
      - name: implement
        kind: agent
        timeout: 10800
        prompt: |
          Implement R3 + R9 + BUG-2 per docs/review/restructure.md and bugs.md.

          GOAL:
          {goal}

          READ FIRST:
          - docs/review/restructure.md (R3, R9) + docs/review/bugs.md (BUG-2)
          - src/instrument/ledger_ingestion.py:79-126 (the reverse-import + classify_session)
          - src/instrument/routing.py:16, scripts/_constants.py:23,53

          DO:
          - Add a single task-type / session-pattern vocabulary in src/instrument (session_types.py
            or experiment_spec); scripts/_constants.py imports it (reverse the edge).
          - Collapse classify_session to the meta_ prefix check it actually is (or make it a real
            two-way discriminator) and delete _load_experiment_session_patterns.
          - Delete the duplicated normalize_task (routing + _constants) in favor of one.

          VERIFY: pytest tests/test_ledger_ingestion.py tests/test_step_routing.py tests/test_routing.py
          tests/test_workflow_runner.py -q — must pass; also confirm `python -c "import instrument"`
          no longer exec's scripts/_constants.py (delete the import-time exec).

          DELIVER the code + passing tests.
      - name: test
        kind: agent
        timeout: 7200
        prompt: |
          Run the full gate and fix regressions.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          DO:
          - Run `pytest tests/ -m "not external" -q`. Fix failures without weakening tests.

          DELIVER a green full suite.
      - name: verify
        kind: agent
        timeout: 3600
        prompt: |
          Trace R3/R9/BUG-2 to the code.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          DO:
          - Write docs/review/impl_task_vocabulary_unify.md tracing each change, with PASS/FAIL and
            the pytest result.

          DELIVER docs/review/impl_task_vocabulary_unify.md.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules:
  - name: vocabulary_unified
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [task_vocabulary, reverse_import_removed]
metrics:
  - {name: task_vocabulary, agg: mean, over: cell}
  - {name: reverse_import_removed, agg: mean, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
writeup:
  format: lab_book
  sections: [question, implement, test, verify]
stop: {budget_usd: 8.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
