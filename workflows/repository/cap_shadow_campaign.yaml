name: cap_shadow_campaign
question: >-
  Run the CAP I6 shadow loop on real workflow cells and produce the measured evidence the I7
  apply-seam flip requires. Run 2-3 small existing specs with --cap-shadow (claude backend),
  confirm snapshots compile from real facts and shadow decisions validate through C1-C10, then
  produce the three I6 reports (context_snapshot_report, shadow_decision_report,
  decision_arm_comparison) and compare shadow vs step_routing. Deliver a measurement summary
  (docs/designs/current/cap_shadow_measurement.md) with a verdict on whether apply may flip —
  which is expected to be "not yet, n too small" — and record the flip prerequisites. The I7
  apply seam stays OFF, always.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: true
repeatable: false
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      domain_context: >-
        PROVISIONAL DomainProfile (pre-CAP-I8 static filing). domain: software_delivery / CAP
        measurement. canonical_sources: [docs/designs/current/context_abstraction_design.md §8-9,
        docs/context_abstraction/implementation_notes.md, scripts/run_workflow.py (--cap-shadow/
        --cap-snapshot), scripts/{context_snapshot_report,shadow_decision_report,
        decision_arm_comparison}.py, the 90-spec index].
        policies: [apply_stays_off, measure_before_actuate, shadow_is_never_applied]
      challenge_context: >-
        PROVISIONAL ChallengeProfile. challenge: research (measurement campaign).
        deliberation: [run cells under shadow, compile snapshots, validate decisions, tabulate
        reports, compare vs step_routing, verdict].
        session_policy: {default: fork_per_phase}
      current_state: >-
        I0-I7 implemented and merged (main). Shadow seam wired: run_workflow.py --cap-shadow /
        --cap-snapshot opt-ins (per-invocation measurement), --control-route is the per-spec apply
        opt-in that NO committed spec sets. The three I6 report scripts exist but have never been
        exercised on real runs. DeepSeek credits are exhausted — sub-runs MUST use
        anthropic/claude-sonnet-5 via claude_cli (CLAUDE_BIN env).
      hard_rules: >-
        (1) Every phase commits '[workflow] <phase>' with green checks. (2) APPLY STAYS OFF:
        never pass --control-route, never set workflow.params.control_route, never call
        make_applying_router. Shadow and snapshot modes only. (3) Sub-runs use
        --model anthropic/claude-sonnet-5 --backend claude_cli with CLAUDE_BIN set; pick 2-3
        SMALL existing specs (short phases, low cost) — list the candidates and costs before
        running. (4) Every claim in the measurement doc cites the produced report JSONs. (5)
        Verdict is data-driven: no flip recommendation unless the comparison shows non-inferior
        shadow vs step_routing with a stated n; otherwise state the n needed. (6) The adversarial
        phase (s4) is mandatory: it must try to falsify the verdict (wrong baselines, missing
        coverage, cherry-picked cells, unrecorded decisions). (7) No generated-surface edits.
        (8) PASS/FAIL log; resumable.
      read_first: >-
        docs/designs/current/context_abstraction_design.md §8-9 (shadow + apply seams),
        scripts/run_workflow.py (the three flags), scripts/{context_snapshot_report,
        shadow_decision_report, decision_arm_comparison}.py, docs/context_abstraction/
        implementation_notes.md (flip procedure)
      run_shape: >-
        SINGLE-model: --model anthropic/claude-sonnet-5 --backend claude_cli. One worktree, one
        branch (feature/cap-shadow-campaign); each phase commits [workflow] <phase>.
    phases:
      - name: s1_select_and_run
        kind: agent
        timeout: 14400
        prompt: |
          GOAL: {goal}
          SHAPE: list candidate small specs from the index (short phases, low cost); pick 2-3;
          for each run: python3 scripts/run_workflow.py --spec <small spec> --goal <short goal>
          --model anthropic/claude-sonnet-5 --backend claude_cli --cap-shadow --workdir <worktree>
          (create one worktree per sub-run on a temp branch; the sub-runs may reuse one worktree
          sequentially). Do NOT pass --control-route.
          DELIVER: the run ledgers + shadow decision records produced by the seam.
          LOG: per-cell cost/duration/decision table; PASS/FAIL; commit.
      - name: s2_reports_and_validation
        kind: agent
        timeout: 14400
        prompt: |
          GOAL: {goal}
          SHAPE: confirm the shadow records are real decisions that passed C1-C10 (inspect the
          records; any rejected decision is itself a finding). Run the three I6 report scripts
          over the run ledgers: context_snapshot_report, shadow_decision_report,
          decision_arm_comparison. Fix any script bug in-scope (report scripts are maintained).
          DELIVER: the report JSONs committed under experiments/results/.
          LOG: decision counts, validation outcomes, report paths; PASS/FAIL; commit.
      - name: s3_measurement_doc
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          DELIVER exactly one file: docs/designs/current/cap_shadow_measurement.md
          SHAPE: table of cells (spec, model, cost, duration, shadow decision, step_routing
          decision, agree/disagree); analysis: how often shadow == step_routing, any rejected
          decisions and why; coverage (n per cell, missing facts); VERDICT on the flip with the n
          required, and the flip prerequisites list (per implementation_notes.md's procedure).
          GUARD: every number cites a report JSON; no recommendation without n.
          LOG: PASS/FAIL; commit.
      - name: s4_adversarial_falsification
        kind: agent
        timeout: 10800
        prompt: |
          GOAL: {goal}
          ROLE: adversarial verifier — try to falsify the measurement. Attack: wrong baseline
          (step_routing vs shadow on different inputs), cherry-picked cells, decisions recorded
          but never validated, missing-cost cells mislabeled, snapshot compiled from stale facts,
          report scripts that silently drop cells. Every finding: fix or record accepted
          limitation. Re-state the verdict with the attack results.
          LOG: finding table; PASS/FAIL; commit.
factors:
  - {name: model, levels: [anthropic/claude-sonnet-5]}
design: factorial
rules:
  - name: cap_shadow_campaign_run
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [shadow_cells_run, reports_produced, measurement_documented, verdict_falsified]
metrics:
  - {name: shadow_cells_run, agg: mean, over: cell}
  - {name: reports_produced, agg: mean, over: cell}
  - {name: measurement_documented, agg: mean, over: cell}
  - {name: verdict_falsified, agg: mean, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
writeup:
  format: lab_book
  sections: [question, s1_select_and_run, s2_reports_and_validation, s3_measurement_doc, s4_adversarial_falsification]
stop: {budget_usd: 30.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
