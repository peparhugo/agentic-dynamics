name: website_rewrite
question: >-
  Can a single model rewrite the public site to introduce Agentic Dynamics as a field and
  instrument expressed as BUSINESS OUTCOMES (not SaaS, not abstract) — with the dead taxonomy/
  counts/Explanation-Tax/100% framing removed and the instrumented fields + self-healing finding
  added, preserving the front diagram and framework SVG? Run once per model to produce three
  independent, pull-able branches.
version: "0.3"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: false
workflow:
  kind: agent_task
  params:
    language: html
    fork: true
    context:
      positioning: >-
        Read docs/agentic_dynamics_vision.md FIRST. The thesis: "AI agents don't have a price —
        they have dynamics; cost, reliability, and debt are properties of how the agent behaves
        under change." Express the dynamics->business-outcome table (basin escape = cost of
        change; recovery cost = cost of regression; snowball = maintenance; flail = wasted spend;
        survival horizon = runway; grit = reliability under stress; debt = maintenance liability).
        NOT a SaaS pitch. NOT abstract.
      stale_to_remove: >-
        (1) manifold/semantic taxonomy -> process_perturbation / objective_mutation /
        specification_corruption. (2) counts 227/249 -> 144 single-task (49 valid) + 156 story
        (772 sessions). (3) "Explanation Tax" -> "output decomposition" (reasoning is the cost,
        not narration; reasoning is DeepSeek-only). (4) self-reported "100% pass rate" -> split
        from independent test_executed_success ([tests]). (5) provenance overclaim "every term
        measured" (beta/EPM external) -> tag honestly.
      missing_to_add: >-
        The four instrumented ledger fields (confidence, perturbation_strength,
        test_executed_success, answer/explanation split), the self-healing finding, and the
        measured headline numbers.
      headlines: >-
        [M] ~30x cost spread at equal outcome ($0.014 vs $0.44/run, 100% correct). [M] recovery
        from real degradation is real but 4.6x cost compounding. [M] premium model fails where the
        cheap one doesn't (Claude 60% on shift_framing vs DeepSeek 100%). [M] static_site_gen
        correctness 0.39. [C] verification correlation -0.077. [H] self-healing re-run.
      keep: >-
        Preserve the front-page diagram and the framework-page SVG. Do not delete them.
      run_shape: >-
        This spec is SINGLE-model: the model is selected by --model (no model_pool, no per-phase
        pin). Run it THREE times — deepseek/deepseek-v4-pro, anthropic/claude-fable-5,
        openai/gpt-5.6-sol — each in its own worktree/branch, so each branch is an independent
        complete rewrite of firebase/public/ the operator can pull from.
    phases:
      - name: rewrite
        kind: agent
        timeout: 14400
        prompt: |
          Rewrite the public site per docs/agentic_dynamics_vision.md — YOUR independent proposal.

          GOAL:
          {goal}

          READ FIRST:
          - docs/agentic_dynamics_vision.md
          - firebase/public/*.html        (the 8 pages to rewrite, in place)
          - firebase/public/data.js       (generated, provenance-tagged data)

          REQUIREMENTS:
          - Rewrite all 8 pages IN PLACE under firebase/public/ per the vision doc's per-page plan:
            index (KEEP the diagram; thesis up top; the four headlines as body), evidence (full
            rewrite), methodology (10 operators 3-way + ledger fields + measure-before-policy gate
            + queue pipeline), framework (reorganize around the dynamics->business-outcome table,
            KEEP the SVG), story (extend through remediation + self-healing), accelerator +
            databricks (refresh, frame as operational hypotheses + related work), glossary (drop
            manifold/semantic; add grit/perturbation_strength/output decomposition/self-healing).
          - Every number provenance-tagged [M]/[C]/[H]/[X]/[P], grounded in data.js. Remove the
            stale taxonomy, stale counts, "Explanation Tax", and the self-reported-100% overclaim.

          DELIVER the rewritten firebase/public/*.html.
      - name: verify
        kind: agent
        timeout: 7200
        prompt: |
          Verify your rewrite before it is pulled.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          REQUIREMENTS:
          - Grep firebase/public/*.html for stale terms (manifold, semantic, 227, 249,
            "Explanation Tax", unqualified "100% pass rate") — none should remain.
          - Confirm the front-page diagram and the framework-page SVG are intact.
          - Confirm every number traces to data.js with a provenance tag.
          - Write docs/website_rewrite_verify.md with PASS/FAIL per check.

          DELIVER docs/website_rewrite_verify.md.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules:
  - {name: site_consistency, plane: measurement, evidence_class: "[M]", requires: [], produces: [provenance_clean]}
  - {name: publish_ready,    plane: control,     evidence_class: "[P]", requires: [provenance_clean], produces: [deployable]}
metrics:
  - {name: stale_terms_removed, agg: ratio, over: cell}
  - {name: numbers_provenance_tagged, agg: ratio, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
writeup:
  format: lab_book
  sections: [question, rewrite, verify]
stop: {budget_usd: 6.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
