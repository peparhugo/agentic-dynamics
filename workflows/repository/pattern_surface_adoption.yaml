name: pattern_surface_adoption
question: >-
  Adopt the world-model loop's seven minted pattern/v1 records onto their correct surfaces —
  enforcement -> guard test; procedure -> skill/command; convention -> rule or spec step;
  capability -> tool adapter; delegated role -> agent — as reviewed commits, with every record
  dispositioned (landed / declined with a reason).
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: true
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules: []
metrics: []
comparison: null
writeup: {format: lab_book, sections: [question, evidence]}
stop: {budget_usd: 3.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_uncertainty}
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    rag_augment: true
    rag:
      emit_self: true
      emit_report: true
      emit_scope: agentic-dynamics
    context:
      domain_context: >-
        PATTERN SURFACE ADOPTION. The world-model loop's promoted run (run-79fbc7f23d61,
        candidate 400f50da2, promoted to main as 1217356c4) minted SEVEN pattern/v1 records;
        their JSON lives in git history under notes/skills/ (read one with `git show
        1217356c4:notes/skills/<name>.json`): compounding-emission-leak, emit-seam-guard,
        explicit-empty-note, kb-read-degradation-crash, note-provenance,
        pin-production-precedence, stale-conditional-note. TWO already landed as guard TESTS in
        that same promoted change (the emit-seam guard + its containment regression) — read
        tests/test_world_model_gates.py first: repeating landed work is the failure mode here.
        The remaining records need a REVIEWED decision about their surface: enforcement -> a
        guard test (tests/); procedure -> a skill or command (agent_config/skills/, the CLI);
        convention -> a rule (agent_config/rules.md) or a spec step; capability -> a tool
        adapter (.opencode/tools/, HAND-AUTHORED, outside the generator); delegated role -> an
        agent spec (agent_config/agents/). The generated surfaces (AGENTS.md, CLAUDE.md, the
        .opencode/ and .claude/ trees) are rendered by scripts/_gen_instructions.py — never
        hand-edit them: edit agent_config/ and regenerate in the same commit.
    phases:
      - name: prior
        kind: agent
        scope: proposal_write
        timeout: 900
        prompt: |
          Read the seven minted records (`git show 1217356c4:notes/skills/*.json` in a loop),
          the already-landed guards in tests/test_world_model_gates.py, and the candidate
          surfaces (agent_config/rules.md, agent_config/mental-model.md,
          agent_config/skills/, agent_config/agents/, .opencode/tools/, .opencode/commands/).
          Then WRITE:
          `notes/world_model.md` (`## Problem`, `## What Exists`, `## Gaps`, `## Sources`) and
          `notes/plan.md` (`## Files`, `## Tests`, `## Acceptance`, `## Risks`): for EACH record,
          its chosen surface(s), the exact artifact, and the acceptance check — or a reasoned
          DECLINE (a record that is already covered, or whose evidence is too thin, is declined,
          not forced). Write `notes/sources.jsonl`. Commit all three files.
      - name: execute
        kind: agent
        scope: implementation
        timeout: 3600
        requires_files: [notes/plan.md, notes/sources.jsonl]
        prompt: |
          Land the plan. For each record: write the guard test, or edit the agent_config source
          (rules/skills/agents), or draft the tool adapter, or decline with the recorded
          reason. Whenever agent_config/ changes, regenerate the surfaces with
          `python3 scripts/_gen_instructions.py` and keep `--check` green. Run the affected
          suites plus `bash scripts/test_fast.sh`. A decline with evidence is a valid outcome —
          never promote an assertion the evidence does not support. Commit your work.
      - name: g_test_gate
        kind: test
        scope: implementation
        timeout: 1800
        requires_files: [notes/plan.md]
        tests_from_plan: notes/plan.md
        prompt: |
          The independent runner verifies the worktree against the targets `notes/plan.md`
          names; a plan naming no targets SKIPS explicitly (recorded on the ledger).
      - name: posterior
        kind: agent
        scope: proposal_write
        timeout: 900
        requires_files: [notes/world_model.md, notes/plan.md]
        prompt: |
          Diff the plan against what landed. WRITE `notes/posterior.md` with `## Violations`
          (where the plan met reality), `## Unknowns`, and `## UPDATES` (each record's final
          disposition: landed <where> | declined <why>; plus any skill/pattern candidates this
          adoption itself surfaced). Commit.
      - name: g_adversarial
        kind: agent
        scope: proposal_write
        timeout: 1800
        run_model: openai/gpt-5.6-terra
        prompt: |
          ADVERSARIAL REVIEW — a different model by design. Read `notes/world_model.md`,
          `notes/plan.md`, `notes/sources.jsonl`, `notes/posterior.md`, and the commits.
          Attack: which "landed" claims are actually enforced (a rule that nothing checks is
          not enforcement)? which declines are lazy? recompute one acceptance check yourself.
          Name at least one falsifier per major claim. Write `notes/adversarial_review.md` with
          a final `## FINDING` paragraph and commit it.
