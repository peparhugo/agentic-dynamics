name: flash_exploration_build_resume2
question: >-
  Second continuation of `flash_exploration_build`, after the second adversarial review returned
  FAIL (findings F1-F5) and both remediation rounds landed. This spec carries the CORRECTED,
  DECIDABLE review contract: hermetic tests and the live lexical probe run in-cell (Neo4j is on
  fleet-net at bolt://neo4j:7687); the dense (Chroma) live evidence is host-side by network
  design (chromadb is on ai-infra, cells on fleet-net) and is verified as an artifact
  (docs/reviews/flash_exploration_retrieval_probe.json + scripts/probe_retrieval_reachability.py),
  never demanded in-cell. Only the two remaining build phases run: g5_adversarial, g6_test_gate.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: false
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      hard_rules: >-
        (1) The adversarial phase writes ONLY docs/reviews/flash_exploration_adversarial.md; it
        does not change src/ or tests/. (2) The test phase is the independent gate. (3) No
        live-KB writes; the pattern mint is the controller-approved post-build act.
      evidence_classes: >-
        Hermetic tests + the live lexical probe (bolt://neo4j:7687, the fleet-net alias — never
        localhost) run in-cell. The dense live probe is host-side by design: chromadb is on
        ai-infra, cells on fleet-net; the reviewer verifies the committed runner and artifact
        instead. In-cell replication of the dense leg is an environment boundary, not a finding.
    phases:
      - name: g5_adversarial
        kind: agent
        scope: implementation
        requires_deliverable: true
        run_model: openai/gpt-5.6-terra
        timeout: 10800
        prompt: |
          GOAL: {goal}
          ROLE: the INDEPENDENT adversarial reviewer (terra vs the flash author). Falsify the
          build; do not certify it. Read these first:
          docs/reviews/flash_exploration_adversarial.md (the two prior reviews),
          docs/reviews/flash_exploration_remediation.md (BOTH remediation rounds),
          docs/reviews/flash_exploration_verify.md (the corrected p4 artifact).

          EVIDENCE CLASSES (decidable contract):
          - HERMETIC (run in-cell): python3 -m pytest tests/test_retrieval.py
            tests/test_context_plane_pattern.py tests/test_kb_produce_facts_integration.py
            tests/test_diversity.py tests/test_run_result_shape.py tests/test_portfolio_scorer.py -q
          - LIVE LEXICAL PROBE (run in-cell): Neo4j is at bolt://neo4j:7687 (user neo4j /
            password password123) — the fleet-net service alias. localhost is NOT the service;
            its refusal is an environment mistake, not a finding. Reproduce a mismatched-commit
            query: MEASURED/DERIVED/ADVISORY admitted; SOURCE with a different non-empty commit
            excluded.
          - HOST-SIDE DENSE EVIDENCE (environment boundary, NOT a finding): chromadb runs on
            the host's ai-infra network; cells run on fleet-net BY DESIGN and cannot reach it.
            The dense live evidence is docs/reviews/flash_exploration_retrieval_probe.json,
            produced by scripts/probe_retrieval_reachability.py. Verify (a) the runner exercises
            the real retrieve()/ChromaStore/dense-filter path (read the code), (b) the artifact
            is internally consistent: dense_available true, fallback_mode "full" for BOTH
            pattern_projection settings, knowledge source_types selected, stale_source_selected
            empty. Report the boundary as an environment fact; do NOT fail the branch for it,
            and do NOT fail for the live 0-pattern state — the mint is the controller-approved
            post-build act (F2b) and is out of scope here.

          ATTACK (at least 3 findings, or a clean sweep with re-verification):
          (1) F1: try to inflate portfolio_diversity with cosmetic edits in Python/JS/C — inline
              and block comments, whitespace, reformatting — must be 0.0; a genuine semantic
              change must be > 0.
          (2) F2/F4: audit the scorer seam (scripts/score_flash_ladder.py +
              measurement/portfolio_score.py): does it exclude None and report the count? Can an
              uncollected attempt be scored as empty? Does it fabricate zeros below n=2? Try a
              temp result JSON.
          (3) F3: run the in-cell lexical probe; validate the host artifact against the runner.
          (4) F5: check the corrected verify doc (Probe 5 semantics, archive path) and the
              remediation docs for stale or unsupported claims.
          (5) Re-audit the source fixes (retrieval reachability, pattern window, diversity) for
              regressions introduced by the remediation rounds.

          DELIVER: docs/reviews/flash_exploration_adversarial.md — replace it with the CURRENT
          review: an evidence table (finding, severity, direct re-verification, required
          disposition) and a release verdict.
          SCOPE NOTE: this phase writes ONLY that doc; do not touch src/ or tests/.
          LOG: finding table; PASS/FAIL; commit.
      - name: g6_test_gate
        kind: test
        scope: implementation
        timeout: 1200
        tests:
          - tests/test_retrieval.py
          - tests/test_context_plane_pattern.py
          - tests/test_kb_produce_facts_integration.py
          - tests/test_diversity.py
          - tests/test_run_result_shape.py
          - tests/test_portfolio_scorer.py
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules:
  - name: build_falsified_or_clean
    plane: measurement
    evidence_class: "[H]"
    requires: []
    produces: [adversarial_verdict_recorded]
  - name: test_gate_measured
    plane: measurement
    evidence_class: "[M]"
    requires: [adversarial_verdict_recorded]
    produces: [independent_gate_recorded]
metrics:
  - {name: adversarial_verdict_recorded, agg: mean, over: cell}
  - {name: independent_gate_recorded, agg: mean, over: cell}
comparison: null
writeup:
  format: lab_book
  sections: [question, g5_adversarial, g6_test_gate]
stop: {budget_usd: 4.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
