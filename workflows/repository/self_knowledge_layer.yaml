name: self_knowledge_layer
question: >-
  Build loop 2 — the machine learning about itself operating (design:
  docs/designs/proposed/self_knowledge_layer.md). Every AIO session starts as a
  fresh prior: compaction erases the previous session's posterior, and the
  doctrine carries stable rules but no situated decisions, accumulated
  experience, or reflection. This wave builds the record types + the always-on
  producers in SMALL task-card phases (one deliverable each — the construction
  crew model: each worker gets the task, the ask, and the goal from the current
  schematic, never the house history). Deliverables: session spine (open
  retrieves the last close / close writes its own), decision records with
  rationale, wave-verdict narratives, the belief-update protocol, the measured
  scoreboard, the reflection series — each record carrying its actor + scope
  per the context abstraction (design §actor-layering).
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: false
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    context:
      schematic:
        # The blueprint — stable references only. Task cards carry their own inputs/done_when.
        design: docs/designs/proposed/self_knowledge_layer.md
        record_model: >
          src/agentic_dynamics/knowledge/knowledge.py — entity_id is
          sha256(repository_id | source_uri | logical_locator); KnowledgeRecord
          fields: repository_id, acl_scope, source_type, evidence_class,
          logical_locator, supersedes, causes.
        producers: >
          src/agentic_dynamics/knowledge/knowledge_ingestion.py
          (derive_*_records + record_to_artifact + record_to_event) +
          src/agentic_dynamics/knowledge/knowledge_stream.py (publish_event,
          FINOPS_KB_WRITE guard).
        actors: >
          agent_config/rules.md VOCABULARY (AIO) + docs/supervisor_design.md
          (observe-only rail) + src/agentic_dynamics/control/context_compiler.py
          (scope_visible ancestor-visibility).
        commands: >
          scripts/promote.py + publish_release.py (verified commands),
          scripts/run_workflow.py (composition root),
          src/agentic_dynamics/cli.py.
        state: >
          agent_config/rules.md (the AIO section names loop 2); the finding
          layer (kb_finding_layer) is in flight — its k1 default-on lesson
          applies.
    phases:
      - name: s0_pin_spec
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          ROLE: verification — the house pin convention. Write
          docs/reviews/self_knowledge_layer_preregistration.md carrying:
          (a) this spec's file SHA256 + the worktree git sha; (b) the six
          edges VERIFIED against the actual repo: (1) meta_session records
          are embryonic (inspect one); (2) no decision records exist; (3)
          wave verdicts are re-derived (no narrative record at run
          completion); (4) no belief records with n_confirm/n_disconfirm;
          (5) no scoreboard; (6) no reflection series. An edge that does not
          hold is a FAILED finding. If a claim cannot be reproduced after
          THREE attempts, record the deviation and FAIL — never loop. DB
          LOCATION: machine-local state at the MAIN checkout.
          DELIVER: the preregistration with the verified edges, committed.
          LOG: PASS/FAIL per claim; commit.
      # ── s1: the session spine (one deliverable per phase) ──────────────────────────
      - name: s1a_session_record_type
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the session record TYPE — derive_session_record /
          build_session_record in knowledge_ingestion (or a new
          session_ingestion.py) producing a meta_session KnowledgeRecord with
          content fields: {session_date, slug, waves_run[], merged[],
          parked[], open_threads[], self_notes}. Producer: aio. Scope: the AIO
          scope (org:repo). Carries the standard identity + artifact + event.
          INPUTS: the record_model + producers pattern (schematic); inspect
          ONE existing meta_session record for the legacy shape.
          DONE_WHEN: a synthetic session dict derives a record whose fields
          round-trip through record_to_artifact/record_to_event; the
          knowledge_id is rerun-safe (same input -> same id).
          GATES: tests/test_session_spine.py (the record-type cases).
          SCOPE FENCE: the record type ONLY — no commands, no open/close
          logic (s1b/s1c). Actor + scope: producer aio, org:repo scope.
          DELIVER: the type + tests, committed.
          LOG: PASS/FAIL; commit.
      - name: s1b_close_writer
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the session CLOSE command (agentic-dynamics session
          close) — writes this session's record via the s1a type: what ran
          (waves), what merged, what parked, open threads, and the AIO's
          self-notes (what it got wrong — the reflection seed). Default-on at
          session end.
          INPUTS: the s1a type (committed); the CLI map pattern (schematic:
          cli.py); how promote/publish emit (for the record-emission pattern).
          DONE_WHEN: session close writes a record whose artifact + event
          land in the KB; re-running close for the same session is a no-op
          (rerun-safe key); a producer failure is a warning, never a crash.
          GATES: tests/test_session_spine.py (the close cases).
          SCOPE FENCE: the close command ONLY — open is s1c. Actor + scope:
          producer aio, org:repo.
          DELIVER: the close command + tests, committed.
          LOG: PASS/FAIL; commit.
      - name: s1c_open_reader
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the session OPEN command (agentic-dynamics session
          open) — retrieves the LAST session's close record and renders it as
          the session's opening context (decisions, open threads, parked
          items, self-notes). No prior close -> a clear first-session
          bootstrap message.
          INPUTS: the s1a type + the close command (committed); the retrieval
          pattern (how records are read back — the registry or direct read).
          DONE_WHEN: open with a prior close renders its content; open with
          none renders the bootstrap; the round-trip (close then open) is
          exact.
          GATES: tests/test_session_spine.py (the open cases).
          SCOPE FENCE: the open command ONLY. Actor + scope: producer aio,
          org:repo — a cell agent's retrieval never resolves these records.
          DELIVER: the open command + tests, committed.
          LOG: PASS/FAIL; commit.
      # ── s2: decision records ───────────────────────────────────────────────────────
      - name: s2a_decision_command
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the decision-record command (agentic-dynamics decision
          record --what X --why Y --alternatives A,B --category
          park|model|name|scope|...) writing {what, why, alternatives,
          category, decided_at, actor, run_id/candidate_sha when bound} via
          the observation producer (a decision IS an observation with intent).
          Producer: aio. Scope: org:repo, visible to the controller + AIO,
          never resolved by cell agents.
          INPUTS: observation_ingestion's build_observation_record; the CLI
          map; how promote/publish emit.
          DONE_WHEN: the command writes a retrievable-by-category record with
          all fields; a failed emit is a warning.
          GATES: tests/test_decision_records.py (the command cases).
          SCOPE FENCE: the command ONLY — the call-site emissions are s2b.
          DELIVER: the command + tests, committed.
          LOG: PASS/FAIL; commit.
      - name: s2b_verified_command_emission
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: automatic decision-record emission at the verified-
          command call sites — promote.py and publish_release.py emit a
          decision record when invoked (what was promoted/published, the
          run_id/candidate_sha, actor verified_command). Default-on,
          best-effort (a failed emit never blocks the promote/publish).
          INPUTS: the s2a record type; the promote.py + publish_release.py
          call sites.
          DONE_WHEN: a promote invocation emits a decision record bound to
          its run_id + candidate_sha; a publish invocation emits its own.
          GATES: tests/test_decision_records.py (the emission cases).
          SCOPE FENCE: the two call sites ONLY. Producer: verified_command.
          DELIVER: the call sites + tests, committed.
          LOG: PASS/FAIL; commit.
      # ── s3: wave-verdict narratives ───────────────────────────────────────────────
      - name: s3a_wave_verdict_type
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the wave-verdict record TYPE — derive_wave_verdict
          from a run ledger + the control-db row + the review artifact:
          {spec_name, run_id, verdict, cost, phases_total, adversarial_
          findings_count (when the review doc exists), merge_state, residuals
          []}. The narrative text is the one-paragraph 'what happened and
          why'. Producer: run. Scope: workload:<spec>/job:<cell> (its own).
          INPUTS: a run ledger + its control-db row + its adversarial review
          (pick the last completed wave's as the fixture); the record_model.
          DONE_WHEN: the type derives correctly from a synthetic ledger with
          and without a review artifact (findings count present/absent);
          merge_state reflects the control-db row.
          GATES: tests/test_wave_verdicts.py (the type cases).
          SCOPE FENCE: the type ONLY — the emission hook is s3b.
          DELIVER: the type + tests, committed.
          LOG: PASS/FAIL; commit.
      - name: s3b_wave_verdict_emission
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the wave-verdict emission at the run-completion path
          (the composition root where the ledger + control-db terminal write
          land) — every completed spec run emits its wave-verdict narrative
          via the s3a type. Default-on; a FAILED run still emits (a failure
          is a verdict, not a silence).
          INPUTS: the s3a type; scripts/run_workflow.py's terminal-write
          path.
          DONE_WHEN: a synthetic completed run emits its verdict with the
          measured fields; a failed run emits its failed verdict.
          GATES: tests/test_wave_verdicts.py (the emission cases).
          SCOPE FENCE: the emission hook ONLY. Producer: run, workload scope.
          DELIVER: the emission + tests, committed.
          LOG: PASS/FAIL; commit.
      # ── s4: the belief protocol ───────────────────────────────────────────────────
      - name: s4a_belief_record_type
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the belief record TYPE — derive_belief_record:
          {hypothesis, prior_confidence, n_confirmations, n_disconfirmations,
          last_updated, posterior_confidence, evidence_class, domain,
          evidence_citations[]}. Producer: aio. Scope: org:repo (AIO +
          controller visible; the controller model is an org-root belief
          class readable by the AIO only).
          INPUTS: the record_model; the evidence_class ladder
          ([P]/[M]/[C]/[H] — the prior-authority ladder by construction).
          DONE_WHEN: a synthetic hypothesis derives a belief record with all
          fields + its citations.
          GATES: tests/test_belief_protocol.py (the type cases).
          SCOPE FENCE: the type ONLY — the update operation is s4b.
          DELIVER: the type + tests, committed.
          LOG: PASS/FAIL; commit.
      - name: s4b_belief_update
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the UPDATE operation — when a wave outcome bears on a
          hypothesis, the record is UPDATED in place (n_confirm +1 or
          n_disconfirm +1, posterior recomputed), NEVER duplicated. The
          update rule: posterior moves toward the evidence with the
          confirmation count; a disconfirm lowers it.
          INPUTS: the s4a type; the s3b wave-verdict emission (the trigger —
          a verdict consults the belief index and updates the hypotheses it
          bears on).
          DONE_WHEN: two confirm updates yield ONE record with n=2 (assert);
          a disconfirm lowers the posterior; an unrelated outcome updates
          nothing.
          GATES: tests/test_belief_protocol.py (the update cases).
          SCOPE FENCE: the update operation + its trigger ONLY.
          DELIVER: the update + tests, committed.
          LOG: PASS/FAIL; commit.
      - name: s4c_belief_seeds
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the seeded initial belief set from the measured
          history — each with its evidence citations (the wave names that
          bear on it): 'flash converges in ~1 wave on in-process work';
          'container seams take ~4 waves' (the fleet_launch series);
          'findings were opt-in and never produced' (kb_finding_layer's
          premise, now disconfirmed by its own success); 'adversarial reviews
          catch wiring gaps tests miss' (n>=6 by the fleet series);
          'phases that ask for too much time out or false-positive' (the
          task-card lesson — the w2 timeout + the deploy-gate false
          positive).
          INPUTS: the s4a type; the wave records + reviews that are the
          citations.
          DONE_WHEN: each seed exists with its hypothesis + citations + an
          initial confidence; the seeds are retrievable by domain.
          GATES: tests/test_belief_protocol.py (the seed cases).
          SCOPE FENCE: the seeds ONLY — no new types, no new operations.
          DELIVER: the seeds + tests, committed.
          LOG: PASS/FAIL; commit.
      # ── s5: the scoreboard ────────────────────────────────────────────────────────
      - name: s5a_scoreboard_aggregation
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the scoreboard aggregation command (agentic-dynamics
          scoreboard [--recompute]) — aggregates the s3 wave-verdict records
          into measured rows: waves completed, merge rate, adversarial-
          finding rate (findings per wave), cost per wave (mean/median),
          time-to-merge, phases per wave, per-model rows. Recomputed from the
          s3 records — never hand-written totals.
          INPUTS: the s3a type + its emitted records (the fixture set);
          the CLI map.
          DONE_WHEN: N synthetic verdict records aggregate to the correct
          rows; per-model rows split correctly; recompute is idempotent; an
          empty set yields an empty-but-valid scoreboard (no fabricated
          zeros).
          GATES: tests/test_scoreboard.py.
          SCOPE FENCE: the aggregation command ONLY. Producer: aio, org:repo
          (controller + AIO + supervisor read; never cell agents).
          DELIVER: the command + tests, committed.
          LOG: PASS/FAIL; commit.
      # ── s6: reflections ───────────────────────────────────────────────────────────
      - name: s6a_reflection_type_append
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the reflection record type + the append path — the
          session close (s1b) appends its self-notes into a session-keyed
          reflection series (a record family: one entry per session, never
          overwriting a prior session's). Producer: aio. Scope: org:repo,
          private to the controller-AIO pair — never resolved by agents or
          the supervisor.
          INPUTS: the s1a session type (the self-notes field feeds the
          entry); the record family pattern (retrievable by key).
          DONE_WHEN: a close appends its entry; a second session's close
          appends a SECOND entry (the series grows, nothing overwrites); the
          series is retrievable as a family.
          GATES: tests/test_reflections.py.
          SCOPE FENCE: the type + append ONLY — the read command is s6b.
          DELIVER: the type + append + tests, committed.
          LOG: PASS/FAIL; commit.
      - name: s6b_reflection_read
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          DELIVERABLE: the reflection READ command (agentic-dynamics
          reflect --read) — renders the accumulated reflection series in
          order, so a session can contemplate across its predecessors. The
          accumulated reflections feed the next session's open context (s1c)
          and the belief seeds (s4c).
          INPUTS: the s6a series; the s1c open context (where the read hooks).
          DONE_WHEN: reflect --read renders the accumulated entries in
          chronological order; an empty series renders a clear empty state.
          GATES: tests/test_reflections.py (the read cases).
          SCOPE FENCE: the read command ONLY. Producer: aio, org:repo.
          DELIVER: the read command + tests, committed.
          LOG: PASS/FAIL; commit.
      # ── the wave's verdict phases ────────────────────────────────────────────────
      - name: s7_adversarial
        kind: agent
        scope: adversarial_readonly
        requires_deliverable: true
        run_model: deepseek/deepseek-v4-pro
        timeout: 14400
        prompt: |
          GOAL: {goal}
          ROLE: the INDEPENDENT adversarial reviewer — a DIFFERENT model and
          session (pro vs the flash author). Falsify the self-knowledge wave,
          not certify it. Attack in order, re-verified against the actual
          code + the live KB (never asserted): (1) does session open retrieve
          the last close (run it)? does close write a retrievable record?
          (2) does a promote invocation emit a decision record (run the call
          site)? (3) does a completed run emit its wave verdict (run a
          synthetic completion)? (4) do two confirm updates yield ONE record
          with n=2 (probe)? does disconfirm lower the posterior? (5) are the
          scoreboard rows measured from s3 records (probe the aggregation)?
          (6) does the reflection series accumulate session-keyed entries?
          (7) ACTOR LAYERING: can a cell-scoped retrieval resolve the AIO's
          private records (probe with a workload scope)? is the supervisor
          rail separate? (8) is ANY producer opt-in (the k1 lesson — grep
          the defaults)? Every finding: FIX on the branch or RECORD as an
          accepted limitation with reasoning. At least 3 findings or a clean
          sweep with re-verification evidence — a bare PASS is a failed
          review.
          RELEASE VERDICT: merge-ready to main? Loop 2 is real + correctly
          layered?
          DELIVER: docs/reviews/self_knowledge_layer_adversarial.md (finding
          table), committed.
          LOG: finding table; PASS/FAIL; commit.
      - name: s8_test_gate
        kind: test
        scope: implementation
        timeout: 900
        tests:
          - tests/test_session_spine.py
          - tests/test_decision_records.py
          - tests/test_wave_verdicts.py
          - tests/test_belief_protocol.py
          - tests/test_scoreboard.py
          - tests/test_reflections.py
          - tests/test_workflow_runner.py
          - tests/test_knowledge_ingestion.py
          - tests/test_cli_resolution.py
          - tests/test_script_classification.py
          - tests/test_doc_lifecycle.py
          - tests/test_agent_config_render.py
          - tests/test_control_status.py
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules:
  - name: self_knowledge_edges_verified
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [six_edges_confirmed]
  - name: session_spine_lands
    plane: measurement
    evidence_class: "[C]"
    requires: [six_edges_confirmed]
    produces: [open_retrieves_close, close_writes_record]
  - name: decisions_carry_rationale
    plane: measurement
    evidence_class: "[C]"
    requires: [six_edges_confirmed]
    produces: [decision_records_emit_at_decision]
  - name: wave_verdicts_emitted
    plane: measurement
    evidence_class: "[C]"
    requires: [six_edges_confirmed]
    produces: [narratives_not_re_derived]
  - name: beliefs_update
    plane: measurement
    evidence_class: "[C]"
    requires: [narratives_not_re_derived]
    produces: [single_record_increments, posterior_recomputed]
  - name: scoreboard_measured
    plane: measurement
    evidence_class: "[C]"
    requires: [narratives_not_re_derived]
    produces: [measured_rows_never_hand_written]
  - name: reflections_accumulate
    plane: measurement
    evidence_class: "[C]"
    requires: [six_edges_confirmed]
    produces: [session_keyed_series]
  - name: self_knowledge_wave_clean
    plane: measurement
    evidence_class: "[M]"
    requires: [open_retrieves_close, close_writes_record,
               decision_records_emit_at_decision, narratives_not_re_derived,
               single_record_increments, posterior_recomputed,
               measured_rows_never_hand_written, session_keyed_series]
    produces: [loop2_wave_clean]
  - name: test_gate_measured
    plane: measurement
    evidence_class: "[M]"
    requires: [test_executed_success]
    produces: [independent_gate_recorded]
metrics:
  - {name: six_edges_confirmed, agg: mean, over: cell}
  - {name: open_retrieves_close, agg: mean, over: cell}
  - {name: close_writes_record, agg: mean, over: cell}
  - {name: decision_records_emit_at_decision, agg: mean, over: cell}
  - {name: narratives_not_re_derived, agg: mean, over: cell}
  - {name: single_record_increments, agg: mean, over: cell}
  - {name: posterior_recomputed, agg: mean, over: cell}
  - {name: measured_rows_never_hand_written, agg: mean, over: cell}
  - {name: session_keyed_series, agg: mean, over: cell}
  - {name: loop2_wave_clean, agg: mean, over: cell}
  - {name: independent_gate_recorded, agg: mean, over: cell}
writeup:
  format: lab_book
  sections: [question, s0_pin_spec, s1a_session_record_type, s1b_close_writer, s1c_open_reader, s2a_decision_command, s2b_verified_command_emission, s3a_wave_verdict_type, s3b_wave_verdict_emission, s4a_belief_record_type, s4b_belief_update, s4c_belief_seeds, s5a_scoreboard_aggregation, s6a_reflection_type_append, s6b_reflection_read, s7_adversarial, s8_test_gate]
stop: {budget_usd: 12.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
