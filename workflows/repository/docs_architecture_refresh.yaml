name: docs_architecture_refresh
question: >-
  Bring the documentation current with the code and update the architecture authority
  (ARCHITECTURE.md + docs/architecture/current/) for the four themes the system has outgrown
  its docs on: (1) LAYER ABSTRACTION — the eight bounded planes, the tier map, and the
  dependency direction as they now exist; (2) CONTEXT ABSTRACTION — the ContextProfile
  (domain/challenge/session) + the context compiler (compile_context, route_next_job/v1) as
  implemented in the control plane; (3) DOCKER — the fleet ladder as it exists today (base
  image, supervisor-managed units, heartbeats + DLQ, the orchestrator tier, sibling cell
  spawns, the mount contract, the compose files); (4) ISOLATION — the Redis planes (the
  framework queue on 6380 vs the story agents' 6379), the KB repository_id scoping, worktree
  isolation, the container scope model (PHASE_SCOPE_AUTHORIZATION), and the flag-only
  supervisor rail. Every claim grounded in code; derived surfaces regenerated, never
  hand-edited.
version: "0.1"
supersedes: opencode_docs_refresh
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: false
# NOTE (execution path): the reference path for this spec is the orchestrator
# (docker-compose -f infrastructure/docker-compose.ladder.yml run --rm workflow-runner
# python3 scripts/run_workflow.py --orchestrator ...) — the per-phase scopes declared below
# are ENFORCED there (scope vocabulary, authorization, mount contract, network, write flags),
# and only there. In-process is the documented fallback when the fleet is occupied.
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    context:
      domain_context: >-
        canonical_sources: [ARCHITECTURE.md (the single architectural authority — planes,
        package boundaries, dependency direction, implemented-vs-proposed, supersedes chain;
        provenance-tagged [M]/[C]/[H]/[P]),
        docs/architecture/current/ (context_abstraction_design.md + addendum, scope.md,
        spec.md, supervisor_design.md, routing_design.md, ux.md, challenge.md, the cap_*
        designs), docs/designs/proposed/fleet_ladder_architecture.md (the ladder — STILL
        marked proposed while slices 1-2 are accepted/implemented),
        docs/fleet/ (the slice logs: 04_slice1_live_cutover, 05_slice2_orchestrator,
        06_slice3_neo4j, 07_slice4_guards), infrastructure/docker-compose*.yml,
        scripts/fleet/ (spawn_wrapper, fleet_manager, heartbeat, dlq, egress_proxy,
        review_unit, probe_binaries), agent_config/ + the generated surfaces
        (.opencode/**/.claude/** — generated by scripts/_gen_instructions.py, never
        hand-edited), scripts/sync_surfaces.py (the surface regeneration chain),
        scripts/CONTEXT.md + experiments/CONTEXT.md + apps/website/CONTEXT.md (the
        classification manifests), src/agentic_dynamics/control/ (context_compiler.py,
        facts, step_routing, supervisor, live, lease_registry) and the plane __init__
        docstrings, tests/test_doc_lifecycle.py (the doc-status vocabulary: proposed |
        accepted | implementing | implemented | superseded | abandoned)].
        policies: [regenerate_never_hand_edit, architecture_authority, provenance_tags,
        doc_lifecycle_vocabulary, supersedes_chain_honored].
      challenge_context: >-
        challenge: the code has outrun the docs in four axes at once — the fleet ladder
        (docker + isolation) landed with its design doc still marked PROPOSED; the context
        compiler (I4) is implemented but absent from the architectural authority; the
        surfaces (system_snapshot, spec index, skills) drifted silently until the
        2026-09-01 sync (the run-workflow skill documented a 7-flag CLI when the runner had
        15+). The risk is docs that describe the system as it was, not as it is — and an
        agent (master control included) orienting off a stale board.
        deliberation: [audit first (deterministic drift inventory), then update the
        authority, then regenerate the surfaces, then an independent adversarial pass].
        session_policy: {default: continue}
      current_state: >-
        MEASURED (2026-09-01): the 2026-09-01 surfaces sync regenerated the L0 game board +
        agent surfaces + spec lifecycle (the drift was real — ~300 lines of snapshot, one
        completed workflow missing from the index). ARCHITECTURE.md documents the eight
        planes + tier map but contains ZERO mentions of docker/fleet/container and does not
        carry the context-compiler section (9 'context' mentions, none architectural).
        docs/designs/proposed/fleet_ladder_architecture.md:2 still reads
        'status: proposed' while docs/fleet/04+05 record accepted slice-1/slice-2 cutovers
        (orchestrator image built, sibling-spawn wrapper validated, the green_main_closure
        workflow ran containerized on 2026-08-31). docs/architecture/current/
        context_abstraction_design.md exists (I4 = context_compiler.py + route_next_job/v1)
        but the authority does not link it. The run-workflow skill was refreshed 2026-09-01
        (runner-hardened CLI now documented); other skills/manifests may still lag. The
        doc-lifecycle lint (tests/test_doc_lifecycle.py) enforces the status vocabulary and
        is green.
      hard_rules: >-
        (1) AUDIT BEFORE YOU EDIT: the drift inventory is the deliverable of p1 and the
        input to every later phase — no doc change without a verified inventory line.
        (2) ARCHITECTURE.md IS THE AUTHORITY: it is the map, not the design — detailed
        designs stay in docs/architecture/current/ and docs/designs/, and the authority
        links them; never inline a design into the authority.
        (3) PROVENANCE ON EVERY CLAIM: [M] measured / [C] computed / [H] heuristic / [X]
        external / [P] policy — a claim without a provenance tag or a file:line anchor is
        not merged.
        (4) REGENERATE, NEVER HAND-EDIT: derived surfaces (agent surfaces, spec index/
        STATUS, data.js, manifests) go through their generators (scripts/sync_surfaces.py +
        scripts/spec_status.py); the classification manifests follow their contracts.
        (5) DOC-LIFECYCLE VOCABULARY: every touched doc carries a status field from the
        enforced vocabulary; a doc that is implemented but still 'proposed' is a finding,
        and its status flip is made with the evidence (the slice logs / the run ledger).
        (6) SUPERSEDES CHAIN: docs_architecture_refresh supersedes opencode_docs_refresh
        (the pre-Stage-1 docs spec); the spec index (experiments/specs/index.json) must
        carry the chain after the run.
    phases:
      - name: p1_docs_audit
        kind: agent
        scope: research_readonly
        timeout: 3600
        prompt: |
          GOAL: {goal}
          SHAPE: produce the deterministic drift inventory. Starting hypotheses to VERIFY
          (confirm or correct each against the files — do not trust them blind):
          (a) ARCHITECTURE.md has no docker/fleet/container/isolation coverage and no
          context-compiler section; (b) docs/designs/proposed/fleet_ladder_architecture.md
          is status: proposed while slices 1-2 are implemented (docs/fleet/04+05 logs,
          infrastructure/docker-compose.ladder.yml, scripts/fleet/);
          (c) the surface files (.opencode/, .claude/) and the CONTEXT.md manifests may lag
          the code (skills, flags, module names); (d) cap_* designs in
          docs/architecture/current/ whose status does not match the implemented code;
          (e) scripts/CONTEXT.md's per-script line counts / classifications vs the scripts
          that exist. Scan the eight planes' __init__ docstrings + ARCHITECTURE.md §1 and
          reconcile module names. Output: docs/architecture/current/2026-09-01_docs_drift_audit.md
          — a table (doc | claim | code truth | status: current/stale/missing) with
          file:line anchors and provenance tags. Do NOT edit any doc in this phase.
          DELIVER: the audit doc, committed.
          LOG: PASS/FAIL with the stale/missing counts per axis (layers, context, docker,
          isolation, surfaces); commit.
      - name: p2_architecture_update
        kind: agent
        scope: implementation
        timeout: 5400
        prompt: |
          GOAL: {goal}
          SHAPE: update the authority + the architecture tree for the four themes, using
          the p1 audit as the only edit list:
          1. LAYER ABSTRACTION — ARCHITECTURE.md §1: confirm the eight planes + the tier
          map (core 0 → tier-1 planes → control 2 → apps 3) and the dependency-direction
          enforcement (tests/test_dependency_direction.py); add the spec/compiler layer
          (experiment_spec.py + compile_experiment.py — WRITTEN) to the authority's
          implemented list.
          2. CONTEXT ABSTRACTION — add the authority section that links
          docs/architecture/current/context_abstraction_design.md (+ addendum): the
          ContextProfile (domain/challenge/session), the context compiler (control/
          context_compiler.py, compile_context, route_next_job/v1, the CAP I4 snapshot and
          I6 shadow rails as implemented), and how the spec context blocks feed it.
          3. DOCKER — the fleet ladder as it exists: the base image + supervisor-managed
          units, heartbeats + DLQ, the orchestrator tier (infrastructure/
          docker-compose.ladder.yml, the socket in exactly one tier), the sibling-spawn
          wrapper (scripts/fleet/spawn_wrapper.py), the mount contract, and the evidence
          (docs/fleet/ slice logs, the green_main_closure containerized run ledger).
          4. ISOLATION — the isolation inventory: Redis planes (framework queue 6380 db1
          vs the story agents' 6379 with flushdb hardcoded — never the same instance), the
          KB repository_id scoping (per-cell self-<worktree>, never global), worktree
          isolation (ephemeral branches, the permanence gate), the container scope model
          (SCOPE_VOCABULARY + PHASE_SCOPE_AUTHORIZATION), and the flag-only supervisor
          rail (observe, never steer).
          Flip fleet_ladder_architecture.md from proposed to implemented with the evidence
          (slice logs); move it to the implemented tree per the doc-lifecycle rules if the
          tree layout requires it. Every claim: provenance tag + file:line. Do not touch
          derived surfaces here (p3 does that).
          DELIVER: the updated ARCHITECTURE.md + the touched docs, committed.
          LOG: PASS/FAIL with the four sections' status + the supersedes/flips made; commit.
      - name: p3_surfaces_sync
        kind: agent
        scope: research_readonly
        timeout: 5400
        prompt: |
          GOAL: {goal}
          SHAPE: regenerate every derived surface from its sources and verify: run
          `python3 scripts/sync_surfaces.py` (the L0 game board + agent surfaces + spec
          lifecycle on the fast path). If any derived artifact (system_snapshot.md, spec
          index/STATUS) needs the data chain, run the full path. Then confirm the doc
          lifecycle + dependency-direction + surface guards pass:
          `python3 -m pytest tests/test_doc_lifecycle.py tests/test_dependency_direction.py
          tests/test_script_classification.py tests/test_spec_status.py -q`. If a guard
          reports drift, re-run the generator — the drift is a stale render, never
          hand-fix the derived file. If the spec index does not carry
          docs_architecture_refresh superseding opencode_docs_refresh, regenerate it.
          DELIVER: the regenerated surfaces committed (generator outputs only).
          LOG: PASS/FAIL with the guard results; commit.
      - name: p4_adversarial_review
        kind: agent
        scope: adversarial_readonly
        timeout: 3600
        prompt: |
          GOAL: {goal}
          SHAPE: independent adversarial pass over the merged changes. Verify (a) every
          claimed file:line anchor resolves and says what the doc claims; (b) no invented
          flags/paths/models — cross-check against the code (scripts/run_workflow.py
          --help, the CLI surface, scripts/CONTEXT.md); (c) the doc-lifecycle vocabulary
          holds on every touched doc; (d) the four themes are each covered with at least
          one [M] or [C] anchor, and no claim describes the system as it was (e.g.
          'proposed' for implemented features); (e) derived surfaces were regenerated, not
          hand-edited (check generator reproducibility: re-running scripts/_gen_instructions.py
          produces no diff). Record PASS/FAIL per check in
          docs/reviews/docs_architecture_refresh_adversary.md and DO NOT fix what you find
          — flag it; the fix is the operator's call or a follow-up phase.
          DELIVER: the adversary review doc, committed.
          LOG: PASS/FAIL per check; commit.
factors:
  - {name: model, levels: [openai/gpt-5.6-terra]}
design: factorial
rules:
  - name: docs_audited
    plane: measurement
    evidence_class: "[C]"
    requires: []
    produces: [drift_inventory_complete]
  - name: architecture_updated
    plane: measurement
    evidence_class: "[C]"
    requires: [drift_inventory_complete]
    produces: [four_themes_current, supersedes_chain_honored]
  - name: surfaces_regenerated
    plane: measurement
    evidence_class: "[C]"
    requires: [four_themes_current]
    produces: [agent_surfaces_current, guards_green]
  - name: adversarial_reviewed
    plane: measurement
    evidence_class: "[H]"
    requires: [agent_surfaces_current, guards_green]
    produces: [review_findings_recorded]
metrics:
  - {name: drift_inventory_complete, agg: mean, over: cell}
  - {name: agent_surfaces_current, agg: mean, over: cell}
  - {name: guards_green, agg: mean, over: cell}
writeup:
  format: lab_book
  sections: [question, p1_docs_audit, p2_architecture_update, p3_surfaces_sync, p4_adversarial_review]
stop: {budget_usd: 4.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
