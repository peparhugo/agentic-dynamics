name: confidence_cascade_study
question: >-
  Does confidence-gated escalation buy quality per dollar? Phase A (this spec): a ledger
  retrospective — is the measured `confidence` signal calibrated against outcomes, and what
  does the escalation-ROI curve look like? — plus a PRE-REGISTERED factorial design for the
  grid, including its falsifiers. Phase B (a later submission, only if A supports it): run the
  grid through the spec/compiler path.
version: "0.1"
artifact_kind: workflow
intent: measure
side_effects:
  repository: true
  external_services: false
repeatable: true
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules: []
metrics: []
comparison: null
writeup: {format: lab_book, sections: [question, evidence]}
stop: {budget_usd: 4.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_uncertainty}
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    rag_augment: true
    rag:
      emit_self: true
      emit_report: true
      emit_scope: agentic-dynamics
    context:
      domain_context: >-
        CONFIDENCE-CASCADE STUDY (Phase A: retrospective + pre-registration). The machine's
        load-bearing rule: policies need information, and the formerly-missing signals are now
        measured — `confidence` lands per attempt (AgenticResult.confidence), alongside
        `perturbation_strength` + `test_executed_success` (run-story / run.py paths; see
        src/agentic_dynamics/knowledge/ledger_ingestion.py). The evidence to interrogate:
        the FACT PLANE (`fact://attempt/...` — the `attempt_facts` rows carry `attempt_confidence`
        + the phase outcome; the registry index carries NO `ledger_attempt` rows — that pointer
        was a live null, corrected 2026-09-22 from the Phase-A retrospective), the story/session parquet
        (`python3 scripts/sync_data.py --check` for parity / `--query` for SQL — a bare positional `check` SYNCS, so the flag form is written out), and the run ledgers under
        `experiments/results/workflows/`. The compiler design is
        docs/architecture/current/2026-08-14_experiment-spec-and-compiler-design.md; the spec
        lifecycle index is experiments/specs/STATUS.md (read FIRST before authoring anything
        new). The two artifacts this phase owes:
        (1) `docs/reviews/confidence_cascade_retrospective.md` — what the existing ledger says
        (calibration of confidence vs outcome; escalation economics if any escalation history
        exists; the sample sizes actually available);
        (2) `docs/designs/proposed/confidence_cascade_study.md` — the PRE-REGISTERED grid:
        arms (always-fast / always-strong / cascade at thresholds), the metrics (first-pass,
        accepted, test-executed success, cost inference + rework — quality PER DOLLAR), the
        comparison (arm_factor = the policy; loss = {quality, cost}), power from Phase A's
        effect sizes, and the FALSIFIERS. Honesty rule: if the ledger cannot answer the
        calibration question, the retrospective SAYS SO and the grid design pauses — a null
        feasibility result is a first-class finding.
    phases:
      - name: prior
        kind: agent
        scope: proposal_write
        timeout: 1200
        prompt: |
          Read the compiler design, the spec lifecycle index, and the actual stores named in the
          domain context. Inventory the data BEFORE choosing a method: how many attempts carry
          `confidence` and an outcome; which fields co-occur; what the parquet exposes. WRITE
          `notes/world_model.md` (`## Problem`, `## What Exists`, `## Gaps`, `## Sources`) and
          `notes/plan.md` (`## Files`, `## Tests`, `## Acceptance`, `## Risks`) — the analysis
          plan, the exact queries, and the falsifiers you will test. Write
          `notes/sources.jsonl`. Commit.
      - name: execute
        kind: agent
        scope: proposal_write
        timeout: 3600
        requires_files: [notes/plan.md, notes/sources.jsonl]
        prompt: |
          Run the retrospective and write both artifacts:
          `docs/reviews/confidence_cascade_retrospective.md` (calibration + economics +
          available power; cite exact numbers and the query that produced them) and
          `docs/designs/proposed/confidence_cascade_study.md` (the pre-registered grid with its
          falsifiers). Every number in both documents must be reproducible from a command you
          record. If the data cannot answer Phase A's questions, write that finding and design
          the smallest additional instrumentation that would — do not fabricate a signal.
          Commit both documents.
      - name: g_test_gate
        kind: test
        scope: implementation
        timeout: 1800
        requires_files: [notes/plan.md]
        tests_from_plan: notes/plan.md
        prompt: |
          The independent runner verifies the worktree against the plan's targets; an
          analysis-only plan with no test targets SKIPS explicitly (recorded on the ledger).
      - name: posterior
        kind: agent
        scope: proposal_write
        timeout: 900
        requires_files: [notes/world_model.md, notes/plan.md]
        prompt: |
          Diff what the retrospective could establish against what the plan assumed. WRITE
          `notes/posterior.md` (`## Violations`, `## Unknowns`, `## UPDATES`): the feasibility
          verdict, the numbers that will anchor the grid's power, and any instrumentation gap
          that must be closed first. Commit.
      - name: g_adversarial
        kind: agent
        scope: proposal_write
        timeout: 1800
        run_model: openai/gpt-5.6-terra
        prompt: |
          ADVERSARIAL REVIEW — a different model by design. Read the retrospective, the
          pre-registration, the sources file, and the posterior. Attack the statistics: is the
          confidence calibration computed on a biased subsample? does the ROI ignore rework
          cost? would the proposed grid's arms be confounded by task difficulty? recompute one
          number from its recorded query. Name at least one falsifier per major claim. Write
          `notes/adversarial_review.md` with a final `## FINDING` paragraph and commit it.
