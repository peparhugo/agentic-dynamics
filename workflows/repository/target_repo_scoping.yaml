name: target_repo_scoping
question: >-
  Measure exactly where the pipeline assumes the FRAMEWORK repo is the SUBJECT repo — then
  write the generalization ladder that would let runs target OTHER repositories, each step
  with its falsifier. Analysis only; no source changes.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: true
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules: []
metrics: []
comparison: null
writeup: {format: lab_book, sections: [question, evidence]}
stop: {budget_usd: 4.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_uncertainty}
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    rag_augment: false
    rag:
      emit_self: true
      emit_report: true
      emit_scope: agentic-dynamics
    context:
      domain_context: >-
        CONTROLLER DIRECTION (2026-09-22): after the control/front-site improvements, "start
        running this against other repos". What is configurable TODAY: `PathConfig`
        (`src/agentic_dynamics/core/paths.py`) reads `FINOPS_REPO_DIR`,
        `FINOPS_WORKTREE_ROOT`, `FINOPS_OPENCODE_STATE_ROOT`, etc.; the KB scope carries a
        `repository_id` (`session_ingestion.REPOSITORY_ID`, default "agentic-dynamics"); the
        fleet derives workdirs from the worktree root. What is NOT: there is no TARGET-REPO
        concept — no `target_repo` anywhere in `src/` or `scripts/` — so the pipeline's
        specs, guards, mounts, agent surfaces, and the room's views all assume the framework
        checkout is the subject. THE DELIVERABLE IS A MEASURED INVENTORY + A LADDER, not a
        mechanism: (1) inventory by grep/read, never by assumption: hardcoded repo names
        ("agentic-dynamics", "ai-finops-framework"), framework paths in specs'
        `requires_files`/`scope` vocabularies, the fleet's mount + identity contract
        (`scripts/fleet/launch_broker.py`, `spawn_wrapper.py`), the guards that pin THIS
        repo's layout, and the agents' charters (`agent_config/agents/`); (2) the ladder:
        configurable identity -> a target-repo concept for runs (spec source vs subject) ->
        per-target agent surfaces -> fleet mounts -- each step named with the guard that would
        prove it; (3) falsifiers: for every claim "X is configurable", the command that shows
        it; for every "X is hardcoded", the file:line. The compiler design
        (docs/architecture/current/2026-08-14_experiment-spec-and-compiler-design.md) and
        ARCHITECTURE.md section 1 are the vocabulary sources; SCAN before asserting.
    phases:
      - name: prior
        kind: agent
        scope: proposal_write
        timeout: 1200
        prompt: |
          Inventory the data BEFORE choosing a method: grep the repo for the hardcoded
          identity tokens and the path assumptions; read `paths.py`, the fleet submit/launch
          paths, the guard modules, and one representative spec's `requires_files`/`scope`
          usage; read the KB repository_id plumbing. WRITE `notes/inventory.md`
          (`## Configurable Today`, `## Hardcoded`, `## Assumptions`, `## Sources`) — every
          row file:line. Write `notes/sources.jsonl`. Commit.
      - name: execute
        kind: agent
        scope: proposal_write
        timeout: 3600
        requires_files: [notes/inventory.md, notes/sources.jsonl]
        prompt: |
          Write `docs/designs/proposed/target_repo_generalization.md`: the measured inventory
          (condensed, every claim cited), the LADDER (ordered steps, each with the guard/proof
          that would establish it and the failure it prevents), the risks (identity collisions
          across repos, KB scope leakage, mount escape), and the explicitly-out-of-scope. Do
          NOT change source. Recompute at least three of the inventory's counts from a command
          and record it. Commit.
      - name: g_test_gate
        kind: test
        scope: implementation
        timeout: 1800
        requires_files: [notes/plan.md]
        tests_from_plan: notes/plan.md
        prompt: |
          Analysis-only: a plan with no test targets SKIPS explicitly here (recording the
          skip), never a vacuous pass.
      - name: posterior
        kind: agent
        scope: proposal_write
        timeout: 900
        requires_files: [notes/inventory.md]
        prompt: |
          WRITE `notes/posterior.md` (`## Violations`, `## Unknowns`, `## UPDATES`): claims
          the design makes that the inventory cannot support, the counts you could not
          recompute and why, and the smallest first step the controller could approve. Commit.
      - name: g_adversarial
        kind: agent
        scope: proposal_write
        timeout: 1800
        run_model: openai/gpt-5.6-terra
        prompt: |
          ADVERSARIAL REVIEW — a different model by design. Attack: is any "asserted" claim
          actually measured (recompute two yourself)? does the ladder hide a step whose
          absence breaks a guarantee (identity, scope, mounts)? is "analysis only" true — did
          anything in src/ or scripts/ change? Name at least one falsifier per major claim.
          Write `notes/adversarial_review.md` with a final `## FINDING` paragraph and commit.
