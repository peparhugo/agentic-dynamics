name: docs_refresh_remediation
question: >-
  Execute the operator-signed remediation plan (docs/reviews/docs_architecture_refresh_remediation.md,
  the decision on the docs_architecture_refresh adversary FAIL): fix the five accepted
  findings on the held docs branch — F1 stale anchors, F2 untagged claims, F3 the cap_2b
  current-state claim, F4 the fleet overgeneralization, F5 the real mount-contract guard
  gap — plus the egress-comment coordination note, then run the five-point acceptance gate
  so the branch clears its own adversarial review and becomes mergeable. Remediation, not
  rework: fix exactly the findings, nothing else.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: false
# NOTE (execution path): in-process, executed IN the held docs branch worktree
# (/tmp/wt_docs_refresh) — the remediation builds on the branch's 4 phase commits.
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    context:
      domain_context: >-
        canonical_sources: [docs/reviews/docs_architecture_refresh_remediation.md (the
        operator's decision — five accepted findings F1-F5 with owners + the acceptance
        gate), docs/reviews/docs_architecture_refresh_adversary.md (the FAIL verdict the
        remediation clears: checks a-e, the guard limitation), the branch's own outputs:
        docs/architecture/current/2026-09-01_docs_drift_audit.md, ARCHITECTURE.md (the
        four-theme update), docs/designs/implemented/fleet_ladder_architecture.md,
        docs/fleet/00_proposal.md + 01_infra_inventory.md, infrastructure/
        docker-compose.ladder.yml (the egress-comment honesty), tests/test_fleet_guards.py
        (:85-118 the stale copy), scripts/fleet/spawn_wrapper.py (the runtime allowlist
        that ALREADY carries the repo-alias + .git mounts), src/agentic_dynamics/control/rules.py
        (:12-19 the control_route seam), tests/test_context_plane_seam.py (:271-284 zero
        opt-ins), scripts/_gen_instructions.py (the surface generator), scripts/spec_status.py].
        policies: [anchored_claims_or_not_merged, remediation_not_rework,
        derived_surfaces_via_generators, acceptance_gate_is_the_merge_gate].
      challenge_context: >-
        challenge: the branch FAILED its own adversarial review — the fixes must survive a
        RE-RUN of the same checks, not just look done. The risk: a remediation that
        introduces new unanchored claims while fixing old ones (F2 is recursive — every
        fix must itself be tagged + anchored), or a mount-guard fix that makes the test
        pass by weakening it (F5's fix is mirroring the wrapper's runtime allowlist, never
        trimming the guard's assertions). Note: the running fleet_job_submission p4 owns
        the same guard in another worktree — both converge on the wrapper allowlist; keep
        the change minimal and additive.
        deliberation: [doc findings first (F1/F2/F4 + the egress note), then the context
        claim (F3), then the mount guard (F5), then the gate].
        session_policy: {default: continue}
      current_state: >-
        MEASURED (2026-09-01): the docs branch (base 196e56822 + 4 phase commits) holds
        the adversary FAIL (docs/reviews/docs_architecture_refresh_adversary.md); the
        operator's remediation plan is committed on main (fe220ed90). F1: audit anchors at
        2026-09-01_docs_drift_audit.md:22,70-73,79 + docs/fleet/00_proposal.md:11 +
        01_infra_inventory.md:9 cite the deleted proposed design. F2: ARCHITECTURE.md:46-49
        (module count), :110 (spine), :155-182 (CAP consumption) untagged. F3:
        ARCHITECTURE.md:172 "applies accepted proposals" vs rules.py:12-19 control_route
        seam with zero corpus opt-ins. F4: implemented/fleet_ladder_architecture.md:27-30
        overgeneralizes story workers to all cell services. F5: tests/test_fleet_guards.py:85-118
        fails on repo-alias + .git overlay targets (compose :59-64) while spawn_wrapper's
        runtime allowlist already carries them (confirmed by admission_leases p5).
      hard_rules: >-
        (1) ANCHORED OR NOT MERGED: every claim this remediation writes carries a
        provenance tag + a repository-relative anchor; a fix that introduces an unanchored
        claim fails its own review.
        (2) REMEDIATION, NOT REWORK: fix exactly the five findings + the egress note; no
        redesign, no re-scoping, no new sections.
        (3) F5 NEVER WEAKENS THE GUARD: the mount-contract fix mirrors the wrapper's
        runtime allowlist (or consumes it as the single source); trimming an assertion to
        pass is a violation.
        (4) DERIVED VIA GENERATORS: surfaces (index, snapshot, .opencode/.claude) are
        regenerated by their generators at the gate, never hand-edited.
    phases:
      - name: p1_doc_findings
        kind: agent
        scope: implementation
        timeout: 5400
        prompt: |
          GOAL: {goal}
          SHAPE: fix F1, F2, F4 + the egress-coordination note, per the remediation doc.
          F1: re-point every reference to docs/designs/proposed/fleet_ladder_architecture.md
          (2026-09-01_docs_drift_audit.md:22,70-73,79; docs/fleet/00_proposal.md:11;
          docs/fleet/01_infra_inventory.md:9) to docs/designs/implemented/
          fleet_ladder_architecture.md, with doc-lifecycle supersession for the fleet docs'
          operational claims. F2: tag + anchor ARCHITECTURE.md:46-49 (module count — a [C]
          glob count at the pinned SHA), :110 (spine — [M] test_dependency_direction +
          plane __init__ imports), :155-182 (CAP consumption — [C] per-claim anchors). F4:
          scope the fleet design's "one queue job at a time" claim (:27-30) to the story
          pool; describe stream consumers/daemons as long-running units. Egress note:
          re-touch the compose comments (docker-compose.ladder.yml:1-8,257-260) and the
          ARCHITECTURE.md §6 isolation line so they match the F1 reality (direct egress
          possible until cells configure the proxy — keep, but state it as current, not as
          an open fix).
          VERIFY (both directions): every edited claim is tagged + anchored; the deleted
          proposed path appears nowhere in the branch's docs.
          DELIVER: the fixes, committed.
          LOG: PASS/FAIL with the F1/F2/F4 closure counts; commit.
      - name: p2_context_claim
        kind: agent
        scope: implementation
        timeout: 3600
        prompt: |
          GOAL: {goal}
          SHAPE: fix F3 — correct ARCHITECTURE.md:172's cap_2b claim: the shadow rails
          are proposal-only until a workflow opts in via workflow.params.control_route:
          true (src/agentic_dynamics/control/rules.py:12-19); the corpus has zero opt-ins
          (tests/test_context_plane_seam.py:271-284). The correction states the current
          state with anchors; it does NOT add the opt-in (that is a separate operator
          decision, recorded in the remediation doc).
          VERIFY: the corrected claim is anchored and matches the seam's actual behavior.
          DELIVER: the correction, committed.
          LOG: PASS/FAIL; commit.
      - name: p3_mount_guard
        kind: agent
        scope: implementation
        timeout: 5400
        prompt: |
          GOAL: {goal}
          SHAPE: fix F5 — make tests/test_fleet_guards.py:85-118 pass by mirroring the
          spawn-wrapper runtime allowlist (scripts/fleet/spawn_wrapper.py — the repo-alias
          + .git overlay targets it ALREADY allows) into the guard, or by making the guard
          consume the wrapper's allowlist as the single source. The compose declares the
          targets (docker-compose.ladder.yml:59-64); the wrapper allows them; the guard's
          copy is stale. NEVER trim an assertion to pass — the fix is aligning the guard
          with the runtime contract, and the guard must still fail on a genuinely foreign
          mount target (add one to prove it still bites).
          VERIFY (both directions): the guard passes on the declared targets AND fails on
          an invented foreign mount; the full fleet-guard family runs green.
          DELIVER: the guard fix + the both-directions evidence, committed.
          LOG: PASS/FAIL with the guard result; commit.
      - name: p4_acceptance_gate
        kind: agent
        scope: research_readonly
        timeout: 5400
        prompt: |
          GOAL: {goal}
          SHAPE: run the remediation doc's five-point acceptance gate and record it:
          1. The five adversary checks (a)-(e) re-run clean — re-verify the findings as
          the adversary would: every anchor resolves, every new claim tagged + anchored.
          2. tests/test_fleet_guards.py passes (F5 closed) and ARCHITECTURE.md's "open
          enforcement gap" line is removed/flipped to closed.
          3. pytest tests/test_doc_lifecycle.py tests/test_dependency_direction.py
          tests/test_script_classification.py tests/test_spec_status.py
          tests/test_agent_config_render.py -q — green.
          4. python3 scripts/_gen_instructions.py re-run leaves git diff --exit-code clean.
          5. The branch's spec index is regenerated (python3 scripts/spec_status.py) and
          docs_architecture_refresh + docs_refresh_remediation read correctly.
          Record the gate results in docs/reviews/docs_architecture_refresh_remediation.md
          (status: implemented, with the per-finding closure evidence). DO NOT fix new
          findings in this phase — record them.
          DELIVER: the gate record, committed.
          LOG: PASS/FAIL per gate step; commit.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules:
  - name: doc_findings_closed
    plane: measurement
    evidence_class: "[C]"
    requires: []
    produces: [anchors_repointed, claims_tagged, egress_notes_current]
  - name: context_claim_corrected
    plane: measurement
    evidence_class: "[C]"
    requires: [anchors_repointed]
    produces: [cap_2b_proposal_only]
  - name: mount_guard_aligned
    plane: measurement
    evidence_class: "[M]"
    requires: [claims_tagged]
    produces: [guard_passes_on_contract, guard_still_bites_foreign]
  - name: acceptance_gate_run
    plane: measurement
    evidence_class: "[M]"
    requires: [cap_2b_proposal_only, guard_passes_on_contract]
    produces: [adversary_checks_clean, guards_green, surfaces_reproducible]
metrics:
  - {name: anchors_repointed, agg: mean, over: cell}
  - {name: guard_passes_on_contract, agg: mean, over: cell}
  - {name: adversary_checks_clean, agg: mean, over: cell}
writeup:
  format: lab_book
  sections: [question, p1_doc_findings, p2_context_claim, p3_mount_guard, p4_acceptance_gate]
stop: {budget_usd: 3.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
