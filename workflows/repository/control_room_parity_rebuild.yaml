name: control_room_parity_rebuild
question: >-
  Rebuild the Control Room against a MACHINE-READABLE PARITY MANIFEST extracted from the OLD
  room (main checkout), so no capability can be lost again. The old room is the oracle: every
  panel/control id, its endpoint(s), and its populating code are enumerated in p0, become the
  acceptance contract, and a headless-browser parity gate (post-JS DOM, live data, loaded
  assets, console-clean) must PASS before any adversarial review. Work is split into small,
  bounded slices (markup shell; boards/burn; per-worker event stream + actions + step timings;
  controls) so each phase has a checkable deliverable.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: true
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    rag:
      emit_self: false
    context:
      oracle: >-
        The OLD room at main: apps/control_room/static/index.html, app.js, style.css and
        apps/control_room/server.py of /home/drseuss/ai-finops-framework (on main). Its ids,
        endpoints and handlers are the parity contract. The old files are copied into
        experiments/control_room_parity/old/ in p0 and hashed; all later phases read that copy.
      hard_rules: >-
        (1) No phase may claim parity without the gate reporting zero manifest misses.
        (2) Every referenced asset must return 200 when served; a script file that is not
        loaded is a FAIL. (3) Slices never delete previously passing ids. (4) The gate evaluates
        the served page AFTER JavaScript runs (post-JS DOM), never the raw template alone.
        (5) Each phase ends with its named acceptance command run and its output committed.
        (6) CAPABILITY parity, not markup parity: every manifest capability gets a DESIGNED
        placement (region, hierarchy, interaction, principle) in c0b before any
        implementation; a designed equivalent must be recorded in the reconciliation table,
        which is the only legal form of a waiver. Nothing is bolted on.
    phases:
      - name: c0_manifest
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 7200
        prompt: |
          GOAL: {goal}
          Build the oracle. Steps:
          1) Copy the old room's static/index.html, static/app.js, static/style.css and
             server.py from the main checkout into experiments/control_room_parity/old/
             (git show main:<path> if the worktree lacks them).
          2) Extract EVERY id= from old/index.html and, for each, determine: the element kind,
             the visible purpose, the JS function(s) in old/app.js that populate it, and the
             HTTP endpoint(s) it calls (search app.js fetch/EventSource call sites; map to
             server.py routes).
          3) Write experiments/control_room_parity/parity_manifest.json: a list of records
             {id, kind, purpose, endpoints, populated_by, slice} where slice ∈
             {boards, workers, controls, shell}; include the sha256 of every old file.
          4) Write docs/reviews/control_room_parity_manifest.md summarizing counts per slice.
          ACCEPTANCE: a script scripts/check_parity_manifest.py validates the JSON schema and
          prints per-slice counts; run it and commit its output. Commit everything.
      - name: c0b_design_reconciliation
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 10800
        prompt: |
          GOAL: {goal}
          Put every capability into the DESIGN before any implementation. Steps:
          1) Read c0's parity_manifest.json, the direction (docs/research/control_room_direction.md),
             the IA (docs/research/control_room_ia.md), the UX foundation principles
             (docs/research/control_room_ux_foundation.md), and the interaction model
             (docs/research/control_room_interaction_model.md).
          2) Produce experiments/control_room_parity/capability_placement.json: one record per
             manifest capability (or deliberate merge of several) with {capability, source_ids,
             designed_home (region + element), hierarchy (glance|drill|action), interaction
             (what the operator does), principle (which design principle justifies it or is
             added), disposition (keep|merge|transform|replace), rationale}. Merges and
             transforms are DESIGN decisions with reasons; drops are forbidden.
          3) UPDATE the design docs in place: add any new design principles the operational
             layer requires (e.g., blocked-first triage, per-worker event/action visibility,
             step-time accountability), extend the IA regions and the canonical glance contract
             to include the operational surfaces, and revise the direction's layout to show
             where boards, per-worker streams/actions/timings, and controls live in the new
             grammar.
          4) Write docs/reviews/control_room_capability_placement.md: the placement table +
             what changed in the design docs.
          ACCEPTANCE: every manifest id appears exactly once across the placement records;
          scripts/check_capability_placement.py (new) validates coverage; output committed.
          Commit.
      - name: c1_shell_markup
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 7200
        prompt: |
          GOAL: {goal}
          Rebuild the template shell. Steps:
          1) In apps/control_room/static/index.html, ensure EVERY manifest id exists in the
             markup (visually laid out in the new design; hidden is allowed ONLY if the old room
             hid it, recorded in notes). Do not change endpoints yet.
          2) Keep the new layout/design classes from the facelift; add containers as needed.
          3) Extend scripts/check_parity_markup.py (new) to parse the template and assert every
             manifest id is present; run it.
          ACCEPTANCE: python3 scripts/check_parity_markup.py -> 0 missing ids; output
          committed. Commit.
      - name: c2_boards_burn
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 10800
        prompt: |
          GOAL: {goal}
          Wire slice=boards: the fleet/status/session/routing/flags boards and the burn
          rate/trace. Steps:
          1) For each boards-slice id, connect the same endpoint(s) the old app.js used; render
             live data with the same cadence (SSE/EventSource where the old room used it).
          2) Keep the new visual language but do NOT drop a field the old panel showed; list
             field-level parity in docs/reviews/control_room_parity_boards.md.
          3) Run the parity gate (may be a stub in this phase) and report its boards-slice
             section; every boards id must be non-empty with live data or a documented
             empty-state.
          ACCEPTANCE: gate boards-section 0 misses OR a designed equivalent recorded in capability_placement.json; doc committed. Commit.
      - name: c3_workers_stream
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 10800
        prompt: |
          GOAL: {goal}
          Wire slice=workers: the PER-WORKER surfaces the operator needs. Steps:
          1) For every worker/session row: live status (working/blocked/idle), the EVENT STREAM
             for that worker, the ACTIONS (start/stop/detach/log/advisor where the old room had
             them), and STEP TIMINGS (each step + duration, from the run ledger/telemetry).
          2) Same endpoints as the old room; if a step-timing feed did not exist, derive it
             from the ledger and document the source.
          3) Field-level parity table in docs/reviews/control_room_parity_workers.md; include
             the per-worker action list and the step-timing fields.
          ACCEPTANCE: gate workers-section 0 misses OR a recorded designed equivalent; every worker id non-empty with live data. Commit.
      - name: c4_controls
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 10800
        prompt: |
          GOAL: {goal}
          Wire slice=controls: claude-agent panels (start/stop/detach/status/log/advisor),
          queue/supervisor/design-session controls, the cell control panel + search. Steps:
          1) For each controls-slice id: wire the same endpoint(s)/handlers; ensure the action
             buttons perform their POST/GET and show result/error (the old room's behavior).
          2) Confirm each control's handler is attached (the gate checks an event listener or
             onclick bound in the post-JS DOM).
          3) Table in docs/reviews/control_room_parity_controls.md: id, endpoint, handler,
             confirmation method.
          ACCEPTANCE: gate controls-section 0 misses OR a recorded designed equivalent. Commit.
      - name: c5_parity_gate
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 10800
        prompt: |
          GOAL: {goal}
          Build scripts/verify_control_room_parity.py (Playwright, headless). Steps:
          1) Start apps/control_room/server.py on a test port; wait for readiness.
          2) Load / at 1440x900 and 390x844; wait for network idle; EVALUATE THE POST-JS DOM.
          3) For every manifest id: present; visible (or documented-hidden); bound (has a
             listener/onclick) for controls; and (for data ids) non-empty text/child content,
             or a documented empty-state string.
          4) Assets: every <script src>/<link href> under /static must fetch 200; the page
             console must have no errors.
          5) Emit JSON + markdown to apps/control_room/verification/parity_report.{json,md} and
             screenshots at both viewports; exit nonzero on any miss.
          ACCEPTANCE: run it until exit 0; commit the report + screenshots. If any miss
          remains, FIX THE CAUSE (do not waive without an explicit waiver line in the report
          reviewed by the next adversary). Commit.
      - name: c6_adversary_design
        kind: agent
        scope: adversarial_readonly
        requires_deliverable: true
        run_model: openai/gpt-5.6-luna
        timeout: 7200
        prompt: |
          GOAL: {goal}
          PASS CONDITIONS: parity_report.json has 0 misses (or every miss carries an explicit
          reviewed waiver), all assets load, console clean, and the screenshots show the old
          room's information (per-worker events/actions/step timings) present in the new design.
          Attack any "waiver" that hides a lost capability. Write
          docs/reviews/control_room_parity_design.md with findings + dispositions. Commit.
      - name: c7_adversary_ux
        kind: agent
        scope: adversarial_readonly
        requires_deliverable: true
        run_model: openai/gpt-5.6-sol
        timeout: 7200
        prompt: |
          GOAL: {goal}
          PASS CONDITIONS: using the screenshots + report, complete the operator jobs (triage a
          stalled run to a decision; inspect a worker's event stream and step timings; perform a
          control action; watch spend). Each must be completable from the room. FAIL naming the
          exact missing id/step. Write docs/reviews/control_room_parity_ux.md. Commit.
      - name: c8_tests
        kind: test
        scope: implementation
        timeout: 900
        tests:
          - tests/test_research_fetch.py
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules:
  - name: parity_manifest_pinned
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [parity_manifest]
  - name: parity_slices_wired
    plane: measurement
    evidence_class: "[M]"
    requires: [parity_manifest]
    produces: [boards_workers_controls_wired]
  - name: parity_gate_pass
    plane: measurement
    evidence_class: "[M]"
    requires: [boards_workers_controls_wired]
    produces: [zero_manifest_misses]
  - name: parity_adversarially_checked
    plane: measurement
    evidence_class: "[H]"
    requires: [zero_manifest_misses]
    produces: [parity_verdicts]
metrics:
  - {name: parity_manifest, agg: mean, over: cell}
  - {name: boards_workers_controls_wired, agg: mean, over: cell}
  - {name: zero_manifest_misses, agg: mean, over: cell}
  - {name: parity_verdicts, agg: mean, over: cell}
comparison: null
writeup: {format: lab_book, sections: [question, c0_manifest, c0b_design_reconciliation, c1_shell_markup, c2_boards_burn, c3_workers_stream, c4_controls, c5_parity_gate, c6_adversary_design, c7_adversary_ux]}
stop: {budget_usd: 30.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
