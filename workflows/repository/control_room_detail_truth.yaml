name: control_room_detail_truth
question: >-
  Make the Control Room's resting surfaces derive their attention/order/age and glance values
  SERVER-SIDE from the one packet, and render the state screens it already holds — so the room
  tells the truth it has instead of re-deriving (and hiding) it in the client.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: true
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules: []
metrics: []
comparison: null
writeup: {format: lab_book, sections: [question, evidence]}
stop: {budget_usd: 4.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_uncertainty}
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    rag_augment: false
    rag:
      emit_self: true
      emit_report: true
      emit_scope: agentic-dynamics
    context:
      domain_context: >-
        THE L23 ADVERSARIAL FINDINGS (2026-09-22, preserved on the record): the served room's
        attention/order/age values are derived CLIENT-SIDE in app.js; values the declared
        services/operations.py models already carry (the packet's per-run entries, the glance
        row) are omitted from the rendered tables; and the required state screens are only
        partially rendered. The room's honesty rules are the constraint:
        apps/control_room/services/operations.py — every read model renders a NAMED state
        (recorded / unbound / unavailable; never a fabricated zero, never a 500); selection
        and delivery, never causation. Acceptance IS the render gate's required profile WITH
        captures (scripts/verify_control_room_rendering.py --profile acceptance; zero captures
        = structural FAIL; the boards fixtures under apps/control_room/verification/fixtures/
        are the contract the gate reads). Prior art: the 2026-09-22 drawer-logs work
        (apps/control_room/services/operations.py read_run_logs + the named match basis) and
        the L23 resting-screen restructure (routes/operations.py, board-*.js, shell.js).
        SCAN the fixtures, the gate, and the existing services BEFORE adding a derivation —
        the vocabulary (named states, caps, provenance labels) usually exists.

        THE L33 ACCEPTANCE FINDINGS (2026-09-23 — this brief supersedes the parked candidate;
        its work is NOT on main): run-eb4adaa72899 reached 5/5 ok + g_test_gate 77/77 + a
        committed adversarial review and still FAILED the HOST render gate on one assertion:
        "[desktop/boards/loading] operations-attention.state: the server-owned attention.state
        value 'active' was not rendered" (gate report:
        experiments/results/control_room_render/L33_candidate_f7ab43551/gate_report.json; the
        full review is archived at refs/experiments/control_room_detail_truth/run-eb4adaa72899
        -> notes/adversarial_review.md; register rows L33 + L47). That candidate is FROZEN by
        its ledger — never edit it; absorb its four Required Remediation items instead:
        (1) generate the Operations fixture from the service's read-model contract, or make the
        fixture assert the state_screens[i] <-> runs[i] identity/order invariant — a
        hand-authored twin the service could never emit is the P1 finding; (2) reconcile the
        operator-state / required state roster with control_db.RunState — implement evidence
        for stalled/escalated or REMOVE the manufactured states, then cover the reachable
        unknown / promotable / cancelled / quarantined cases; (3) render "Unhealthy workers"
        as unavailable whenever its source is degraded or unobserved (never a fabricated 0),
        and extend the degraded render assertions to catch exactly that; (4) Playwright is NOT
        a container fix (the fleet image has none) — the browser acceptance is proven on the
        HOST, so every browser-class assertion the candidate's gate carries must be satisfiable
        by the candidate's OWN renderer, including rendering asserted server-owned values as
        visible text (the parked candidate asserted 'active' while its client exposed the
        value only as a data-* attribute). A green in-cell run is not an accepted candidate:
        the AIO runs verify_control_room_rendering.py --profile acceptance against THIS run's
        candidate on the host, and promotion waits on it.

        ATTEMPT-ELEVEN FINDING (2026-09-23, run-8c1e7d30cf22 — its execute candidate is
        archived at refs/experiments/control_room_detail_truth/run-8c1e7d30cf22): the run
        reached 2/5 ok (prior + execute committed) and died AT THE DECLARED TEST GATE, 78/79:
        tests/test_control_room_static_views.py::test_operations_board_renders_the_packet_fields_it_claims
        is red because app.js dropped the `unhealthy_workers` read while adopting a
        server-owned worker block (`worker_health`). The suite's anchor lists ARE the read
        contract: when a redesign renames or moves a packet read a declared suite anchors,
        update that anchoring suite DELIBERATELY in the same commit — and ALL FIVE declared
        gate suites must be green on the FINAL commit before the phase ends (the gate re-runs
        them independently; a red one is a failed run). You rebuild from main, not from the
        archive.

        ATTEMPT-TWELVE FINDINGS (2026-09-23, run-07394068a0a0 — archived at
        refs/experiments/control_room_detail_truth/run-07394068a0a0): the run reached 5/5 ok +
        g_test_gate 76/76 and its HOST acceptance FAILED one assertion —
        "[desktop/boards/loading] operations-state-projection: the server-owned Operations
        value 'State screens' was not rendered". The capture proves the section IS visibly
        rendered (label 'STATE SCREENS' — the room's `h3 { text-transform: uppercase }`,
        static/style.css — with the full table); the candidate's own assertion compared TITLE
        CASE against `innerText`, which reflects the transformed text. (i) Fix that assertion
        class: every text assertion must match what the browser actually reports
        (case-insensitive or the transformed form), and audit its siblings — an assertion that
        disagrees with the rendered text is itself a defect. (ii) The candidate's committed
        adversarial review (notes/adversarial_review.md in the archive; FINDING "not ready for
        promotion") named P1s to CLOSE, not re-land: summary values (Active runs / Decisions
        owed / Promotable runs) are still derived client-side from delivered-list lengths, and
        a half-omitted progress pair renders as `0` (`{phases_total: 2}` -> `0/2`;
        `{phases_completed: 1}` -> `1/0`) — an omitted measure renders a NAMED value, never a
        fabricated zero; the Operations fixture still omits the service response's top-level
        `schema` and `source.packet_schema` and manufactures `active_runs` with `promotable`
        excluded while the real active block carries every non-terminal RunState (incl.
        `promotable`) — the fixture must be field-faithful to the service contract, or the
        pass-through blocks asserted against it; the lifecycle coverage omits the reachable
        `verifying` / `promoting` / `projecting` screens — cover them and assert the FULL
        `RunState` roster, not a selected subset; the renderer's worker fallback still
        fabricates `0` when `worker_health` is absent or malformed (render `unavailable`); and
        the drawer's cost-provenance / prepared-step-path / unknown-timing assertions are
        metadata-only (`data-*`) — make them visible-text assertions like the repaired ones.
        P2: `FINOPS_REDIS_PORT` / `FINOPS_REDIS_DB` parse before the named-degradation
        boundary (a malformed env value can 500 instead of degrading), and `_float_or_none`
        accepts `inf` as a future heartbeat.
    phases:
      - name: prior
        kind: agent
        scope: proposal_write
        timeout: 1200
        prompt: |
          Read the register rows L23, L33, and L47 in `docs/reviews/loose_ends_register.md`,
          and the failed host gate report
          `experiments/results/control_room_render/L33_candidate_f7ab43551/gate_report.json`;
          then the room's services, routes, static boards, and the render gate + fixtures.
          WRITE `notes/control_room.md` (`## Problem`, `## What Exists`,
          `## Gaps`, `## Sources`) and `notes/plan.md` (`## Files`, `## Tests`,
          `## Acceptance`, `## Risks`, `## Remediation`): for EACH value the room currently
          derives or hides, say which service should own it, which fixture the gate will
          assert, and which capture shows it; the `## Remediation` section must address EACH
          of the four L33 items named in the domain context (fixture from the service
          contract or the state_screens<->runs invariant; the RunState-reachable state roster;
          the degraded "Unhealthy workers" render; assertions satisfiable by your own renderer
          on the host), naming the file and the assertion that proves each. Write
          `notes/sources.jsonl`. Commit — `notes/` is gitignored, so
          stage the notes explicitly (`git add -f notes/`) before committing; a plain
          `git add` refuses ignored paths and the phase then records no commit.
      - name: execute
        kind: agent
        scope: implementation
        timeout: 3600
        requires_files: [notes/plan.md, notes/sources.jsonl]
        prompt: |
          Move the derivations server-side into services/operations.py (or the owning service),
          extend the fixtures + the gate's assertions and the drawer/board renderers to use
          them, and render the state screens the review named — implementing the four L33
          remediation items (domain context) rather than re-landing the parked candidate's
          misses: the fixture must be service-plausible (generated from the read model or
          asserting the state_screens[i] <-> runs[i] invariant), the state roster must be
          reachable from control_db.RunState, "Unhealthy workers" must read unavailable when
          its source is degraded, and every value your gate asserts must render as visible
          text (a data-* attribute is not a rendered value). ALSO close the attempt-12 P1s
          (domain context): summary values (Active runs / Decisions owed / Promotable runs)
          server-owned or NAMED unknown — never client-derived counts, and an omitted half of a
          progress pair renders a named incomplete/unknown, never `0`; the fixture
          field-faithful to the service contract (top-level `schema` + `source.packet_schema`
          present; `active_runs` semantics per the packet INCLUDING `promotable`), or the
          pass-through blocks asserted against the service; the FULL `RunState` roster covered
          (add `verifying` / `promoting` / `projecting`) with an exhaustive-roster assertion;
          the worker renderer FAIL-CLOSED (a missing or malformed `worker_health` renders
          `unavailable`, never a fallback count); the drawer's cost-provenance /
          prepared-step-path / unknown-timing assertions on VISIBLE TEXT; and every TEXT
          assertion must match what the browser reports — the room's CSS uppercases h1-h4
          (`text-transform: uppercase`), so compare case-insensitively or match the
          transformed form (the previous attempt's acceptance died on exactly that). The
          container CANNOT run the
          browser profile (no Playwright — register L47): run the browser-free checks
          (`python3 scripts/verify_control_room_rendering.py --check-fixtures`) and the five
          declared gate suites (`tests/test_control_room_operations.py`,
          `tests/test_control_room_glance_integrity.py`,
          `tests/test_control_room_build_contract.py`,
          `tests/test_control_room_static_views.py`, `tests/test_control_room_paths.py`)
          TO FULL GREEN on your FINAL commit — if your redesign renames or moves a packet
          read that a suite anchors, update that suite in the same commit (the previous
          attempt died 78/79 on exactly that drift); do NOT install
          Playwright and do NOT fabricate captures — the host runs the acceptance profile
          against this run's candidate. Commit.
      - name: g_test_gate
        kind: test
        scope: implementation
        timeout: 1800
        requires_files: [notes/plan.md]
        # The DECLARED room-suite targets (deterministic): a plan-driven resolution ran the
        # 2026-09-22 L33 run's gate into a zero-target SKIP (the plan's `## Tests` was prose),
        # which promotes as a forbidden phase (test_executed_success=None). The declared list
        # is the acceptance contract the spec's own prompt names.
        tests:
          - tests/test_control_room_operations.py
          - tests/test_control_room_glance_integrity.py
          - tests/test_control_room_build_contract.py
          - tests/test_control_room_static_views.py
          - tests/test_control_room_paths.py
        prompt: |
          The independent runner verifies the worktree against the declared room-suite targets.
      - name: posterior
        kind: agent
        scope: proposal_write
        timeout: 900
        requires_files: [notes/control_room.md, notes/plan.md]
        prompt: |
          Diff the plan against what landed. WRITE `notes/posterior.md` (`## Violations`,
          `## Unknowns`, `## UPDATES`): which values moved server-side (with the fixture +
          the gate-check output that prove it), which of the four L33 remediation items landed
          and which did not (each with the assertion or invariant that proves it), what
          remains client-side and why, and the acceptance evidence that exists in-cell (there
          are no captures here — the host runs the browser profile). Commit — `notes/` is
          gitignored, so stage it explicitly (`git add -f notes/posterior.md`) before
          committing. Keep every write inside the worktree (never `/tmp/...`, never `../...`):
          an outside edit raises a permission ask the headless cell cannot answer.
      - name: g_adversarial
        kind: agent
        scope: proposal_write
        timeout: 1800
        run_model: openai/gpt-5.6-terra
        prompt: |
          ADVERSARIAL REVIEW — a different model by design. Read the notes, the diffs, and the
          fixtures. Attack: does any "server-derived" value secretly re-derive in the client?
          do the fixtures assert the REAL server shape or a hand-written twin (state_screens
          identities and order, row fields the service cannot emit, states unreachable from
          control_db.RunState)? does an omitted value render as a fabricated zero anywhere
          (check "Unhealthy workers" on a degraded or unobserved source)? does any gate
          assertion pass vacuously, and is every browser-class assertion satisfiable by the
          renderer it asserts (visible text, not a data-* attribute)? does any TEXT assertion
          disagree with what the browser actually reports (the CSS uppercases h1-h4 —
          `innerText` reflects it)? are summary values or partial progress pairs fabricated
          (`0/2`, a length-derived count)? is the fixture field-faithful (`schema` /
          `source.packet_schema`; `active_runs` incl. `promotable`)? is the FULL `RunState`
          roster covered, not a selected subset? Name at least one
          falsifier per major claim. Write `notes/adversarial_review.md` with a final
          `## FINDING` paragraph
          and commit it — `notes/` is gitignored, so stage the review explicitly
          (`git add -f notes/adversarial_review.md`) before committing; the phase must record
          a commit (a silently uncommitted review fails the promotion gate).
          KEEP EVERY WRITE INSIDE THE WORKTREE (`/repo`): the review goes to the
          worktree-relative `notes/adversarial_review.md`, and any scratch experiment lives
          under `notes/` (gitignored) — never `/tmp/...`, never `../...`. An edit outside the
          worktree raises a permission ASK that this headless cell cannot answer, and the
          phase stalls to its timeout (observed live: run-d0fdae00b0d6's g_adversarial sat on
          `edit /tmp/l23-server-owned-operations/notes/adversarial_review.md`).
