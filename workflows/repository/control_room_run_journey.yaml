name: control_room_run_journey
question: >-
  The Control Room run journey is not yet truthful or lossless: selecting a durable run on the
  ordinary overview shows COST unknown and "test result unknown" although the control record holds
  cost_usd and the ledger records the independent test outcome; and Escape inside the Operations
  run-detail drawer dismisses the whole workbench instead of returning to the found list.
version: "0.1"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: false
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules: []
metrics: []
comparison: null
writeup: {format: lab_book, sections: [question, implement, verify]}
stop: {budget_usd: 2.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
workflow:
  kind: agent_task
  params:
    language: python
    rag_augment: true
    rag:
      repository_id: agentic-dynamics
      acl_scope: public
      pattern_projection: false
      pinned_policy: |
        ## J1 — Glance
        *Continuous; no interaction. Rules [R1,R2,R5,R7,R10]. Surface: rest `R0 R1 R2 R3a R3b R3c`.*

        1. **Return to the room, don't click.** Read `R0`: `ON-G1` (browser/control/workers/projections,
           each state + worst age) and `ON-G6` (epoch, worst age, `stale/partial/unknown` counts).
           → *Expected:* four named states; a non-zero `stale` never renders green.
        2. **Read the attention inbox** `R1`: `R1a` decision (`ON-G5`) or `none pending`; `R1b` risk
           (`ON-G3`) or `all clear`; `R1c` next.
           → *Expected:* three reserved rows; a pending decision and a risk are both visible at once.
        3. **Read the run ledger** `R2`: exact counts (running/queued/failed/live) then 8 ranked rows with
           identity, phase `n/t`, lifecycle, live marker, claim/proof, cost provenance, eligibility.
           → *Expected:* live state never hidden behind a filter.
        4. **Read the constraint stack** `R3a` cost (all five `money.*` values + exception), `R3b` health,
           `R3c` four composition marginals.
           → *Expected:* unknown money is `unknown`, never `$0.00`.

        **PASS:** at 1440×900 and 390×844 a screenshot contains exactly one `[data-answer]` anchor for each
        of `ON-G1..G7`, in its canonical region (`G1→R0,G2→R2,G3→R1,G4→R3a,G5→R1,G6→R0,G7→R3c`), page does
        not scroll, no region overflows. **FAIL:** any answer is missing, duplicated, below the fold, or
        answered by a lens/mirror.

        ---

        ## J4 — Inspect
        *On demand, per selected run/attempt; per decision. Rules [R1,R2,R3,R5,R8,R9]. Surface: drill `R4c R4d L-WORKFORCE`.*

        1. **Select a run** in `R2` → `R4a` address band appears.
        2. **Read the evidence ladder** `R4c`: identity → lifecycle → narration → measured facts →
           independent verification → change/commit → cost provenance → decision → registry record.
           Each rung carries an evidence class + source + age.
        3. **Read the step timings** `R4d`: one `[data-timing]` row per
           `queue_wait|service_time|first_token|duration|retries|tokens.answer|tokens.explanation|cost|exit_code|verification`,
           each `[data-state="measured|unknown"]` with `[data-value]`. `[R2,R9]`
        4. **Aggregate across the fleet.** Open `L-WORKFORCE` for p50/p95 queue wait/service time, retry
           rate, tokens by model, Grit, narration penalty. `[R1,R2,R5,R8,R9]`

        **PASS:** `R4c` has one `[data-attempt-boundary]` per attempt; `R4d` renders the exact timing field
        set; an unobserved timing carries `data-state="unknown"` and **no** fabricated `0`; a measured row
        carries source+age. **FAIL:** a missing timing renders `0`, or narration is shown as truth.

        ---

        ## J5 — Watch Spend
    context:
      domain_context: >-
        canonical_sources: [apps/control_room/routes/glance.py (_recorded_ledger, _measured_state,
        _run_row cost.provenance), apps/control_room/static/parity.js (run-detail drawer, trapFocus),
        apps/control_room/static/app.js (selection-dock openDock), tests/test_control_room_glance_integrity.py,
        tests/test_control_room_feature_parity.py, tests/test_control_room_static_views.py,
        tests/test_admin_frontend.py, docs/reviews/control_room_run_journey_recovery.md]
        policies: [fix ONLY the run-journey fidelity and return defects; never fabricate a value,
        never render a missing cost as $0.00; keep honest unknown/unbound states; do not introduce a
        new read model, status authority, or dashboard; preserve every existing test and parity
        contract; a ledger pointer spelled /repo/... must resolve to the checkout for host-side
        reads; the selected-run detail must distinguish the agent narrative (said) from the
        independent verification (measured) from the run records; Escape in the Operations
        run-detail drawer returns to the found list with focus on the originating row and the finder
        intact, and only a second Escape closes the workbench]
        verification: [python3 -m pytest tests/test_control_room_glance_integrity.py
        tests/test_control_room_feature_parity.py tests/test_control_room_static_views.py
        tests/test_admin_frontend.py -q, python3 scripts/verify_control_room_rendering.py --check-fixtures]
    phases:
      - name: journey
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 5400
        prompt: |
          GOAL: {goal}
          Two browser-verified defects on current main (revision 4d834e9a9, 1440x900), both in the
          "find a run, open its details" journey:
          1. FIDELITY - selecting run-dc61bcb7d334 on the ordinary overview shows COST "unknown" and
             MEASURED "test result unknown", although the control record carries cost_usd=0.027517
             and the run ledger records test_executed_success=true / evaluator_independent=true.
             Verify and fix at the owners: the glance route reads the run ledger pointer
             "/repo/experiments/..." with a raw Path (it must resolve to the checkout on the host, or
             every ledger-derived field is silently unknown), and cost.provenance is hard-coded
             "unknown". The dock SAID/MEASURED rows must distinguish the agent narrative from the
             independent verification; a missing cost stays an explicit unknown (never $0.00).
          2. RETURN - with the Operations run-detail drawer open, Escape closes the whole workbench
             (drawer left open inside) instead of returning to the found list; the drawer own Escape
             listener never fires because focus sits on the originating row. Make Escape drawer-first:
             restore focus to the row, keep the finder value, and let a second Escape close the
             workbench. Preserve keyboard reachability.
          Work in apps/control_room/ (routes/glance.py, static/parity.js) and extend the existing tests
          only where a concrete risk is unasserted. Run the verification commands in
          context.verification and commit.
      - name: verify
        kind: test
        scope: implementation
        timeout: 900
        tests:
          - tests/test_control_room_glance_integrity.py
          - tests/test_control_room_feature_parity.py
          - tests/test_control_room_static_views.py
          - tests/test_admin_frontend.py
        prompt: |
          Independently verify the run-journey slice: the glance projection reports recorded cost and
          the independent verification verdict (or an explicit unknown), and the drawer Escape
          precedence is drawer-first with focus restored. Fix the code, never weaken a pin.
