name: control_room_run_journey
question: >-
  The served Control Room run drawer still cannot explain a real run. /api/runs/<id> returns
  only raw control records (run/attempts/gates/approvals/commands); the loaded drawer
  (app.js renderRunDetail) prints run.cost_usd — a NOT NULL 0.0, so a never-recorded cost
  renders $0.0000 — shows gate rows with no verification state or independence, and shows no
  delivered knowledge although the run ledger records selected evidence ids, augmentation
  evidence (id/revision/source_type/locator), retrieval fallback and leg errors; and no
  prepared-step reference. The correct derivations (_cost_provenance, _measured_state,
  _receipt_state, _recorded_ledger) exist only inside the glance route, which the served
  drawer never reads. Deliver only the missing slice: share the pure derivations at the
  service boundary, extend run_detail additively, record the prepared-step reference through
  its existing owners, render it in the loaded drawer, and extend the restored-board render
  gate — with the required failure-mode acceptance (missing and measured-zero cost, mixed
  provenance, failed/pending/non-independent verification, missing knowledge artifacts,
  HTTP-200 error envelopes, long-content reachability, Enter/Escape/focus return).
version: "0.2"
artifact_kind: workflow
intent: mutate
side_effects:
  repository: true
  external_services: false
repeatable: false
factors:
  - {name: model, levels: [deepseek/deepseek-v4-flash]}
design: factorial
rules: []
metrics: []
comparison: null
writeup: {format: lab_book, sections: [question, evidence, verify]}
stop: {budget_usd: 2.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
workflow:
  kind: agent_task
  params:
    language: python
    fork: false
    rag_augment: true
    rag:
      repository_id: agentic-dynamics
      acl_scope: public
      pattern_projection: false
      emit_self: false
      pinned_policy: |
        ## Pinned requirements — run-evidence slice (2026-09-19)

        TRUTHFULNESS: a measured zero stays a measured zero ("$0.0000 · metered"); a missing
        cost stays unknown (never $0.0000, never a fabricated amount); mixed contributors stay
        mixed. An unobserved timing or verification carries a named unknown, never a 0. The
        independent verification is shown separately from the agent's own claim — a process or
        agent claim is not independent acceptance.

        DELIVERY vs USE: show WHICH records were selected and WHAT was delivered into the
        prepared prompt (ids, revisions, locators, fallback mode, leg errors); an id proves
        neither relevance nor use — use is a separate, later judgement and is NOT claimed.

        SCOPE: the served page (index.html + app.js) is the journey; the parked parity.js
        workbench is NOT the target. No second read model or live-state authority; no
        business rules in JavaScript; no new endpoints; preserve the raw
        run/attempt/gate/approval/command blocks and existing callers; preserve every existing
        test that does not encode the old defect. Missing instrumentation is a named gap, not
        a frontend estimation task. Do not expose private coordinator history or raw
        unrestricted prompts through the UI.

        LAYOUT: keep the seven-board recovery direction; do not copy the superseded
        R0/R1/workbench selector requirements; preserve historical run artifacts; report
        coverage truthfully (an omitted check is not a pass).
    context:
      domain_context: >-
        canonical_sources: [apps/control_room/services/operations.py (run_detail),
        apps/control_room/services/context.py (run_detail wrapper + status/error envelopes),
        apps/control_room/routes/operations.py (GET /api/runs/<run_id>),
        apps/control_room/routes/glance.py (_recorded_ledger, _cost_provenance,
        _measured_state, _receipt_state, _narration_state, _attempt_number,
        _workspace_target, _cell_binding, _run_row),
        apps/control_room/static/app.js (openRunDetail, renderRunDetail, closeRunDetail,
        dataTable runIds wiring), apps/control_room/static/index.html,
        apps/control_room/static/style.css,
        apps/control_room/verification/fixtures/boards_endpoints.json,
        scripts/verify_control_room_rendering.py (restored-board classes: navigation,
        loading, degraded, scrolling, keyboard),
        src/agentic_dynamics/runtime/workflow_runner.py (PhaseResult fields:
        selected_evidence_ids, augmentation_evidence, retrieval_leg_errors, fallback_mode,
        augmentation_versions/tokens/cost), src/agentic_dynamics/runtime/executor.py
        (StepRequest/prepared-step/v1, load_prepared_step), scripts/fleet/docker_executor.py
        (_write_prepared_step, execute),
        tests/test_control_room_operations.py, tests/test_control_room_glance_integrity.py,
        tests/test_control_room_static_views.py, tests/test_control_room_feature_parity.py,
        tests/test_admin_frontend.py, tests/test_admin_server.py,
        tests/test_workflow_runner.py, tests/test_prepared_step_exactness.py,
        tests/test_prepared_step_transport.py,
        experiments/results/workflows/control_room_run_journey/20260918T192606777266Z_run-f8ec919c1601.json
        (a real ledger with phases + test verdicts) and
        experiments/results/workflows/flash_ladder_kb/20260918T221835639512Z_run-75e8319533fb.json
        (a real ledger with delivered knowledge: augmentation_evidence, fallback_mode,
        retrieval_leg_errors)]
        policies: [derive once at the service boundary and share between glance and run
        detail so both give the same answer for the same run; keep run_detail additive and
        its existing six top-level keys compatible; a missing cost stays unknown, a measured
        zero stays $0.0000 metered, mixed stays mixed; verification independence is shown
        separately from the agent's own claim; delivered knowledge is shown as selection +
        delivery and NEVER as use; a missing ledger or missing phase key is a named absence,
        never fabricated; timings are declared with measured|unknown state and no fabricated
        0; the prepared-step reference comes from its existing owner (no new transport, no
        broker/compose change); preserve raw blocks for existing callers; vanilla JS only,
        no build step; keep the tree lint-clean (ruff over src/ scripts/ apps/ tests/)]
        verification: [python3 scripts/verify_control_room_rendering.py --check-fixtures,
        python3 -m pytest tests/test_control_room_operations.py
        tests/test_control_room_glance_integrity.py tests/test_control_room_static_views.py
        tests/test_control_room_feature_parity.py tests/test_admin_frontend.py
        tests/test_admin_server.py tests/test_workflow_runner.py
        tests/test_prepared_step_exactness.py tests/test_prepared_step_transport.py -q]
    phases:
      - name: evidence
        kind: agent
        scope: implementation
        requires_deliverable: true
        timeout: 5400
        prompt: |
          GOAL: {goal}
          The served Control Room run drawer must explain a real run. Build the missing slice
          without a second read model.

          1. SHARE THE PURE DERIVATIONS AT THE SERVICE BOUNDARY. Move the pure presentation
             derivations out of apps/control_room/routes/glance.py into a service-owned module
             (apps/control_room/services/run_evidence.py, or services/operations.py):
             _resolve_recorded_path/_recorded_ledger (the "/repo/..." path must resolve to the
             checkout on the host), _cost_provenance, _measured_state, _receipt_state,
             _narration_state, _attempt_number, _workspace_target, _cell_binding. glance.py
             imports them (no duplicate implementations remain); operations.run_detail uses
             the same functions. Route -> service is the correct dependency direction.

          2. EXTEND run_detail ADDITIVELY. Keep the existing six top-level keys and the raw
             run/attempt/gate/approval/command blocks compatible. Add derived blocks:
             - cost: {provenance: "<label>"} — measured zero = "$0.0000 · metered"; absent =
               unknown; mixed contributors = mixed.
             - evidence: {measured, receipt, narration} — the same labels glance emits.
             - recorded: {ledger_path, present} — the pointer and whether it resolved.
             - delivered_knowledge: per phase, from the recorded ledger: selected_evidence_ids,
               augmentation_evidence [{id, revision, source_type, locator}], fallback_mode,
               retrieval_leg_errors, augmentation_versions/tokens/cost. Selection/delivery only
               — do NOT claim use. Missing ledger/key = named absence, never fabricated.
             - prepared: per phase, when recorded (see 3): the prepared step clone-relative
               path + prompt_sha256; otherwise a named missing.
             - timings: one row per timing field ACTUALLY recorded (declare the exact set from
               the run/attempt records + ledger; do not invent queue wait or first-token values
               that are not recorded): {field, value, state: measured|unknown}.

          3. RECORD THE PREPARED-STEP REFERENCE through existing owners (no new transport, no
             broker/compose change): when the orchestrator parent prepares a child step, record
             the prepared step's clone-relative path + prompt_sha256 on the phase result and the
             run ledger (copy through DockerAgentExecutor's StepResult into the PhaseResult; if
             the child envelope already carries it, reuse that field). Extend tests.

          4. RENDER IT IN THE LOADED DRAWER (app.js renderRunDetail). Show: cost provenance
             (fall back to "unavailable" — never a fabricated value); a Verification section
             with the independent verification separate from the agent's own claim (SAID vs
             MEASURED); a Delivered knowledge section (ids, revisions/locators, fallback mode,
             leg errors, "selected — use not established"); the prepared-step reference or its
             named gap; Timings rows with data-state="measured|unknown". Keep the existing
             identity/attempts/gates/approvals/commands tables and the existing error handling.
             Do not touch parity.js. No new endpoints. No client-side derivation of
             consequential values.

          5. FIXTURE + GATE. Update the run_detail seed in
             apps/control_room/verification/fixtures/boards_endpoints.json to the real payload
             shape (the current seed uses fields the real record does not have) plus the new
             blocks. Extend scripts/verify_control_room_rendering.py (restored-board classes)
             with drawer-content assertions: cost provenance including a measured-zero and an
             unknown case, one measured verification with independence, delivered-knowledge
             ids, one [data-state="unknown"] timing, and a run-detail HTTP-200 error-envelope
             case. Keep --check-fixtures green.

          6. TESTS. Extend tests/test_control_room_operations.py (block keys, the 200 envelope
             through the services layer, timings/delivered knowledge with and without a
             ledger), tests/test_control_room_glance_integrity.py (import path change; keep
             every existing assertion), tests/test_control_room_static_views.py and
             tests/test_control_room_feature_parity.py (drawer anchors),
             tests/test_admin_frontend.py, and the prepared-step/workflow-runner tests you
             touch. Run the verification commands in context.verification. Commit.
      - name: verify
        kind: test
        scope: implementation
        timeout: 900
        tests:
          - tests/test_control_room_operations.py
          - tests/test_control_room_glance_integrity.py
          - tests/test_control_room_static_views.py
          - tests/test_control_room_feature_parity.py
          - tests/test_admin_frontend.py
          - tests/test_admin_server.py
          - tests/test_workflow_runner.py
          - tests/test_prepared_step_exactness.py
          - tests/test_prepared_step_transport.py
        prompt: |
          Independently verify the run-evidence slice: run_detail carries the shared derived
          blocks and the raw blocks stay compatible; a missing cost is unknown (never
          $0.0000), a measured zero stays metered zero, mixed stays mixed; verification
          independence renders separately; delivered knowledge shows ids + revisions + fallback
          + leg errors and never claims use; timings carry measured|unknown with no fabricated
          0; the prepared-step reference is recorded. Fix the code, never weaken a pin.
