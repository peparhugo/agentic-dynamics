# Go: Concurrent URL Crawler with Domain Rate Limiting
# Roadmap Pillar 1 — Does reasoning overhead scale differently with concurrency?
name: go_crawler
task: >
  Build a concurrent web crawler CLI in Go. Accept a seed URL and max crawl depth
  as command-line flags. Use goroutines with a bounded worker pool (configurable
  concurrency). Each worker fetches a URL, extracts all `<a href>` links, and
  enqueues new URLs up to the depth limit. Respect robots.txt before fetching.
  Implement per-domain rate limiting (configurable delay between requests to the
  same host). Store crawled page metadata (URL, title, status code, links found,
  crawl depth, timestamp) in SQLite. Handle graceful shutdown via SIGINT/SIGTERM
  with in-flight request completion. Write comprehensive tests including table-driven
  tests for URL parsing, mock HTTP server for crawl behavior, and benchmark tests
  for the worker pool. Use only the standard library plus go-sqlite3 or modernc.org/sqlite.

constraints:
  - CLI with seed URL and max depth flags
  - Bounded goroutine worker pool
  - Link extraction from HTML
  - robots.txt compliance
  - Per-domain rate limiting
  - SQLite persistence of crawl metadata
  - SIGINT/SIGTERM graceful shutdown
  - Table-driven tests with mock HTTP server
  - Benchmark tests for worker pool

operators:
  - inject_alien_vocab
  - shift_framing
  - remove_critical_constraint
  - inject_phantom_success
  - invert_constraint
  - inject_competing_goal

strengths: [0.5]
model: deepseek
model_id: deepseek/deepseek-v4-pro

standardized:
  enabled: true
  enforce_pytest: false
