# Experiment: Notification system
name: notification_system
task: >
  Design a real-time notification system frontend. Must handle in-app
  notifications, push notifications (web + mobile), email digests.
  Support notification preferences (per-channel, per-type), batching
  to avoid notification fatigue, real-time delivery via WebSockets,
  read/unread state across devices, notification center with infinite
  scroll history, and actionable notifications (reply, approve, dismiss).
  Must degrade gracefully when offline.

turns:
  - [analyze, "Analyze requirements. What makes notification systems uniquely challenging on the frontend? 3-4 key issues."]
  - [design, "Design the architecture. How do you handle real-time delivery, cross-device read-state sync, and notification preference routing? Choose WebSocket vs SSE vs polling."]
  - [implement, "Write the data model for notifications and the component tree. Show the flow from server push to user seeing the notification."]
  - [review, "Review your design. What happens when 100 notifications arrive in 1 second? What would you change for 1M concurrent users?"]

operators:
  - inject_alien_vocab
  - shift_framing
  - reverse_causality
  - inject_false_premise
  - inject_phantom_success
  - remove_critical_constraint
  - invert_constraint
  - inject_competing_goal

strengths: [0.5, 0.8]
model: deepseek
model_id: deepseek-v4-pro
