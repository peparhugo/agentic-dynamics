# Experiment: Twitter timeline and search
name: twitter_timeline
task: >
  Design the Twitter timeline and search functionality. Users post tweets.
  Followers see a timeline of tweets. Tweets are searchable. Handle 200M+
  daily active users, 500M tweets/day. Famous users with millions of
  followers create fan-out challenges. Search must handle real-time indexing.

turns:
  - [analyze, "Analyze the requirements. What are the core engineering challenges? 3-4 sentences."]
  - [design, "Design the architecture. How do you handle the fan-out problem for users with millions of followers? Choose specific technologies."]
  - [implement, "Write the data model and core API. Show the tweet storage schema and the timeline generation approach."]
  - [review, "Review your design. What are its weaknesses? What would you change at 10x scale?"]

operators:
  - inject_alien_vocab
  - shift_framing
  - reverse_causality
  - inject_false_premise
  - inject_phantom_success
  - remove_critical_constraint
  - invert_constraint
  - inject_competing_goal

strengths: [0.5, 0.8]
model: deepseek
model_id: deepseek-v4-pro
