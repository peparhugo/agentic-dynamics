version: '3.8'

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ai-infra

  chromadb:
    image: chromadb/chroma:1.0.13
    container_name: chromadb
    restart: unless-stopped
    # Endpoint contract (2026-09-18 review): clients resolve localhost:8100 (CHROMA_PORT in
    # the kb-chroma unit; resolve_chroma_endpoint's host default). The host publishes 8100;
    # the container keeps answering on its internal 8000.
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      # The image's entrypoint runs `chroma run /config.yaml`, and the baked config's
      # persist_path is /data — PERSIST_DIRECTORY above is inert (kept for reference only).
      # The volume therefore mounts the ACTUAL persist path: previously it mounted
      # /chroma/chroma (empty) while 51M of live index sat in the container layer, so every
      # container recreation silently lost the dense index (the recurring-stall aftermath).
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chroma_data:/data
    # No healthcheck existed: a wedged server looked identical to a busy one. The heartbeat
    # endpoint is cheap and version-stable.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ai-infra

  opencode:
    image: sprisa/opencode:latest
    container_name: opencode-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:4096:4096"
    volumes:
      - /path/to/your/project:/home/opencode/workspace
      - opencode_config:/home/opencode/.config/opencode
    environment:
      - OPENCODE_PORT=4096
      - OPENCODE_SERVER_HOST=0.0.0.0
    stdin_open: true
    tty: true
    networks:
      - ai-infra

volumes:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  opencode_config:

networks:
  ai-infra:
    driver: bridge
