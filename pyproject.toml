[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-instrument"
version = "0.4.0"
description = "Reasoning topology instrument — probe how language models explore unfamiliar reasoning trajectories"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
