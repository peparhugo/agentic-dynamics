[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-dynamics"
version = "0.5.0"
description = "Agentic Dynamics — the empirical study of how AI agents behave, adapt, recover, and produce durable value across changing conditions; this package is the founding experimental instrument."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.22",
    "scikit-learn>=1.3",
    "pytest>=7.0",
    "pytest-timeout>=2.3.1",
    "tree-sitter==0.21.3",
    "tree-sitter-languages>=1.10",
    "duckdb>=1.0",
    "pyarrow>=14.0",
    "redis>=5.0",
]

[project.optional-dependencies]
all = [
    "chromadb>=0.4.0",
    "ollama>=0.3.0",
    "neo4j>=5.20",
]
chromadb = ["chromadb>=0.4.0"]
ollama = ["ollama>=0.3.0"]
neo4j = ["neo4j>=5.20"]
admin = ["flask>=3.0"]
# Evidence-integrity stream (cap_evidence_integrity): the Python repo's pinned LSP analyzer.
# The e3 phase must prove pyright runs on its fixture or explicitly record the unavailable-safe
# scope — the pin is the prerequisite either way.
lsp = ["pyright==1.1.390"]

# One entry point over the maintained scripts/ surface (rec 5): `agentic-dynamics` dispatches to
# the backing scripts via `agentic_dynamics.cli`. Each subcommand is a thin adapter (rec 8).
#
# CHECKOUT-ONLY (refactor-repair P1-2 packaging): the CLI forwards to repo-level scripts/ (which
# a wheel does NOT ship — see `[tool.setuptools.packages.find] where = ["src"]`), so it only
# works from a git checkout (`pip install -e .`). An installed wheel can print `--help` but
# dispatching a command emits a "checkout required" message (cli.CHECKOUT_REQUIRED). Script-logic
# migration into the package is deferred post-repair hardening, not done here.
[project.scripts]
agentic-dynamics = "agentic_dynamics.cli:main"

# Editable-install target: `pip install -e .` discovers every package under src/ — the
# modular monorepo `agentic_dynamics` (distribution "agentic-dynamics", dash; import package
# "agentic_dynamics", underscore). The transient `instrument.*` compat shim was removed at
# Stage 1's retire phase. Scripts bootstrap `src/` onto sys.path via `scripts/_bootstrap.py`.
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # sys.path bootstrap before local imports

[tool.ruff.lint.isort]
known-first-party = ["agentic_dynamics"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
# A hanging test is a FAILURE, never an infinite block (post-mortem:
# cap_stabilization_release p3 — a wrong-protocol service on the Chroma port
# stalled the deterministic suite ~60 min on two occasions because
# chromadb.HttpClient retries with no connect timeout). 600s per test only
# fires on genuine hangs; the deterministic suite's slowest tests run in
# well under this.
timeout = 600
