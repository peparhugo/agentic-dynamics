[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-instrument"
version = "0.1.0"
description = "Reasoning topology instrument — probe how language models explore unfamiliar reasoning trajectories"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "pyyaml>=6.0",
]

[project.scripts]
instrument-run = "scripts.run:run_experiment"

[tool.setuptools.packages.find]
where = ["src"]
