name: agentic_dynamics_story
question: "Can sol write a grounded, first-person founder story of building the field of Agentic Dynamics?"
version: "0.1"
workflow:
  kind: agent_task
  params:
    language: python
    phases:
      - name: scope
        kind: agent
        prompt: |
          Write docs/story_design.md: the narrative design for a personal founder's story.

          GOAL:
          {goal}

          READ THE SOURCE FIRST: docs/source/story_source.md — Thomas Jay Pepar Hugo's resume +
          LinkedIn (roles, dates, achievements, the full 13-year career arc). Every factual claim in
          the final story must trace to this source; do not invent employers, titles, dates, or numbers.

          THE THESIS (the pivot): the field is **Agentic Dynamics** — the discipline of measuring how
          AI agents actually work: cost, correctness, verification, recovery, maintainability, and how
          those compound over linked sessions. This is the broader, sharper name for what the internal
          experiments have been measuring (the site still says "AI FinOps Dynamics"; this story is a
          PIVOT to Agentic Dynamics and must not depend on the site).

          THE ARC (how Thomas BUILT the field):
          1. **The craft** — 13 years owning end-to-end data/AI delivery across investment management,
             energy, telecom, health, public sector: lakehouse modernization, executive reporting,
             GenAI/agentic workflows (Codecraft, MCP-style connectors), MILP/MPC optimization (Zerofy
             Autopilot). The through-line is measurement: he kept building systems whose value depended
             on knowing what was actually happening.
          2. **The realization** — agentic AI is now deployed at scale (his own Codecraft + agentic
             workflows), and nobody is measuring whether that agentic work creates value or just
             consumes cost. "A passing result doesn't tell you how the model searched, recovered,
             verified, or what it cost the next session."
          3. **The build** — the instrumentation machine: instrument → derive (measurement rules turn
             events into information) → write policy (control rules consume it) → grid (policy as an
             arm) → campaign. The N×M insight: one measurement question scales to N sessions × M
             measurement angles, plus the analysis burden. Verified in controlled experiments (grit,
             recovery cost, verification disposition, compounding).
          4. **The field** — Agentic Dynamics as the discipline that makes agentic work legible and
             governable: routing, escalation, budget, one-way/two-way doors. Not a product pitch — a
             field Thomas is defining.

          STYLE REQUIREMENTS:
          - First person. A founder telling a peer how he got here, not a marketer.
          - Concrete and grounded: real employers, real systems (Spark/dbt, MILP/GLPK, the 948-rule
            migration, the 45-57 min SLA), real numbers from the source — no fabricated superlatives.
          - The "why" carries the emotional spine (the need he saw), the "how" is the craft + the
            machine, the "what" is the field.
          - Length: substantial but tight — a LinkedIn-about-to-longform range. The scope doc must
            state the target length and the intended home (LinkedIn About vs a longform post vs a
            personal site statement).

          DELIVER exactly one file, docs/story_design.md: (1) the arc, (2) the specific source facts
          the story will use (with the source file's exact wording where quoted), (3) the target length
          + intended home, (4) the opening paragraph, (5) a list of facts that MUST NOT change.
      - name: write
        kind: agent
        prompt: |
          Write the story per docs/story_design.md.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          HARD RULES:
          - Ground every claim in docs/source/story_source.md. Do not invent employers, titles, dates,
            numbers, or outcomes.
          - First person, field-defining, not a product pitch. The field is Agentic Dynamics.
          - Write the story to docs/agentic_dynamics_story.md.

          DELIVER docs/agentic_dynamics_story.md.
      - name: verify
        kind: agent
        prompt: |
          Verify the story is factual and true to the brief.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          CHECKS:
          - Every employer, title, date, and number in the story appears in docs/source/story_source.md
            (or is a deliberate, clearly-marked paraphrase of it). Flag any unverifiable claim.
          - The field is consistently named Agentic Dynamics; no "AI FinOps Dynamics" dependency.
          - The arc is craft → realization → build → field; the instrumentation machine and the N×M
            insight appear; the tone is first-person founder, not marketing.

          DELIVER exactly one file, docs/verify.md: PASS/FAIL per check + a list of any claims that
          could not be traced to the source.
factors:
  - {name: model, levels: [openai/gpt-5.6-sol]}
design: factorial
metrics:
  - {name: cost_per_phase, agg: distribution, over: cell}
  - {name: tokens_per_phase, agg: distribution, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
stop: {budget_usd: 8.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
