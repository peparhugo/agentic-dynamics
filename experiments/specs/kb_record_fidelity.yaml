name: kb_record_fidelity
question: >-
  Fix record-field fidelity (BUG-1 + BUG-4/R5 + BUG-7): (a) observed_at is dropped on the stream
  round-trip and replaced by the producer's occurred_at; (b) the flag auto-clear rule re-parses
  producer prose instead of reading structured fields; (c) perturbation_strength is fabricated as
  0.0 in the summary-recovery migration, violating None != 0.0. Assumes kb_producer_factory has
  landed (R1) — this builds on its record-field surface.
version: "0.1"
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    context:
      finding: >-
        BUG-1 (HIGH): knowledge_ingestion.py:392 record_to_event sets occurred_at=_now_iso(now),
        :248 record_to_artifact blanks observed_at, :417-424 extract_record reattaches
        event.occurred_at — the cell's real run timestamp is irrecoverably replaced by the
        producer wall-clock. BUG-4 (MEDIUM): kb_worker.py:128-158 _cell_id_and_status_from_observation_text
        string-splits the rendered text (observation_ingestion.py:108 f"{cell_id} [{model}]: {status}")
        to run the auto-clear rule — a render change silently no-ops it. R5 fixes this by promoting
        cell_id/status to structured fields. BUG-7 (LOW): kb_produce_registry.py:243 defaults
        perturbation_strength to 0.0, stamping unmeasured historical cells as baseline.
      hard_rules: >-
        (1) None != 0.0 everywhere — unmeasured stays None. (2) Backward compat: 1,913 KB artifacts
        still parse; new fields are trailing-default (same pattern as causes/supersedes). (3) For
        BUG-1 prefer the smaller fix (stop blanking observed_at in record_to_artifact, folding it
        into content_hash) — but if that breaks idempotence, add an observed_at field to
        KnowledgeEvent and have extract_record prefer it. (4) Test-driven; do not weaken tests.
        (5) The auto-clear rule must read structured fields, never parse text.
      run_shape: >-
        SINGLE-model: run with --model deepseek/deepseek-v4-pro. One worktree, one branch
        (feature/kb-record-fidelity); each phase commits [workflow] <phase>.
    phases:
      - name: implement
        kind: agent
        timeout: 10800
        prompt: |
          Implement BUG-1 + BUG-4/R5 + BUG-7 per docs/review/bugs.md and restructure.md R5.

          GOAL:
          {goal}

          READ FIRST:
          - docs/review/bugs.md (BUG-1, BUG-4, BUG-7) + docs/review/restructure.md (R5)
          - src/instrument/knowledge_ingestion.py (record_to_artifact / record_to_event / extract_record)
          - src/instrument/knowledge.py (the causes/supersedes trailing-default pattern)
          - src/instrument/observation_ingestion.py + scripts/kb_worker.py (the auto-clear rule)
          - scripts/kb_produce_registry.py:243

          DO:
          - BUG-1: make observed_at round-trip (the cell's own timestamp, not the producer clock),
            with a regression test that round-trips a stamped entry.
          - BUG-4/R5: add subject_id/subject_status trailing-default fields to KnowledgeRecord;
            populate structurally in the observation/flag producers; rewrite kb_worker's auto-clear
            rule to read them (delete the text-split heuristic) with a test that a text-format
            change does NOT break clearing.
          - BUG-7: drop the 0.0 default so an absent perturbation_strength stays None.

          VERIFY: pytest tests/test_knowledge.py tests/test_knowledge_ingestion.py
          tests/test_observation_ingestion.py tests/test_kb_worker.py tests/test_kb_produce_registry.py -q
          — must pass.
          DELIVER the code + passing tests.
      - name: test
        kind: agent
        timeout: 7200
        prompt: |
          Run the full gate and fix regressions.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          DO:
          - Run `pytest tests/ -m "not external" -q`. Fix any failure without weakening a test.
          - Re-verify the 1,913-artifact backward-compat invariant.

          DELIVER a green full suite.
      - name: verify
        kind: agent
        timeout: 3600
        prompt: |
          Trace BUG-1/BUG-4/BUG-7 to the code.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          DO:
          - Write docs/review/impl_kb_record_fidelity.md: a table tracing each bug to its fix, with
            PASS/FAIL and the pytest result.

          DELIVER docs/review/impl_kb_record_fidelity.md.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules:
  - name: bugs_fixed
    plane: measurement
    evidence_class: "[M]"
    requires: []
    produces: [observed_at_roundtrip, subject_fields, perturbation_none]
metrics:
  - {name: observed_at_roundtrip, agg: mean, over: cell}
  - {name: subject_fields, agg: mean, over: cell}
  - {name: perturbation_none, agg: mean, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
writeup:
  format: lab_book
  sections: [question, implement, test, verify]
stop: {budget_usd: 10.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
