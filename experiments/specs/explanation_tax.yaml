name: explanation_tax
question: >-
  What fraction of a session's output-token cost is explanation (reasoning prose) rather than
  answer (code and committed decisions), and does the answer/explanation split predict
  correctness or flail — the Explanation Tax — under natural vs forced-silent modes?
version: "0.1"
workflow:
  kind: task
  params:
    tasks: [task_manager, static_site_gen]
    silent_modes: [natural, forced_silent]
factors:
  - {name: model,        levels: [deepseek/deepseek-v4-pro, deepseek/deepseek-v4-flash, anthropic/claude-haiku-4-5, openai/gpt-5.6-luna]}
  - {name: silent_mode,  levels: [natural, forced_silent]}
design: factorial
rules:
  - {name: instrument_token_split, plane: measurement, evidence_class: "[M]", requires: [], produces: [answer, explanation]}
  - {name: explanation_tax,        plane: measurement, evidence_class: "[C]", requires: [answer, explanation, tokens_reasoning, cost_inference], produces: [explanation_tax]}
  - {name: narration_coupling,     plane: measurement, evidence_class: "[C]", requires: [explanation, completed], produces: [think_do_coupling]}
metrics:
  - {name: explanation_tax,   agg: mean, over: cell}
  - {name: think_do_coupling, agg: mean, over: cell}
  - {name: correctness,       agg: mean, over: cell}
comparison: {kind: effect_size, arm_factor: silent_mode, loss: {cost: 1.0, quality: -5.0}}
writeup: {format: lab_book, sections: [hypothesis, method, results, interpretation]}
stop: {budget_usd: 10.0, max_attempts: 1}
adapt: {strategy: manual, selection: largest_effect}
