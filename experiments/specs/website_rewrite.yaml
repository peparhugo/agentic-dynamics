name: website_rewrite
question: >-
  Can the public site be rewritten so it introduces Agentic Dynamics as a field and an
  instrument expressed as BUSINESS OUTCOMES (not a SaaS pitch, not an abstract theory) — with
  the dead taxonomy, stale corpus numbers, and the "Explanation Tax"/"100% pass rate"
  overclaims removed, and the instrumented fields + self-healing finding added — preserving
  the front-page diagram and the framework-page SVG?
version: "0.1"
workflow:
  kind: agent_task
  params:
    language: html
    fork: true
    model_pool:
      - deepseek/deepseek-v4-pro
      - deepseek/deepseek-v4-flash
    context:
      positioning: >-
        Read docs/agentic_dynamics_vision.md FIRST. The one-sentence thesis: "AI agents don't
        have a price — they have dynamics; cost, reliability, and debt are properties of how the
        agent behaves under change." Every page must express the dynamics->business-outcome table
        (basin escape = cost of change; recovery cost = cost of regression; snowball = maintenance;
        flail = wasted spend; survival horizon = runway; grit = reliability under stress; debt =
        maintenance liability). NOT a SaaS pitch. NOT abstract.
      stale_to_remove: >-
        (1) "manifold"/"semantic" taxonomy -> process_perturbation / objective_mutation /
        specification_corruption. (2) corpus counts 227/249 -> 144 single-task (49 valid) +
        156 story (772 sessions). (3) "Explanation Tax" -> "output decomposition" (reasoning is
        the cost, not narration; reasoning is DeepSeek-only). (4) self-reported "100% pass rate"
        -> split from independent test_executed_success ([tests]). (5) the provenance overclaim
        "every term measured" (beta/EPM are external) -> tag honestly.
      missing_to_add: >-
        The four instrumented ledger fields (confidence, perturbation_strength,
        test_executed_success, answer/explanation split), the self-healing finding, and the
        measured headline numbers below.
      headlines: >-
        [M] ~30x cost spread at equal outcome ($0.014 vs $0.44/run, 100% correct). [M] recovery
        from real degradation is real but 4.6x cost compounding. [M] the premium model fails where
        the cheap one doesn't (Claude 60% on shift_framing vs DeepSeek 100%). [M] static_site_gen
        correctness 0.39. [C] verification correlation -0.077. [H] self-healing re-run.
      keep: >-
        Preserve the front-page diagram and the framework-page SVG. Do not delete them.
    phases:
      - name: rewrite
        kind: agent
        timeout: 14400
        prompt: |
          Rewrite the public site per docs/agentic_dynamics_vision.md.

          GOAL:
          {goal}

          READ FIRST:
          - docs/agentic_dynamics_vision.md   (the positioning + the per-page plan)
          - firebase/public/*.html            (the 8 pages to rewrite)
          - firebase/public/data.js           (the generated, provenance-tagged data)

          REQUIREMENTS:
          - index.html: keep the diagram; put the one-sentence thesis up top; the four measured
            headlines as the body.
          - evidence.html: full rewrite — cost spread, recovery cost, premium-failure,
            static_site_gen correctness, verification correlation, the four instrumented fields.
          - methodology.html: 10 operators (3-way taxonomy), the measured ledger fields, the
            measure-before-policy gate, the queue pipeline.
          - framework.html: reorganize around the dynamics->business-outcome table; KEEP the SVG;
            drop SaaS/playbook framing.
          - story.html: extend through the remediation + self-healing arc.
          - accelerator.html + databricks.html: refresh numbers; frame as operational hypotheses
            + related work, not product applications.
          - glossary.html: drop manifold/semantic; add grit, perturbation_strength, output
            decomposition, self-healing.
          - Every number provenance-tagged [M]/[C]/[H]/[X]/[P], grounded in data.js. Remove the
            stale taxonomy, stale counts, "Explanation Tax", and the self-reported-100% overclaim.

          DELIVER the rewritten HTML.
      - name: review
        kind: agent
        timeout: 10800
        prompt: |
          Review the rewritten site with three independent models and consolidate their feedback.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          REQUIREMENTS:
          - Run three independent reviews of the rewritten firebase/public/*.html — one each with
            deepseek/deepseek-v4-pro, anthropic/claude-fable-5, and openai/gpt-5.6-sol — asking:
            (a) does it read as "a field + an instrument expressed as business outcomes", not a
            SaaS pitch and not abstract; (b) are the provenance tags honest; (c) are the numbers
            consistent with data.js; (d) what is missing or overstated.
          - Consolidate the three reviews into docs/website_rewrite_review.md with per-model
            verdicts and a merged action list. Do NOT silently drop a disagreement.

          DELIVER docs/website_rewrite_review.md.
      - name: verify
        kind: agent
        timeout: 7200
        prompt: |
          Verify the rewrite and prepare for deploy.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          REQUIREMENTS:
          - Confirm no stale terms remain (grep for manifold, semantic, 227, 249, "Explanation
            Tax", and the unqualified "100% pass rate") across firebase/public/*.html.
          - Confirm the front-page diagram and framework SVG are intact.
          - Confirm every number traces to data.js with a provenance tag.
          - Write docs/website_rewrite_verify.md with PASS/FAIL per check.

          DELIVER docs/website_rewrite_verify.md.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
rules:
  - {name: site_consistency,  plane: measurement, evidence_class: "[M]", requires: [], produces: [provenance_clean]}
  - {name: publish_ready,     plane: control,     evidence_class: "[P]", requires: [provenance_clean], produces: [deployable]}
metrics:
  - {name: stale_terms_removed, agg: ratio, over: cell}
  - {name: numbers_provenance_tagged, agg: ratio, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
writeup:
  format: lab_book
  sections: [question, rewrite, review, verify]
stop: {budget_usd: 8.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
