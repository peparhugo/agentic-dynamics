name: workflow_step_routing
question: >-
  Can deepseek-v4-pro add intelligent per-step model routing to the workflow layer, where (a) an
  unconstrained step may use any supported model, (b) a step with allowed_models routes only within
  that subset, (c) the routing policy is a coding-session-authored control rule that consumes measured
  experiment outputs/costs plus user routing preferences (e.g. lowest cost with highest edge-case code
  coverage), and (d) every step forks from the previous session to maximize DeepSeek cache-read hits?
version: "0.2"
workflow:
  kind: agent_task
  params:
    language: python
    fork: true
    model_pool:
      - deepseek/deepseek-v4-pro
      - deepseek/deepseek-v4-flash
      - openai/gpt-5.6-sol
      - openai/gpt-5.6-luna
      - openai/gpt-5.6-terra
      - anthropic/claude-fable-5
      - anthropic/claude-haiku-4-5
      - anthropic/claude-sonnet-5
    context:
      cache_economics: >-
        DeepSeek cache reads are ~120x cheaper than input (PROVIDER_PRICING: deepseek input $0.435/1k,
        cache_read $0.003625/1k; deepseek-flash input $0.14/1k, cache_read $0.0028/1k). Maximizing
        cache-read hits is the dominant cost lever for deepseek-heavy workloads.
      observed_usage: >-
        Operator Aug 2026: $60.10 across 37,367 requests / 3.51B tokens. deepseek-v4-pro dominates
        (17,263 requests, 2.97B tokens); deepseek-v4-flash (20,104 requests, 542M tokens). A shared,
        forked session prefix turns most of that pro volume into cache reads.
    phases:
      - name: survey
        kind: agent
        prompt: |
          Survey how routing, measurement, and session forking work today, then write
          docs/routing_survey.md.

          GOAL:
          {goal}

          READ FIRST:
          - src/instrument/routing.py — recommend_route() (per-task default vs escalate),
            simulate_strategies(), compute_routing().
          - src/instrument/backends.py — get_backend_for_model() (anthropic/* -> claude_cli,
            else opencode), run_agentic().
          - src/instrument/opencode.py — AgenticResult.cache_read_tokens / cache_write_tokens /
            cache_hit_rate; where cache tokens are parsed from opencode JSON output; and
            run_opencode_agentic(session_id, fork) -> --session <id> --fork.
          - src/instrument/claude_adapter.py — run_claude_agentic(session_id, fork) ->
            --resume <id> --fork-session (captures the forked session id from the init event).
          - src/instrument/workflow_runner.py — the ALREADY-BUILT cache-aware fork chaining:
            workflow.params.fork gates it; each agent phase forks the prior phase's session id
            (--session/--fork or --resume/--fork-session) when the model is unchanged, and the
            per-phase ledger records cache_read_tokens / cache_write_tokens / cache_hit_rate.
          - src/instrument/story.py — the --session <id> --fork continuation path (~lines 660-711),
            _read_session_id(); prior art for how a fork reuses the context prefix.
          - src/instrument/efficiency.py — PROVIDER_PRICING: deepseek cache_read vs input rates.
          - src/instrument/solution.py — SolutionMetrics (correctness_score, constraint_score,
            code_quality_score, novelty_score).
          - src/instrument/experiment_spec.py — Workflow, Factor, RuleSpec, validate_rules() /
            validate_spec() (the requires/produces gate).
          - scripts/_constants.py — model_slug(), MODEL_LABELS. scripts/supervise.py — KNOWN_CELL_MODELS.
          - scripts/lab_cache_economics.py — how cache-hit economics are measured today.
          - scripts/build_data.py — where compute_routing() becomes the site's routing section.
          - code_reviews/2026-08-14_experiment-spec-and-compiler-design.md — the load-bearing rule
            (measure before policy) and the model_cascade/routing control arm.

          SURVEY REQUIREMENTS:
          - Map the current routing path end to end: which signals recommend_route() consumes
            (correctness, cost, efficiency from _results_summary.json entries), what it emits, and where
            that output is consumed.
          - Inventory the MEASURED signals a routing policy may consume today: correctness, cost,
            cache_hit_rate, efficiency, and the SolutionMetrics quality dimensions. Identify what is
            NOT yet measured — specifically edge-case code coverage (no branch/mutation coverage
            signal exists), and confidence.
          - Document the fork mechanism precisely: how --session <id> --fork (opencode) and
            --resume <id> --fork-session (claude) reuse the context prefix as cache reads, and what
            happens to the cache when the model CHANGES between steps.

          DELIVER exactly one file, docs/routing_survey.md: (1) current routing path with file:line
          citations, (2) measured vs unmeasured signals, (3) the fork/cache mechanism, (4) the gap for
          per-step model selection and preference-aware routing.
      - name: design
        kind: agent
        prompt: |
          Design preference-aware per-step routing plus cache-aware forking, and write
          docs/routing_design.md.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          REQUIRED SEMANTICS (fixed, not negotiable):

          A. Per-step model selection — each step (phase) declares exactly one of:
             1. `model: <id>` — pin that exact model; the router must honor it.
             2. `allowed_models: [<id>, ...]` — choose only from this subset.
             3. neither — choose from the FULL model pool.
             The choice is intelligent: it selects the model that best fits the step per measured
             signals, never a random or first-element pick.

          B. The routing policy is a coding-session-authored control rule. It is CODE (a
             route_step(job, state, prefs) -> model_id function) that a coding session writes and
             maintains, and it consumes:
             - measured experiment outputs & costs: _results_summary.json entries, compute_routing()
               output, lab_cache_economics.json, per-model correctness/cost/efficiency/cache_hit_rate;
             - user routing preferences (see C).

          C. User preferences — a `preferences` block expressing weighted objectives over measured
             signals, e.g. "lowest cost with highest edge-case code coverage" becomes something like:
               objectives:
                 - {signal: cost, direction: minimize, weight: 1.0}
                 - {signal: edge_case_coverage, direction: maximize, weight: 1.0}
             The policy converts objectives into a scoring function over the eligible set. Design the
             schema, the scoring function, and the tie/fallback behavior.

          D. Cache-aware forking — ALREADY IMPLEMENTED in workflow_runner.py (fork: true). Every
             step forks from the previous step's session (opencode --session <prev_id> --fork /
             claude --resume <prev_id> --fork-session) so the shared context prefix is served as a
             cache read. The design's job is the trade-off: switching model between steps BREAKS the
             cache prefix, so the routing policy must weigh cache-read savings against routing to a
             different (better) model, using PROVIDER_PRICING cache_read vs input rates.

          E. Load-bearing rule — the policy consumes only MEASURED signals. `edge_case_coverage` is
             NOT yet in the ledger: the design must either (1) specify how to instrument it (e.g.
             branch coverage or a mutation-test pass rate) as a measurement rule producing it, or
             (2) gate that objective behind the validator until it exists. `confidence` remains
             unmeasured and must NOT be consumed. Document this as the ordering the validator enforces.

          DELIVER exactly one file, docs/routing_design.md: (1) the step schema (model/allowed_models/
          unconstrained), (2) route_step signature + selection algorithm, (3) the preferences schema +
          scoring function, (4) the cache-aware fork chaining design + the model-switch-vs-cache
          trade-off, (5) the edge_case_coverage instrumentation plan and validator gating, (6) edge
          cases and fallbacks.
      - name: implement
        kind: agent
        prompt: |
          Implement per docs/routing_design.md.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          HARD RULES:
          - Follow repo conventions: snake_case functions, PascalCase classes, type hints on public
            signatures, dataclasses over dicts. Update src/instrument/__init__.py for new exports.
          - Do not break existing routing consumers (scripts/build_data.py routing section,
            tests/test_routing.py). Reuse recommend_route()/compute_routing(); add the per-step
            eligible-set + preference-scoring layer on top, do not fork the logic.
          - Implement the three-step selection semantics exactly: pin wins, allowed_models restricts to
            the subset, unconstrained draws from the full pool. Validate allowed_models (unknown id,
            empty subset) at spec load time.
          - Implement the preferences block -> scoring function over measured signals.
          - Cache-aware forking is ALREADY BUILT (workflow_runner.py, fork: true). Do not rebuild it.
            Your routing policy must respect it: it can only select a different model for a step when
            the cache-prefix loss (cache_read vs input pricing) is worth the routing gain. If the
            policy keeps the same model, the existing chaining already forks for free.
          - Do not consume unmeasured fields (confidence, edge_case_coverage) unless you also ship the
            measurement rule that produces them.
          - When running tests, specify the exact test files (e.g. tests/test_routing.py,
            tests/test_workflow_runner.py, tests/test_backends.py, tests/test_claude_adapter.py,
            tests/test_experiment_spec.py, tests/test_compile_experiment.py). NEVER run bare
            `pytest`, `pytest tests/ -q`, or `python -m pytest tests/`.

          DELIVER the implementation plus tests. Cover: pin wins; allowed_models restricts the choice;
          unconstrained draws from the full pool; preference scoring (lowest-cost-highest-coverage
          example); the model-switch-vs-cache-prefix trade-off is priced; graceful fallback when no
          measurement exists for a step.
      - name: verify
        kind: agent
        prompt: |
          Verify the implementation and write docs/routing_verify.md.

          GOAL:
          {goal}

          PRIOR PHASES:
          {prior_phases}

          CHECKS:
          - Run ONLY the routing-relevant tests — never a bare suite — and report the exact command
            + results. Specify the files explicitly, e.g.:
            `python -m pytest tests/test_routing.py tests/test_workflow_runner.py tests/test_backends.py tests/test_claude_adapter.py tests/test_experiment_spec.py tests/test_compile_experiment.py -q`.
            Any failure introduced by this change must be fixed before reporting PASS.
          - Confirm the three-step semantics (pin / allowed_models subset / full pool) are tested.
          - Confirm allowed_models validation rejects unknown ids and empty subsets.
          - Confirm the preferences block maps to a scoring function over MEASURED signals, and that
            the "lowest cost + highest edge-case coverage" example degrades or gates cleanly when
            edge_case_coverage is not yet measured.
          - Confirm cache-aware forking still works end to end (workflow_runner.py fork: true): each
            step forks from the prior session id, and the routing policy prices a model switch against
            the lost cache prefix.
          - Confirm the router reads only measured signals and does not reference confidence.
          - Run `python -c "from instrument.experiment_spec import validate_spec"` to confirm
            the spec module still imports and validates cleanly.

          DELIVER exactly one file, docs/routing_verify.md: PASS/FAIL per check, the exact pytest
          command + results, and a summary of what changed.
factors:
  - {name: model, levels: [deepseek/deepseek-v4-pro]}
design: factorial
metrics:
  - {name: cost_per_phase, agg: distribution, over: cell}
  - {name: tokens_per_phase, agg: distribution, over: cell}
  - {name: cache_hit_rate, agg: distribution, over: cell}
comparison: {kind: effect_size, arm_factor: model, loss: {cost: 1.0, quality: -5.0}}
stop: {budget_usd: 10.0, max_attempts: 1}
adapt: {strategy: manual, selection: highest_regret}
