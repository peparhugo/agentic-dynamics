# experiments/contexts/session_routing.yaml
#
# The decision-type contract for CAP addendum I10 (design §4.2): "should this session continue,
# fork, compress-and-fork, or escalate to a different model" — the SHADOW-ONLY (design §4.3;
# `AUTOMATABLE_ACTIONS` untouched, `control/decisions.py`) sibling of `route_next_job.yaml`.
#
# ── MATERIAL DEVIATION FROM THE ADDENDUM'S OWN §4.2 SKETCH — read before editing this file ──
#
# The addendum's literal text groups five action-specific facts under `invariants:`, commented
# "(1) continue's invariants", "(2) fork/compress_and_fork's invariant", "(3) escalate's
# invariants". `ContractSpec.invariants` (`control/context_compiler.py`) has NO per-action
# scoping mechanism — `compile_context` resolves the ENTIRE `invariants:` list unconditionally,
# ONCE, before any action is chosen (`ContextRequest` carries no `action` field at all; the SAME
# admissibility verdict governs every action a decision of this type could ever propose — see
# `route_next_job.yaml`'s own two invariants, `allowed_models`/`max_spend_usd`, both genuinely
# unconditional across `route` AND `continue`).
#
# Combining all five facts unconditionally is not merely imprecise, it is UNSATISFIABLE: a
# `continue`-only invariant (`checkpoint_goal_unchanged` et al., `on_missing: halt`) and an
# `escalate`-only invariant (`model_change_required`, `on_missing: halt`) are LOGICALLY MUTUALLY
# EXCLUSIVE under the checkpoint/v1 reducer's own positive-marker convention (`control/reducers/
# checkpoint.py`): the model either changed (which fires `model_change_required` and leaves
# `checkpoint_model_unchanged` absent) or it did not (the reverse) — never both. Making BOTH
# unconditional invariants means this contract's snapshot would be INADMISSIBLE for every real
# session, permanently: whichever of the two never fires halts admissibility outright. A first
# session (no checkpoint at all — the addendum's own "legitimately unknown" framing for
# `session_checkpoint`, mirrored below) would ALSO be permanently blocked by `checkpoint_present:
# on_missing: halt`, contradicting the addendum's own stated intent that `continue` must remain
# available on a first phase. This is a genuine adversarial finding against the addendum's own
# YAML sketch (documented alongside D1-D7 in `docs/context_abstraction/implementation_notes.md`
# §15) — not a stylistic preference.
#
# RESOLUTION: all five action-specific facts move to `requires_facts` — AND, this is the part
# that actually matters (a first pass at this fix moved the facts but left `on_missing: halt`,
# which reproduces the identical unsatisfiability under a different heading: `compile_context`'s
# `_apply` helper applies `on_missing in {halt, escalate} -> admissible = False` IDENTICALLY for
# `invariants` and `requires_facts` — nothing about the `requires_facts:` heading is inherently
# "soft"; only `on_missing: classify`/`investigate` degrade without blocking admissibility,
# `control/context_compiler.py`'s `_apply`/`compile_context`, verified empirically: a first-phase
# request against this contract with `on_missing: halt` on these five facts came back
# `admissible=False` — the exact bug this file's header claims to resolve, reintroduced). The
# actual fix: each of the five action-specific facts below is `on_missing: classify` — its
# ABSENCE is recorded (an `Unknown`, visible on `ControlContext.unknowns`) but never blocks
# admissibility. The per-ACTION gating the addendum's prose actually wants is implemented where
# this architecture already puts that kind of logic: inside the control RULE FUNCTION itself
# (`control.rules.session_routing_v1`), which reads these (possibly-absent) facts from the
# compiled snapshot via `ctx.job` and decides which action to propose — the SAME pattern
# `route_next_job_v1` already uses for `workflow_phases_remaining`/`allowed_models` (soft
# `requires_facts`, rule-level branching), not a novel one. `invariants:` below is empty — this
# contract genuinely has no fact that is a safety precondition for EVERY one of its four actions;
# `workflow_phases_remaining` below keeps `on_missing: halt` because it IS unconditionally needed
# by every action this decision type could ever propose (REUSE of `route_next_job.yaml`'s own
# precedent, design §6.1's example) — it is the one entry in this list that is not action-scoped.
decision_type: session_routing
contract_version: "session_routing/v1"

# The scope at which this decision is made — one session's own job/cell.
decision_scope: job

# continue | fork | compress_and_fork | escalate (addendum A.4). All four are PROPOSAL-ONLY in
# v1 — `AUTOMATABLE_ACTIONS` (`control/decisions.py`) stays exactly `{continue, route}`; none of
# these four is ever applied (design §4.3, F4's resolution: the session-continuation `continue`
# is a POSITIVE `[H]` decision, a different action from the routing null-action `continue` this
# contract's sibling uses, and admitting it under that name would let an automated controller
# apply an unmeasured trade — see the module docstring of `control/rules.py`'s
# `session_routing_v1` for the full citation).
allowed_actions: [continue, fork, compress_and_fork, escalate]

# The TOCTOU guard (validator check C7) — same value as route_next_job.yaml (design's own §6.1
# figure, reused verbatim, ~2x a typical phase gap).
max_snapshot_age_seconds: 300

# No genuinely unconditional safety invariant exists for this decision type — see the file
# header. R11 (an invariant with on_missing outside {halt, escalate} is refused) is trivially
# satisfied by an empty list; `tests/test_context_plane_contracts.py::
# test_shipped_session_routing_contract_never_fails_r11` checks this against the real loader.
invariants: []

# Required facts: the state this decision is ALLOWED to see. The five action-specific facts all
# use `on_missing: classify` (never `halt`) — their absence is recorded as an Unknown but never
# blocks THIS snapshot's admissibility; `control.rules.session_routing_v1` reads their presence/
# absence from `ctx.job` and does the actual per-action refusal (see the file header for why
# `halt` here would be unsatisfiable). Only `workflow_phases_remaining`, which every action
# genuinely needs, keeps `on_missing: halt`.
requires_facts:
  # The checkpoint's own raw payload — "a first phase has no checkpoint yet" is legitimately
  # unknown, exactly the same on_missing:classify posture route_next_job.yaml already uses for
  # job_accumulated_cost_usd on a first phase.
  - fact: session_checkpoint
    scope: self
    max_age_seconds: 600
    min_authority: DERIVED
    on_missing: classify
    on_conflict: halt

  # v1: STRUCTURALLY NEVER PRODUCED (checkpoint/v1 never emits it — D2, no snapshot producer
  # exists). classify, not halt: "unenforceable in v1" degrades gracefully rather than blocking
  # every decision of this type forever — the addendum's own "v1: unenforceable... degrade, do
  # not halt" framing, now correctly placed where `classify` is a legal on_missing value (R11
  # forbids it under `invariants`, not under `requires_facts`).
  - fact: checkpoint_snapshot_identity
    scope: self
    max_age_seconds: 600
    min_authority: DERIVED
    on_missing: classify
    on_conflict: halt

  # continue's gate (addendum "(1)"): each of the three equality markers is present ONLY when
  # BOTH a checkpoint and a fresh comparison state were supplied AND the value actually matches
  # (checkpoint/v1's positive-marker convention). `on_missing: classify` (NOT halt — see this
  # file's header): a missing marker here means "continue cannot be PROVEN safe", which is a
  # per-action refusal `session_routing_v1` implements by simply never proposing `continue` when
  # any of the three is absent from `ctx.job` (falls through to `escalate`/`fork` instead) — it
  # must NOT make the entire snapshot inadmissible, or `escalate`/`fork` could never be proposed
  # either (they are evaluated from the SAME snapshot). "no checkpoint", "no fresh state to
  # compare", and "the value changed" all resolve to the SAME absence, which is exactly what
  # continue needs: a session may only be told to resume when its context is provably unchanged,
  # never "probably" or "we don't know" — enforced by the rule reading `ctx.job`, not by halting.
  - fact: checkpoint_goal_unchanged
    scope: self
    max_age_seconds: 600
    min_authority: DERIVED
    on_missing: classify
    on_conflict: halt
  - fact: checkpoint_phase_unchanged
    scope: self
    max_age_seconds: 600
    min_authority: DERIVED
    on_missing: classify
    on_conflict: halt
  - fact: checkpoint_model_unchanged
    scope: self
    max_age_seconds: 600
    min_authority: DERIVED
    on_missing: classify
    on_conflict: halt

  # fork / compress_and_fork's gate (addendum "(2)"): never fork blind — a checkpoint must exist.
  # `on_missing: classify`, same reasoning as above: `session_routing_v1` reads `ctx.job` for
  # `checkpoint_present` and proposes `continue` (not `fork`) when it is absent (module docstring
  # of `control/rules.py`'s `session_routing_v1`, case 1) — the refusal is structural (the rule
  # can never reach its `fork` branch without having found `checkpoint_present` first), not a
  # halted snapshot. Halting here would ALSO make `escalate`/`continue` inadmissible on a first
  # phase, which is the addendum's own explicitly-required case (continue must stay available).
  - fact: checkpoint_present
    scope: self
    max_age_seconds: 600
    min_authority: DERIVED
    on_missing: classify
    on_conflict: halt

  # escalate's gate (addendum "(3)"): a checkpoint plus an EVIDENCED model change (never assumed).
  # `on_missing: classify` for the same reason as the other four: `checkpoint_model_unchanged`
  # and `model_change_required` are MUTUALLY EXCLUSIVE by the reducer's own positive-marker
  # convention (`control/reducers/checkpoint.py`) — exactly one of them is present on any session
  # that has both a checkpoint and a fresh comparison state, and the OTHER is therefore always
  # absent. Two `on_missing: halt` entries that are mutually exclusive by construction would make
  # this contract inadmissible for EVERY real session with a checkpoint — verified empirically
  # while fixing this file (see header) — which is exactly why both must degrade, not halt.
  - fact: model_change_required
    scope: self
    max_age_seconds: 600
    min_authority: DERIVED
    on_missing: classify
    on_conflict: halt

  # REUSE — the same parent-scope fact route_next_job.yaml already requires (design §6.1's own
  # example), so a session decision is never made blind to how much work remains.
  - fact: workflow_phases_remaining
    scope: parent
    max_age_seconds: 600
    min_authority: DERIVED
    on_missing: halt
    on_conflict: halt

excludes:
  - sibling_job_facts    # lateral reads are forbidden by the hierarchy (design §10.2)
  - live_telemetry       # DB 1 is never a fact source (design §10.4)
  - advisory_facts       # available in ControlContext.advisory, never citable (check C5, I6)
