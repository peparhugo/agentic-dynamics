# Multi-phase iterative development experiment
name: iterative_build
task: >
  Build a team collaboration platform with Python/Flask and SQLite.
  Include: user auth with JWT, project CRUD, task management within projects,
  comments on tasks, file attachments (store paths, not actual files),
  team member roles, and a pytest test suite.

  Phase 1: Build the complete initial app with all features and tests.
  Phase 2: Refactor storage to support PostgreSQL via SQLAlchemy abstractions.
  Phase 3: Add real-time comment notifications via WebSocket (Flask-SocketIO).
  Phase 4: Update all tests and verify everything still works.

constraints:
  - JWT authentication
  - Project CRUD with tasks
  - Comment system
  - File attachment support
  - Role-based access
  - PostgreSQL-ready with SQLAlchemy
  - WebSocket notifications
  - Comprehensive tests
  - Each phase must build on the previous

operators:
  - inject_alien_vocab
  - remove_critical_constraint
  - invert_constraint

strengths: [0.5]
model: deepseek
model_id: deepseek/deepseek-v4-pro
