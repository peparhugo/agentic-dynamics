# Experiment: Baseline perturbation matrix
name: baseline
task: >
  Build a URL shortener: REST API for create/redirect,
  collision-resistant short codes, persistent storage,
  rate limiting, click analytics.

turns:
  - [analyze, "Analyze the requirements. List 3-4 key design decisions. Be concise."]
  - [design, "Design the system architecture. Specify technologies. 3-4 sentences."]
  - [implement, "Write the data model and core API endpoints. Python/Flask. Under 40 lines."]
  - [review, "Review your design. What are its weaknesses? What would you change?"]

operators:
  - inject_alien_vocab
  - shift_framing
  - reverse_causality
  - force_abandonment
  - inject_false_premise
  - inject_phantom_success
  - remove_critical_constraint
  - invert_constraint
  - insert_contradiction
  - inject_competing_goal

strengths: [0.5, 0.8]
model: deepseek
model_id: deepseek/deepseek-v4-pro
rng_seed: 42
