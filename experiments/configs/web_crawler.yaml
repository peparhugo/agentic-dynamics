# Experiment: Web crawler design
name: web_crawler
task: >
  Design a web crawler that can index the entire web. Must respect robots.txt
  and crawl politeness. Handle billions of pages, avoid infinite loops,
  deduplicate content, distribute across machines. Pages change — must
  recrawl. Handle dynamic content, rate limiting, and legal compliance.

turns:
  - [analyze, "Analyze the requirements. What makes web crawling fundamentally different from other distributed systems? 3-4 sentences."]
  - [design, "Design the architecture. How do you handle URL frontier, deduplication, and politeness across distributed workers? Choose specific technologies."]
  - [implement, "Write the data model for the URL frontier and the page store. Show how you'd avoid re-crawling the same page."]
  - [review, "Review your design. What breaks at 100 billion pages? What would you change?"]

operators:
  - inject_alien_vocab
  - shift_framing
  - reverse_causality
  - inject_false_premise
  - inject_phantom_success
  - remove_critical_constraint
  - invert_constraint
  - inject_competing_goal

strengths: [0.5, 0.8]
model: deepseek
model_id: deepseek/deepseek-v4-pro
