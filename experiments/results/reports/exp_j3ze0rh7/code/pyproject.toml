[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-url-shortener"
version = "1.0.0"
description = "Persistent Flask URL shortener with rate limiting and click analytics"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
