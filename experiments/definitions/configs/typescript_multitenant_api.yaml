# TypeScript/Node.js: Prisma-backed Multi-tenant SaaS API
# Roadmap Pillar 1 — Multi-tenant isolation + strict typing stress test
name: typescript_multitenant_api
task: >
  Build a multi-tenant REST API with TypeScript, Express, and Prisma ORM.
  Use PostgreSQL (or SQLite for portability) with row-level tenant isolation
  via a tenant_id foreign key on every table. Include: tenant registration,
  API key generation and validation middleware, CRUD for a tenant-scoped
  resource (e.g. documents or tasks), pagination, soft-delete with deleted_at
  timestamps, request logging middleware, input validation with zod, and
  comprehensive tests with vitest and supertest. Include Prisma schema,
  migration files, and seed data. Write all code. Be thorough.

constraints:
  - Multi-tenant data model with tenant_id on all tables
  - Tenant registration and API key generation
  - API key auth middleware
  - Tenant-scoped CRUD with Prisma
  - Zod input validation schemas
  - Pagination with cursor-based pagination
  - Soft-delete pattern (deleted_at column)
  - Request logging middleware
  - Prisma schema with migrations
  - Vitest + supertest integration tests

operators:
  - inject_alien_vocab
  - shift_framing
  - remove_critical_constraint
  - inject_false_premise
  - invert_constraint
  - inject_competing_goal

strengths: [0.5]
model: deepseek
model_id: deepseek/deepseek-v4-pro

standardized:
  enabled: true
  enforce_pytest: false
