# Constraint detection experiment — explicitly measures recovery
name: constraint_detection
task: >
  Build an authenticated REST API with these requirements:
  1. JWT-based user auth with refresh tokens
  2. Rate limiting on login endpoint (5 attempts/minute/IP)
  3. Input validation on all endpoints
  4. Paginated list responses (20 items/page, max 100)
  5. Comprehensive error handling with proper HTTP status codes
  6. Audit logging of all mutation operations
  7. API versioning via URL prefix (/v1/...)
  Use Python/Flask + SQLAlchemy + pytest.

phases:
  - [analyze, "Read the requirements. Identify which constraints are critical vs optional. Report what you found."]
  - [build, "Build the complete application with ALL listed requirements. Write tests. Run them."]
  - [verify, "Run all tests. Verify every constraint from the requirements is implemented. Report pass/fail for each."]

constraints:
  - JWT auth with refresh tokens
  - Rate limiting on login
  - Input validation on all endpoints
  - Paginated list responses
  - Error handling with proper HTTP codes
  - Audit logging of mutations
  - API versioning via URL prefix

operators:
  - remove_critical_constraint
  - inject_phantom_success

strengths: [0.5]
model: deepseek
model_id: deepseek/deepseek-v4-pro
repetitions: 3
