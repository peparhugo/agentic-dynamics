# TypeScript/Node.js: Real-time WebSocket Event Bus
# Roadmap Pillar 1 — Does N² hold in strictly-typed, compiled environments?
name: typescript_eventbus
task: >
  Build a real-time event bus with TypeScript, Express, and the `ws` library.
  Use SQLite (via better-sqlite3) for persistence. The server must support:
  multiple WebSocket clients subscribing to named channels, publishing messages
  to channels with at-least-once delivery semantics, message persistence with
  replay on reconnect, JWT authentication for connection handshake, rate limiting
  per connection (max messages/sec), a REST health check endpoint, and graceful
  shutdown. Write all code including package.json, tsconfig.json, and a
  comprehensive test suite using vitest. Be thorough but concise.

constraints:
  - WebSocket server with channel subscription
  - Message publish/subscribe with channel routing
  - SQLite persistence of messages
  - JWT auth on WebSocket connect
  - Rate limiting per connection
  - REST health check endpoint
  - Graceful shutdown handling
  - Test suite with vitest (unit + integration)

operators:
  - inject_alien_vocab
  - shift_framing
  - remove_critical_constraint
  - inject_phantom_success
  - invert_constraint
  - inject_competing_goal

strengths: [0.5]
model: deepseek
model_id: deepseek/deepseek-v4-pro

standardized:
  enabled: true
  enforce_pytest: false
