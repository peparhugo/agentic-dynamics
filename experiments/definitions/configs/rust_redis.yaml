# Rust: RESP-protocol In-Memory Database with AOF Persistence
# Roadmap Pillar 1 — Will silent inference produce borrow-checker-compliant code?
name: rust_redis
task: >
  Build an in-memory key-value database in Rust that speaks the Redis Serialization
  Protocol (RESP). Listen on a configurable TCP port using tokio. Parse incoming
  RESP byte streams. Implement GET, SET, DEL, EXISTS, and EXPIRE commands with TTL
  support. Handle concurrent client connections with tokio::spawn. Use a
  HashMap<String, (String, Option<Instant>)> behind an Arc<RwLock<>> for shared state.
  Implement append-only file (AOF) persistence: every write command is appended to
  a log file; on startup, replay the AOF to restore state. Run a background task
  that periodically evicts expired keys. Include proper error responses following
  the RESP error format. Write comprehensive tests using a real TCP client, test
  concurrent access, TTL expiration timing, and AOF replay. Provide a Cargo.toml
  with dependencies. Be thorough but concise.

constraints:
  - TCP server on configurable port using tokio
  - RESP protocol parsing
  - GET, SET, DEL, EXISTS, EXPIRE commands
  - Concurrent client handling with shared state
  - TTL-based key expiration with background eviction
  - AOF persistence with replay on startup
  - RESP error responses
  - Tests: TCP client, concurrency, TTL, AOF replay
  - Cargo.toml with dependencies

operators:
  - inject_alien_vocab
  - shift_framing
  - remove_critical_constraint
  - inject_phantom_success
  - invert_constraint
  - inject_competing_goal

strengths: [0.5]
model: deepseek
model_id: deepseek/deepseek-v4-pro

standardized:
  enabled: true
  enforce_pytest: false
