# Rust: Git-like Content-Addressable Object Store
# Roadmap Pillar 1 — Zero-copy parsing + complex data structures in Rust
name: rust_git_store
task: >
  Build a content-addressable object store inspired by Git's internals in Rust.
  Support four object types: blob (raw file contents), tree (directory listings
  mapping names to hashes), commit (tree hash, parent hash(es), author, message,
  timestamp), and tag (annotated tag pointing to a commit). Hash objects with
  SHA-1 (or SHA-256). Store objects as deflate-compressed files on disk in a
  .git/objects-like directory structure (first two hex chars as directory, rest
  as filename). Provide a CLI with subcommands: hash-object (read stdin/file,
  compute hash, store), cat-file (read by hash, decompress, print to stdout),
  write-tree (walk a directory, create tree and blob objects), and commit-tree
  (create a commit object). Accept input from both stdin and files. Write
  comprehensive tests with temp directories, verify hash consistency, round-trip
  encode/decode, and concurrent read access. Provide Cargo.toml. Be thorough.

constraints:
  - CLI with hash-object, cat-file, write-tree, commit-tree subcommands
  - SHA-1 or SHA-256 content hashing
  - Deflate-compressed object storage on disk
  - Blob, tree, commit, and tag object types
  - Read from stdin and files
  - Directory walking for write-tree
  - Round-trip encode/decode correctness
  - Tests with tempdirs and concurrent reads
  - Cargo.toml with minimal dependencies

operators:
  - inject_alien_vocab
  - shift_framing
  - remove_critical_constraint
  - inject_false_premise
  - invert_constraint
  - inject_competing_goal

strengths: [0.5]
model: deepseek
model_id: deepseek/deepseek-v4-pro

standardized:
  enabled: true
  enforce_pytest: false
