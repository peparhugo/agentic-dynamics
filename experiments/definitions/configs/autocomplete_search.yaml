# Experiment: Autocomplete/Search widget
name: autocomplete_search
task: >
  Design an autocomplete search widget (like Google Search or Algolia).
  Must handle debounced input, server-side suggestions with caching,
  keyboard navigation (arrow keys, enter, escape), highlighted matching
  text, recent searches, search history, results grouping by category,
  loading/error/empty states, accessibility (ARIA combobox pattern),
  responsive (mobile dropdown vs desktop overlay), and analytics tracking.
  Must feel instant (<100ms perceived latency).

turns:
  - [analyze, "Analyze requirements. What makes an autocomplete search widget deceptively complex? 3-4 key challenges."]
  - [design, "Design the architecture. How do you achieve <100ms perceived latency? How do you handle request cancellation, result caching, and keyboard navigation? Choose libraries/patterns."]
  - [implement, "Write the component tree and event flow. Show the full lifecycle from keystroke to rendered suggestions, including cancellation of in-flight requests."]
  - [review, "Review your design. What breaks when the user types faster than your API responds? What would you change for multi-language support?"]

operators:
  - inject_alien_vocab
  - shift_framing
  - reverse_causality
  - inject_false_premise
  - inject_phantom_success
  - remove_critical_constraint
  - invert_constraint
  - inject_competing_goal

strengths: [0.5, 0.8]
model: deepseek
model_id: deepseek/deepseek-v4-pro
