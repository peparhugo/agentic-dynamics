# Architecture redesign experiment — measures restructuring cost
name: architecture_redesign
description: >
  Game theory: the model starts with a working monolith. The task is to
  restructure it into microservices. This tests whether the model can
  perform a fundamental architecture change without breaking functionality.

  Physics: refactoring requires understanding the full codebase (cache reads),
  proposing a new structure (active reasoning), and migrating code while
  preserving tests (forward passes × codebase size). Each step costs energy.

  Economics: the cost of restructuring vs the cost of building from scratch.
  If redesign_cost > rebuild_cost, the architecture is not economically
  maintainable through AI agents.

task: >
  The previous session built a collaboration platform as a Flask monolith
  (all code in one app). The codebase is in this directory.

  Phase 1 (ANALYZE): Map the current architecture. Identify which modules
  are tightly coupled. What would need to change to split into services?

  Phase 2 (DESIGN): Propose a microservice architecture. Which services?
  What's the API contract between them? How do you handle shared state?

  Phase 3 (MIGRATE): Implement the migration. Split the monolith into
  at least 3 services. Update all imports. Ensure the test suite still
  passes. This is the hard part — the migration must work.

  Phase 4 (VERIFY): Run the full test suite. Fix any integration issues.
  Measure: did the migration preserve all functionality? What was the cost?

operators:
  - inject_alien_vocab
  - invert_constraint

strengths: [0.5]
model: deepseek
model_id: deepseek/deepseek-v4-pro

constraints:
  - Original test suite must pass on the restructured code
  - External API must not change
  - At least 3 services after migration
  - Inter-service communication documented
