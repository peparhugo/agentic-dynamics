name: Tests & Data Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy
          pip install -e .

      - name: Run core tests (no external services)
        run: |
          pytest tests/test_perturb.py tests/test_pricing.py tests/test_correctness_lineage.py -v

      - name: Verify build_data integrity (dry run)
        run: |
          python scripts/build_data.py --dry-run 2>&1 || true
