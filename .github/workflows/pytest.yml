name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Independent required jobs — lint, test, repro, packaging (cap_stabilization_release p4).
# A lint failure must never hide test results: each job is its own status check, and branch
# protection requires all four (docs/release/branch_protection_settings.md). The deterministic
# suite is the test job's sole responsibility; lint owns ruff; repro owns the Docker
# reproduction; packaging owns the wheel-honesty gates.

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.10"

      - name: Lint (ruff, whole active surface)
        run: |
          pip install ruff==0.16.2
          # `ruff check .` is the p2 verification command: src/ tests/ scripts/ apps/
          # workflows/ and scripts/archive/ are ALL kept lint-clean (archive policy:
          # lint-clean, not excluded — decided + documented in scripts/CONTEXT.md).
          ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity (tests commit in temp worktrees)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pyyaml numpy scikit-learn tree-sitter==0.21.3 tree-sitter-languages
          # The deterministic suite imports the knowledge clients at collection time
          # (test_graph -> neo4j, embeddings -> chromadb, ollama_analyzer -> ollama,
          # sync_data --check -> duckdb+pyarrow) — the [admin] extra is not enough;
          # the stabilization split's first green run exposed this (lint had hidden
          # it: the old combined job never reached tests).
          pip install -e ".[admin]"
          pip install neo4j chromadb ollama duckdb pyarrow

      - name: Run deterministic test suite (external-service tests excluded)
        run: |
          # --timeout: a hanging test is a failure, never an infinite block
          # (cap_stabilization_release p3 post-mortem: the Chroma live tests hung the
          # suite ~60 min; the heartbeat guards + this timeout make hangs impossible to miss)
          pytest tests/ -m "not external" -v --timeout=600

      - name: Verify build_data imports cleanly (no DB required)
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import build_data; print('build_data imports OK')"

      - name: Verify build_data integrity (dry run)
        run: |
          python scripts/build_data.py --dry-run
        env:
          ALLOW_MISSING_EXPERIMENT_DATA: "1"

      - name: Verify parquet parity (sync_data --check)
        run: |
          python scripts/sync_data.py --check

      - name: Import gate
        run: |
          python -c "import agentic_dynamics; print('agentic_dynamics imports OK')"

  # Refactor-repair P1-1 gates: a clean Docker build must succeed, and both
  # reproduction entrypoints (CLI + reproduce.sh) must at least parse + dispatch.
  repro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.10"

      - name: Install package (console entry point)
        run: |
          python -m pip install --upgrade pip
          # The deterministic suite imports the knowledge clients at collection time
          # (test_graph -> neo4j, embeddings -> chromadb, ollama_analyzer -> ollama,
          # sync_data --check -> duckdb+pyarrow) — the [admin] extra is not enough;
          # the stabilization split's first green run exposed this (lint had hidden
          # it: the old combined job never reached tests).
          pip install -e ".[admin]"
          pip install neo4j chromadb ollama duckdb pyarrow

      - name: Gate — CLI resolves and prints help (agentic-dynamics --help)
        run: agentic-dynamics --help

      - name: Gate — reproduction entrypoint dry-run (scripts/reproduce.sh --dry-run)
        run: bash scripts/reproduce.sh --dry-run

      - name: Gate — reproduce.sh core/opt-in split (review item 7, dry-run only)
        run: |
          # Core is deterministic + no external services: --no-tests --no-sonar.
          bash scripts/reproduce.sh --dry-run | grep -q -- "--no-tests --no-sonar"
          # The Neo4j / SonarQube labs are opt-in, not in the core set.
          bash scripts/reproduce.sh --dry-run --with-neo4j | grep -q -- "lab_basin_topology_neo4j.py"
          bash scripts/reproduce.sh --dry-run --with-sonar | grep -q -- "lab_sonar_quality.py"

      - name: Gate — clean image build (docker build -t agentic-dynamics .)
        run: docker build -t agentic-dynamics .

      - name: Gate — container CORE run on the committed canonical fixture
        run: |
          # Run the image's ACTUAL default command (reproduce.sh core) against the
          # committed canonical corpus (experiments/data_manifest.json + results),
          # not merely build + dry-run. Core needs no opencode.db, SonarQube, or
          # Neo4j (inventory/analyze warn-and-continue; labs read the registry).
          # Mount a scratch dir as apps/website so the rebuilt data.js persists and
          # is verifiable (the review item 7 data.js persistence fix). Also mount the
          # manifest as a single file (it regenerates OUTSIDE the results/ mount) so
          # its regeneration is verifiable too (the canonical-publication c6 fix).
          mkdir -p /tmp/repro-out/website
          cp experiments/data_manifest.json /tmp/repro-out/data_manifest.json
          docker run --rm \
            -v /tmp/repro-out/website:/app/apps/website \
            -v /tmp/repro-out/data_manifest.json:/app/experiments/data_manifest.json \
            agentic-dynamics
          test -s /tmp/repro-out/website/data.js
          test -s /tmp/repro-out/data_manifest.json
          echo "CORE reproduce produced data.js ($(wc -c < /tmp/repro-out/website/data.js) bytes)"
          python - <<'PY'
          import json
          committed = json.load(open("experiments/data_manifest.json"))
          regenerated = json.load(open("/tmp/repro-out/data_manifest.json"))
          assert regenerated["generated_at"] != committed["generated_at"], \
              "data_manifest.json was not regenerated inside the container"
          print(f"CORE reproduce regenerated data_manifest.json (generated_at {regenerated['generated_at']})")
          PY

  # Refactor-repair P1-2 (packaging): the CLI is checkout-only — it forwards to repo-level
  # scripts/ which a wheel does not ship. This job proves the wheel install is honest about
  # that: `--help` works and documents the requirement, and dispatching a command emits a
  # clear "checkout required" message with a non-zero exit.
  packaging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.10"

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist/

      - name: Install wheel into a clean venv (no checkout scripts/)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --no-deps dist/*.whl

      - name: Gate — installed CLI --help documents checkout-only
        run: /tmp/wheel-venv/bin/agentic-dynamics --help | grep -qi "checkout-only"

      - name: Gate — command from a wheel (no scripts/) requires a checkout
        run: |
          set +e
          /tmp/wheel-venv/bin/agentic-dynamics experiment run >/dev/null 2>/tmp/wheel-command.err
          rc=$?
          set -e
          grep -q "checkout required" /tmp/wheel-command.err
          test "$rc" -ne 0
