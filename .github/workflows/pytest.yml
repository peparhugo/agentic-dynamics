name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Independent jobs — a lint failure must never hide test results, so each concern is its own
# status check (cap_stabilization_release p4). The deterministic suite is the test job's sole
# responsibility; lint owns ruff; surfaces owns the generated-instruction drift gate; repro owns
# the Docker reproduction; packaging owns the wheel-honesty gates; workflow-parity owns the
# one-engine contract.
#
# REQUIRED vs PRESENT: branch protection currently requires lint / test / repro / packaging
# (docs/release/branch_protection_settings.md, and the machine-readable twin in
# scripts/check_branch_protection.py's EXPECTED). `workflow-parity` and `surfaces` run on every
# push but are not yet in that required set — promoting a check is a change to LIVE branch
# protection, which is the controller's call (a P0 action), not something a workflow edit can
# assert. Until then they are loud-but-not-blocking, and this note is why.

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.10"

      - name: Lint (ruff, whole active surface)
        run: |
          pip install ruff==0.16.2
          # `ruff check .` is the p2 verification command: src/ tests/ scripts/ apps/
          # workflows/ and scripts/archive/ are ALL kept lint-clean (archive policy:
          # lint-clean, not excluded — decided + documented in scripts/CONTEXT.md).
          ruff check .

  # control_db_publication p5: the instruction surfaces are ONE generator's output — the root
  # AGENTS.md/CLAUDE.md as much as .opencode/ and .claude/. This job is the drift gate: it
  # re-renders everything in memory and fails on any surface that is stale, missing, or orphaned.
  # Its own status check, and deliberately dependency-free (stdlib only, no install step), so
  # "someone edited agent_config/ and forgot to regenerate" is a fast, unambiguous red — never a
  # line buried in a job that needed a package index to be reachable.
  surfaces:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.10"

      - name: Gate — generated instruction surfaces match agent_config/
        run: |
          # Writes nothing. Exit 1 means: edit agent_config/, run
          # `python3 scripts/_gen_instructions.py`, and commit the regenerated surfaces.
          python3 scripts/_gen_instructions.py --check

      - name: Gate — docs drift (spec lifecycle)
        run: |
          # aio_controller_postmortem R3: a generated surface and its dependents never drift.
          # The scanner re-derives the spec-lifecycle counts from
          # experiments/specs/index.json and fails when a source doc (the README "By the
          # Numbers" row) disagrees — a red build instead of a silent stale count. The scanner
          # is stdlib-only, so it stays in this dependency-free job; it reports other axes
          # (anchor integrity, manifest counts) but only this one is gated, because the
          # untracked data plane legitimately breaks data-file anchors.
          python3 scripts/scan_docs_drift.py --check spec_lifecycle --fail-on-drift

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # The checkpoint/relabel replay fixtures (tags replay/*) live on unmerged
          # campaign branches — a depth-1 checkout never fetches their objects, so the
          # replay tests fail in CI while passing locally. Full history + tags fixes it.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity (tests commit in temp worktrees)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@localhost"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pyyaml numpy scikit-learn tree-sitter==0.21.3 tree-sitter-languages
          # The deterministic suite imports the knowledge clients at collection time
          # (test_graph -> neo4j, embeddings -> chromadb, ollama_analyzer -> ollama,
          # sync_data --check -> duckdb+pyarrow) — the [admin] extra is not enough;
          # the stabilization split's first green run exposed this (lint had hidden
          # it: the old combined job never reached tests).
          pip install -e ".[admin]"
          pip install neo4j chromadb ollama duckdb pyarrow

      - name: Run the fast path (the smoke the guards run on every change)
        run: |
          # test_suite_speed p3-d wiring: the fast path is CI's fast smoke — the `fast`-marked
          # subset (the sub-minute guard family + the audited pure-unit families: no real
          # subprocesses, no Redis/stores/ports, no real git worktrees). It must stay green AND
          # under its 180s budget (the slow-regression trip wire in tests/test_fast_path_gate.py).
          bash scripts/test_fast.sh

      - name: Restore the corpus fixture (post-migration CI coverage)
        run: |
          # Corpus migration (2026-09-08): experiments/results/** is untracked runtime data,
          # so a fresh clone has NO corpus and the resolution/publication tests would skip.
          # Restore the committed fixture snapshot so CI keeps running them (a regression in
          # registry resolution or lab publication fails here instead of only locally).
          mkdir -p experiments/results
          cp -r tests/fixtures/corpus/* experiments/results/
          ls experiments/results/ | head -3

      - name: Run deterministic test suite (external-service tests excluded)
        run: |
          # --timeout: a hanging test is a failure, never an infinite block
          # (cap_stabilization_release p3 post-mortem: the Chroma live tests hung the
          # suite ~60 min; the heartbeat guards + this timeout make hangs impossible to miss)
          pytest tests/ -m "not external" -v --timeout=600

      - name: Verify build_data imports cleanly (no DB required)
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import build_data; print('build_data imports OK')"

      - name: Verify build_data integrity (dry run; empty-corpus smoke)
        run: |
          # CI has no full corpus post-migration (experiments/results/** is untracked runtime
          # data; the fixture snapshot carries registry + labs, not the story payloads the
          # resolution gate reads). Run the build against a self-consistent EMPTY registry so
          # the code path is still exercised and the fail-closed resolution gate has nothing
          # to refuse; the FULL-corpus build stays local-only.
          cp experiments/data_manifest.json /tmp/ci_manifest.committed.json
          printf '{"schema_version": "1.0", "registry": []}\n' > experiments/data_manifest.json
          python scripts/build_data.py --dry-run
          cp /tmp/ci_manifest.committed.json experiments/data_manifest.json
        env:
          ALLOW_MISSING_EXPERIMENT_DATA: "1"

      - name: Verify parquet parity (sync_data --check; full corpus only)
        run: |
          # The fixture snapshot carries registry + summary + labs, NOT the payload tree the
          # parity recompute reads (tests/conftest.py `_full_corpus_present` — the same
          # predicate the @requires_full_corpus tests use). Without payloads, resolution
          # yields zero rows and the check would compare nothing against nothing; skip loudly
          # instead of fabricating a pass or failing on an absent corpus.
          if [ -f experiments/results/registry_index.jsonl ] && [ -f experiments/results/_results_summary.json ] && [ -d experiments/results/reports ]; then
            python scripts/sync_data.py --check
          else
            echo "SKIP: full corpus payloads absent (fixture-only checkout) — parquet parity runs where the data root lives"
          fi

      - name: Import gate
        run: |
          python -c "import agentic_dynamics; print('agentic_dynamics imports OK')"

  # P0-2 (control-plane stabilization): the workflow-parity contract. The ONE semantic
  # engine must produce identical parent states whether an agent step runs in-process
  # (LocalAgentExecutor) or in a sibling container (DockerAgentExecutor). This job runs
  # the parity suite — synthetic, no-provider workflows (fake executors, no docker, no
  # model calls) — as its own status check so a parity regression is a named failure,
  # not a line buried in the deterministic suite.
  workflow-parity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.10"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
          pip install -e ".[admin]"

      - name: Run the workflow-parity suite (no-provider, no docker, no model calls)
        run: |
          # P0-2 parity: success / agent failure (later step not started) / test failure /
          # awaiting approval (later step not started) / invalid scope (no container) /
          # the exit-code contract — all through the ONE engine across executors.
          pytest tests/test_workflow_executor_parity.py -v --timeout=600

  # Refactor-repair P1-1 gates: a clean Docker build must succeed, and both
  # reproduction entrypoints (CLI + reproduce.sh) must at least parse + dispatch.
  repro:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.10"

      - name: Install package (console entry point)
        run: |
          python -m pip install --upgrade pip
          # The deterministic suite imports the knowledge clients at collection time
          # (test_graph -> neo4j, embeddings -> chromadb, ollama_analyzer -> ollama,
          # sync_data --check -> duckdb+pyarrow) — the [admin] extra is not enough;
          # the stabilization split's first green run exposed this (lint had hidden
          # it: the old combined job never reached tests).
          pip install -e ".[admin]"
          pip install neo4j chromadb ollama duckdb pyarrow

      - name: Gate — CLI resolves and prints help (agentic-dynamics --help)
        run: agentic-dynamics --help

      - name: Gate — reproduction entrypoint dry-run (scripts/reproduce.sh --dry-run)
        run: bash scripts/reproduce.sh --dry-run

      - name: Gate — reproduce.sh core/opt-in split (review item 7, dry-run only)
        run: |
          # Core is deterministic + no external services: --no-tests --no-sonar.
          bash scripts/reproduce.sh --dry-run | grep -q -- "--no-tests --no-sonar"
          # The Neo4j / SonarQube labs are opt-in, not in the core set.
          bash scripts/reproduce.sh --dry-run --with-neo4j | grep -q -- "lab_basin_topology_neo4j.py"
          bash scripts/reproduce.sh --dry-run --with-sonar | grep -q -- "lab_sonar_quality.py"

      - name: Gate — clean image build (docker build -t agentic-dynamics .)
        run: docker build -t agentic-dynamics .

      - name: Gate — container CORE run (self-consistent empty-corpus smoke)
        run: |
          # Run the image's ACTUAL default command (reproduce.sh core), not merely build +
          # dry-run. Post corpus-migration (2026-09-08) experiments/results/** is untracked
          # runtime data, so a CI checkout has NO full corpus: the fixture snapshot carries
          # registry + labs, not the story payloads the publication resolution reads. Rather
          # than pretend, this smoke mounts a self-consistent EMPTY registry (nothing to
          # resolve, so the fail-closed resolution gate has nothing to refuse) and asserts
          # the pipeline runs end-to-end in the image: inventory/analyze warn-and-continue,
          # the labs render absent data honestly, build_data rebuilds data.js, and
          # generate_manifest rebuilds the manifest. The FULL-corpus reproduction stays
          # local-only; a fixture-backed reproduction gate is a named follow-up.
          # The website scratch mount persists the rebuilt data.js (review item 7). The
          # manifest mount keeps the regenerated manifest verifiable (canonical-publication c6).
          mkdir -p /tmp/repro-out/website
          printf '{"schema_version": "1.0", "registry": []}\n' > /tmp/repro-out/data_manifest.json
          docker run --rm \
            -v /tmp/repro-out/website:/app/apps/website \
            -v /tmp/repro-out/data_manifest.json:/app/experiments/data_manifest.json \
            agentic-dynamics
          test -s /tmp/repro-out/website/data.js
          test -s /tmp/repro-out/data_manifest.json
          echo "CORE reproduce produced data.js ($(wc -c < /tmp/repro-out/website/data.js) bytes)"
          python - <<'PY'
          import json
          regenerated = json.load(open("/tmp/repro-out/data_manifest.json"))
          assert regenerated.get("generated_at"), \
              "data_manifest.json was not regenerated inside the container"
          print(f"CORE reproduce regenerated data_manifest.json (generated_at {regenerated['generated_at']})")
          PY

  # Refactor-repair P1-2 (packaging): the CLI is checkout-only — it forwards to repo-level
  # scripts/ which a wheel does not ship. This job proves the wheel install is honest about
  # that: `--help` works and documents the requirement, and dispatching a command emits a
  # clear "checkout required" message with a non-zero exit.
  packaging:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.10"

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist/

      - name: Install wheel into a clean venv (no checkout scripts/)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --no-deps dist/*.whl

      - name: Gate — installed CLI --help documents checkout-only
        run: /tmp/wheel-venv/bin/agentic-dynamics --help | grep -qi "checkout-only"

      - name: Gate — command from a wheel (no scripts/) requires a checkout
        run: |
          set +e
          /tmp/wheel-venv/bin/agentic-dynamics experiment run >/dev/null 2>/tmp/wheel-command.err
          rc=$?
          set -e
          grep -q "checkout required" /tmp/wheel-command.err
          test "$rc" -ne 0
