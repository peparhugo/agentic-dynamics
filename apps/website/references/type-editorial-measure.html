<!doctype html><meta charset="utf-8"><title>Editorial type measure</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#f7f4ed;color:#17212b}.essay{width:min(100% - 2rem,44rem);margin:5rem auto;font:1.15rem/1.7 'Source Serif 4',serif}.kicker,h1{font-family:'IBM Plex Sans',sans-serif}.kicker{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:#287271}h1{font-size:clamp(2.5rem,8vw,5rem);line-height:.94;letter-spacing:-.05em;margin:.4rem 0 1rem}.lead{font-size:1.35rem;line-height:1.45}blockquote{margin:2rem 0;padding-left:1rem;border-left:3px solid #9b6a28;font-size:1.35rem}figure{margin:2rem 0}svg{width:100%;background:#e6eee9}figcaption{font:italic .85rem/1.5 'IBM Plex Sans',sans-serif;color:#5e645f}</style><article class="essay"><div class="kicker">RESEARCH NOTE / [M]</div><h1>A question earns its instrument.</h1><p class="lead">The field begins by making changing agent environments measurable.</p><p>Long-form prose stays within a readable measure. Technical detail appears close to the claim, not in a detached dashboard.</p><blockquote>“Show the evidence boundary before the conclusion.”</blockquote><figure><svg viewBox="0 0 600 160"><path d="M30 120L180 85L330 95L570 35" fill="none" stroke="#287271" stroke-width="5"/></svg><figcaption>Figure 1. An example figure caption names the unit, the evidence class, and the source.</figcaption></figure></article>
