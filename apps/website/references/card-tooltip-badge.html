<!doctype html><meta charset="utf-8"><title>Card tooltip badge</title><style>body{margin:2rem;font:16px/1.5 system-ui;background:#f7f4ed;color:#17212b}.card{max-width:34rem;border:1px solid #17212b;background:#fffdf7;padding:1.25rem}.badge{display:inline-block;padding:.2rem .45rem;background:#dceee9;color:#155855;font-weight:700;font-size:.75rem}.tip{position:relative;border-bottom:1px dotted;cursor:help}.tip span{display:none;position:absolute;left:0;bottom:1.6rem;width:18rem;padding:.6rem;background:#17212b;color:#fff;font-size:.8rem}.tip:hover span,.tip:focus span{display:block}</style><article class="card"><span class="badge">[C] COMPUTED</span><h1>Cost per verified outcome</h1><p><button class="tip">Source and scope<span>Source: score.per_arm.cpvo_usd. Computed from measured cost and independent verification.</span></button> remain available without leaving the reading flow.</p></article>
