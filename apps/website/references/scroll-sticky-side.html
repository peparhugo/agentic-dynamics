Source: https://raw.githubusercontent.com/russellsamora/scrollama/master/docs/sticky-side/index.html
License/attribution: Scrollama is MIT; adapted to use native IntersectionObserver rather than bundled dependencies.
Demonstrates: a readable step sequence beside a persistent, progressively updated visual.
Transfers: Story's anomaly-to-instrument transition, only with a static mobile fallback.
-->
<!doctype html><meta charset="utf-8"><title>Sticky side scrollytelling</title><style>body{margin:0;font:16px/1.5 system-ui;background:#f7f4ed;color:#17212b}main{max-width:1000px;margin:auto;padding:3rem 1.5rem}.scrolly{display:grid;grid-template-columns:minmax(0,20rem) 1fr;gap:3rem}.visual{position:sticky;top:15vh;height:55vh;background:#287271;color:white;display:grid;place-items:center;font-size:5rem}.step{min-height:65vh;padding:1rem;border-top:1px solid #cfc7b8}.active{color:#287271;font-weight:700}@media(max-width:700px){.scrolly{display:block}.visual{height:15rem;top:0}.step{min-height:35vh}}</style><main><h1>One claim, three checks</h1><section class="scrolly"><article><section class="step">1. Capture events before inferring a policy.</section><section class="step">2. Derive named information with coverage.</section><section class="step">3. Test policy as an arm, not a promise.</section></article><figure class="visual" aria-live="polite">1</figure></section></main><script>const steps=[...document.querySelectorAll('.step')],visual=document.querySelector('.visual'),observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const i=steps.indexOf(e.target);steps.forEach(s=>s.classList.remove('active'));e.target.classList.add('active');visual.textContent=i+1}}),{threshold:.55});steps.forEach(step=>observer.observe(step));</script>
