<!DOCTYPE html>
<!--
  Control Room — the one resting screen (facelift a0).

  Structure follows docs/research/control_room_ia.md §1–§3: a persistent qualifier bar (`R0`)
  over a three-column body whose dominant region is the run ledger (`R2`), with the attention
  inbox (`R1`) and the constraint ledger (`R3a/b/c`) as annotation gutters. There is NO
  navigation: every `ON-G1..G7` answer is visible at rest, above the fold, with no page scroll,
  no region scroll, and no interaction.

  Selector contract (fixed by docs/research/control_room_ia.md §10.2 and consumed by
  scripts/verify_control_room_rendering.py). The rules the markup obeys:

  1. Exactly one element per layout region (values R0/R1/R2/R3a/R3b/R3c on `data-region`)
     and exactly one per answer anchor (`ON-G1`..`ON-G7` on `data-answer`).
  2. The container hooks `[data-glance-shell]`, `[data-glance-body]`, `[data-r3-stack]` are
     unique and carry the geometry the pixel budget (§3.2) requires.
  3. `R4` (the selection dock) is hidden at rest and is NOT a layout region.
  4. The seven answer anchors live in their single canonical regions:
     `G1→R0, G2→R2, G3→R1, G4→R3a, G5→R1, G6→R0, G7→R3c`.
  5. All content is built with `element()`/`textContent` (never an HTML string), so the shell
     can carry a safe no-JS fallback and the client never parses model output as markup.

  No build step: a single classic script (`app.js`) hydrates the regions from `GET /api/glance`
  and follows `GET /api/events`. The pre-existing destination-board portal is superseded; its
  server routes are untouched and remain registered and served.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Both themes are real; the inline resolver below picks the stored/system theme before
       first paint so a reload never flashes the wrong surface colour. -->
  <meta name="color-scheme" content="dark light">
  <title>Control Room · run triage</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Pre-paint theme resolution, kept inline and tiny on purpose.
    try {
      var stored = window.localStorage.getItem("control-room-theme");
      var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme =
        stored === "light" || stored === "dark" ? stored : system;
    } catch (_error) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>
<body>
  <!-- [data-render-state] is the render gate's readiness contract: it flips to "ready" only
       after the initial /api/glance payload has rendered, the SSE replay boundary has landed,
       fonts have settled, and two animation frames have completed. -->
  <div class="glance-shell" data-glance-shell data-render-state="loading" data-control-epoch="">
    <!-- ── R0 · SYSTEM + TRUST (full width, 72px) ───────────────────────────────────────
         Two complete, separate answers: `ON-G1` (browser/control/workers/projections, each
         with state + worst age) and `ON-G6` (epoch, worst age, projection state, and explicit
         degraded/stale/partial/unknown counts). Both are rendered here and nowhere else. -->
    <header class="r0" data-region="R0" role="region" aria-label="System and trust">
      <div class="r0-scope">
        <span class="scope-name" id="scope-name">control-room</span>
        <span class="scope-sub" id="scope-epoch">epoch —</span>
      </div>
      <div class="r0-answers">
        <div class="r0-answer" data-answer="ON-G1">
          <span class="answer-kicker">SYSTEM</span>
          <span class="answer-cells" id="system-cells" aria-label="System dimensions"></span>
        </div>
        <div class="r0-answer" data-answer="ON-G6">
          <span class="answer-kicker">TRUST</span>
          <span class="answer-cells" id="trust-cells" aria-label="Trust verdict"></span>
        </div>
      </div>
      <!-- Grouped so mobile can lift the controls out of the answers' flex width (the 72px bar
           has no room to spare for two 28px buttons beside a wrapping trust row). -->
      <div class="r0-actions">
        <!-- The trends lens is deliberate drill-down, not navigation: the resting regions stay
             in place and the lens opens over the room only when asked (brief §3, §7). -->
        <button class="icon-button" id="lens-open" type="button" aria-expanded="false"
                aria-controls="chart-lens" title="Open the trends lens">
          <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 19V5m0 14h16M8 15l3-4 3 2 4-6"/>
          </svg>
          <span class="sr-only">Open the trends lens (spend, throughput, failure, dependency health)</span>
        </button>
        <button class="icon-button" id="theme-toggle" type="button" aria-pressed="false"
                title="Toggle light theme">
          <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z"/>
          </svg>
          <span class="sr-only">Toggle light or dark theme</span>
        </button>
      </div>
    </header>

    <div class="glance-body" data-glance-body>
      <!-- ── R1 · ATTENTION (the operator's work queue) ────────────────────────────────
           A durable, ranked, deduplicated inbox with reserved decision (`ON-G5`) and risk
           (`ON-G3`) rows; remaining capacity is filled by the globally-ranked next items. -->
      <section class="r1" data-region="R1" role="region" aria-label="Attention inbox">
        <h2 class="region-title">ATTENTION</h2>
        <ol class="attention-list" id="attention-list"></ol>
      </section>

      <!-- ── R2 · RUN LEDGER (the default operational body) ────────────────────────────
           The exact running/queued/failed/live counts (`ON-G2`) plus a bounded, attention-
           ranked sample of live agent sessions. Each row leads with the agent/session identity
           and pairs the ADVISORY claim with the MEASURED proof. -->
      <section class="r2" data-region="R2" role="region" aria-label="Run ledger">
        <div class="r2-head">
          <h2 class="region-title">RUN LEDGER</h2>
          <div class="r2-counts" data-answer="ON-G2" id="run-counts"></div>
        </div>
        <ul class="run-list" id="run-list"></ul>
      </section>

      <!-- ── R3 · CONSTRAINT LEDGER (annotations attached to the run ledger) ────────────
           Three fixed-height, non-scrolling annotations: R3a cost (`ON-G4`), R3b health
           detail (a mirror only), R3c bounded composition (`ON-G7`). -->
      <div class="r3" data-r3-stack>
        <section class="r3a" data-region="R3a" role="region" aria-label="Cost">
          <h2 class="region-title">COST</h2>
          <div class="cost-grid" data-answer="ON-G4" id="cost-grid"></div>
        </section>
        <section class="r3b" data-region="R3b" role="region" aria-label="Health detail">
          <h2 class="region-title">HEALTH</h2>
          <div class="health-lines" id="health-lines"></div>
        </section>
        <section class="r3c" data-region="R3c" role="region" aria-label="Composition">
          <h2 class="region-title sr-only">COMPOSITION</h2>
          <div class="composition" data-answer="ON-G7" id="composition"></div>
        </section>
      </div>
    </div>

    <!-- ── R4 · SELECTION DOCK (drill-down only) ──────────────────────────────────────
         Hidden at rest. Opening it is drill-down, never navigation; the resting regions stay
         in place and the roster is never hidden behind a modal. -->
    <aside class="selection-dock" id="selection-dock" hidden
           role="dialog" aria-modal="true" aria-label="Selected run evidence">
      <header class="dock-head">
        <h2 id="dock-title">RUN DETAIL</h2>
        <button class="icon-button" id="dock-close" type="button">
          <span aria-hidden="true">&#x2715;</span><span class="sr-only">Close run detail</span>
        </button>
      </header>
      <div class="evidence-ladder" id="evidence-ladder"></div>
    </aside>

    <!-- ── TRENDS LENS (drill-down; hidden at rest) ────────────────────────────────────
         The four catalog-derived charts (spend · throughput · failure · dependency health).
         Every card states its question, decision, baseline, scope and fallback; a missing
         value is a gap, fewer than two samples is an explicit empty state, and a failed
         projection is an explicit error state — never a blank panel. -->
    <section class="chart-lens" id="chart-lens" data-chart-lens hidden
             role="dialog" aria-modal="false" aria-labelledby="lens-title">
      <header class="lens-head">
        <h2 id="lens-title">TRENDS</h2>
        <span class="lens-scope" id="lens-scope">retained window: this browser session</span>
        <button class="icon-button" id="lens-close" type="button">
          <span aria-hidden="true">&#x2715;</span><span class="sr-only">Close the trends lens</span>
        </button>
      </header>
      <div class="chart-grid" id="chart-grid"></div>
    </section>

    <!-- One polite live region announces transitions only; ordinary changing metrics are
         labelled and readable but never announced. -->
    <div class="sr-only" id="announcer" aria-live="polite" role="status"></div>

    <!-- Static no-JS fallback: if the client never runs, the resting contract is still stated. -->
    <noscript>
      <p class="noscript">The Control Room needs JavaScript to stream live run state.</p>
    </noscript>
  </div>
  <script src="/static/app.js"></script>
  <!-- charts.js is a classic script loaded after app.js: app.js calls its `update` seam at
       render time, which is always after both scripts have parsed. -->
  <script src="/static/charts.js"></script>
</body>
</html>
