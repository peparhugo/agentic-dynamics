<!DOCTYPE html>
<!--
  Control Room — the one resting screen (facelift a0; repaired to close the a5 design adversary).

  Structure follows docs/research/control_room_ia.md §1–§3: a persistent machine rail (`R0`)
  over a three-column body whose dominant region is the agent-run roster (`R2`), with the
  attention work queue (`R1`) and the constraint ledger (`R3a/b/c`) as annotation gutters. There
  is NO navigation: every `ON-G1..G7` answer is visible at rest, above the fold, with no page
  scroll, no region scroll, and no interaction.

  ── recognizability (the a5 design-adversary contract) ──────────────────────────────────────
  The a5 adversary judges the RESTING screenshot only: no selection, no hover, no prose. Every
  stranger-test claim below must read as true from the named element alone — because the element
  is unmistakable, not because a label annotates it. These are the exact selectors (verified by
  scripts/verify_control_room_rendering.py's STYLE carrier probe and the a5 pass):

    (a) "these are live CLI agent sessions, not services"
        .run-row[data-run-id] .session-band[data-agent]        — prompt glyph + agent token (Move 1)
        .run-row[data-run-id] [data-field="terminal.target"]   — worktree/host the agent writes to
        .run-row[data-run-id] [data-field="command.current"]   — the command/tool now running
        .run-row[data-run-id] [data-field="model.provider"]    — provider×model driving the session
        .run-row[data-run-id] [data-field="run.live"][data-state] — live/not-live state mark
        .run-row[data-run-id] .row-status                      — the left status rail of the object

    (b) "that run needs a decision"
        [data-region=R1] [data-attention-class=decision] .queue-kind   — DECISION work item
        [data-answer=ON-G5] [data-field="decision.state"]                — pending / none pending
        [data-answer=ON-G5] [data-field="decision.eligibility"]          — approve eligibility token
        [data-answer=ON-G5] [data-authority="controller"]                — authority: controller
        .run-row[data-run-id][data-decision="approve"] .row-decision       — the same door on the row

    (c) "spend is against a hard budget"
        .run-row[data-run-id] .row-lease[data-budget-state]    — the attached headroom bar (Move 6)
        .run-row[data-run-id] [data-budget-reserved]           — reserved spend on this attempt
        .run-row[data-run-id] [data-budget-settled]            — settled/reconciled spend
        .run-row[data-run-id] [data-budget-cap]                — the hard cap
        .run-row[data-run-id] [data-budget-headroom]           — headroom percent
        .run-row[data-run-id] [data-budget-settlement]         — matched|underspent|overspent|unsettled
        [data-region=R3a] [data-money-risk]                  — the bounded cap exception (not a KPI)

    (d) "evidence is inspectable"
        .run-row[data-run-id] .row-evidence [data-evidence-class="advisory"]  — said/claimed mark
        .run-row[data-run-id] .row-evidence [data-evidence-class="measured"]  — measured proof mark
        .run-row[data-run-id] [data-field="decision.receipt"]                 — recorded receipt
        #selection-dock [data-evidence-ladder][data-attempt-boundary]         — the causal ladder
        #selection-dock [data-attempt-feed] [data-feed-follow]                — bounded follow/pause feed

  ── selector contract (fixed by docs/research/control_room_ia.md §10.2, consumed by the gate) ─
  1. Exactly one element per layout region (values R0/R1/R2/R3a/R3b/R3c on `data-region`)
     and exactly one per answer anchor (`ON-G1`..`ON-G7` on `data-answer`).
  2. The container hooks `[data-glance-shell]`, `[data-glance-body]`, `[data-r3-stack]` are
     unique and carry the geometry the pixel budget (§3.2) requires.
  3. `R4` (the selection dock) is hidden at rest and is NOT a layout region.
  4. The seven answer anchors live in their single canonical regions:
     `G1→R0, G2→R2, G3→R1, G4→R3a, G5→R1, G6→R0, G7→R3c`.
  5. All content is built with `element()`/`textContent` (never an HTML string), so the shell
     can carry a safe no-JS fallback and the client never parses model output as markup.
  6. The eight distinctive moves (direction §4.1) are preserved and carried by the elements named
     in each section comment below; the recognizability block above is their screenshot contract.

  No build step: classic scripts in dependency order. `app.js` hydrates the resting regions from
  `GET /api/glance` and follows `GET /api/events`; `charts.js`/`visuals.js` draw the trends lens
  and the R4 causal ladder; `parity.js` re-houses the old room's operational surfaces (the R4b
  worker event stream + action band, R4d step timings, and the workbench lenses: fleet, attention,
  money, registry, sessions, queue, routing, docs, audit, health, workforce). The pre-existing
  destination-board portal is superseded; its server routes are untouched and remain registered
  and served, and the parity layer lazy-loads them only when the operator opens a lens.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Both themes are real; the inline resolver below picks the stored/system theme before
       first paint so a reload never flashes the wrong surface colour. -->
  <meta name="color-scheme" content="dark light">
  <title>Control Room · agent runs</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Pre-paint theme resolution, kept inline and tiny on purpose.
    try {
      var stored = window.localStorage.getItem("control-room-theme");
      var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme =
        stored === "light" || stored === "dark" ? stored : system;
    } catch (_error) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>
<body>
  <!-- [data-render-state] is the render gate's readiness contract: it flips to "ready" only
       after the initial /api/glance payload has rendered, the SSE replay boundary has landed,
       fonts have settled, and two animation frames have completed. -->
  <div class="glance-shell" data-glance-shell data-render-state="loading" data-control-epoch="">
    <!-- ── R0 · MACHINE RAIL (full width, 72px) ─────────────────────────────────────────
         Recomposed from a "trust bar" into a terminal machine rail: a prompt glyph and the
         control plane's name at the left, the two complete answers (`ON-G1` system dimensions,
         `ON-G6` trust verdict) read inline on the rail, and the deliberate lenses at the right.
         Both answers are rendered here and nowhere else. -->
    <header class="r0" data-region="R0" role="region" aria-label="Machine and trust">
      <div class="r0-scope">
        <span class="machine-prompt" aria-hidden="true">&#x276F;</span>
        <span class="scope-name" id="scope-name">control-room</span>
        <span class="scope-sub" id="scope-epoch">epoch —</span>
      </div>
      <div class="r0-answers">
        <div class="r0-answer" data-answer="ON-G1">
          <span class="answer-kicker">SYSTEM</span>
          <span class="answer-cells" id="system-cells" aria-label="System dimensions"></span>
        </div>
        <div class="r0-answer" data-answer="ON-G6">
          <span class="answer-kicker">TRUST</span>
          <span class="answer-cells" id="trust-cells" aria-label="Trust verdict"></span>
        </div>
      </div>
      <!-- Grouped so mobile can lift the controls out of the answers' flex width (the 72px bar
           has no room to spare for two 28px buttons beside a wrapping trust row). -->
      <div class="r0-actions">
        <!-- The workbench is where the re-housed operational surfaces live: fleet, attention,
             money, registry, sessions, queue, routing, docs, audit, health, workforce step
             timings, and the step-11/12 Operations/Surfaces read views. It is a deliberate
             drill-down (like the trends lens), never navigation at rest; each panel lazy-loads
             the same endpoint the old room used. -->
        <button class="icon-button" id="workbench-open" type="button" aria-expanded="false"
                aria-controls="workbench" title="Open the workbench lenses">
          <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16"/>
            <path d="M8 4v4M14 10v4M10 16v4"/>
          </svg>
          <span class="sr-only">Open the workbench (fleet, attention, money, registry, sessions,
            queue, routing, docs, audit, health, workforce, operations, surfaces)</span>
        </button>
        <!-- The trends lens is deliberate drill-down, not navigation: the resting regions stay
             in place and the lens opens over the room only when asked (brief §3, §7). -->
        <button class="icon-button" id="lens-open" type="button" aria-expanded="false"
                aria-controls="chart-lens" title="Open the trends lens">
          <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 19V5m0 14h16M8 15l3-4 3 2 4-6"/>
          </svg>
          <span class="sr-only">Open the trends lens (spend, throughput, failure, dependency health)</span>
        </button>
        <button class="icon-button" id="theme-toggle" type="button" aria-pressed="false"
                title="Toggle light theme">
          <svg class="icon-svg" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8Z"/>
          </svg>
          <span class="sr-only">Toggle light or dark theme</span>
        </button>
      </div>
    </header>

    <div class="glance-body" data-glance-body>
      <!-- ── R1 · ATTENTION WORK QUEUE (Move 8) ────────────────────────────────────────
           A durable, ranked, deduplicated work queue of run-linked items, not repeated alert
           cards: the reserved decision (`ON-G5`) and risk (`ON-G3`) items carry lifecycle,
           owner/authority and the next governed action; remaining capacity collapses into ONE
           continuous "queue clear" state (the DOM keeps the exact item count the gate measures,
           the CSS merges the filler into a single empty state so it never reads as a card stack). -->
      <section class="r1" data-region="R1" role="region" aria-label="Attention work queue">
        <h2 class="region-title">ATTENTION</h2>
        <ol class="attention-list" id="attention-list"></ol>
      </section>

      <!-- ── R2 · AGENT RUN ROSTER (Move 1, Move 4, Move 6) ────────────────────────────
           The dominant surface: a bounded, attention-ranked sample of live CLI agent sessions.
           Each row is a run OBJECT, not a service row — a left status rail, a monospace session
           identity band (agent → worktree → command → model → attempt), the exact running/queued/
           failed/live counts (`ON-G2`), a paired ADVISORY/MEASURED evidence/decision footer, and
           an attached lease headroom bar (reserved vs settled vs hard cap) along its bottom edge. -->
      <section class="r2" data-region="R2" role="region" aria-label="Agent run roster">
        <div class="r2-head">
          <h2 class="region-title">AGENT RUNS</h2>
          <div class="r2-counts" data-answer="ON-G2" id="run-counts"></div>
        </div>
        <ul class="run-list" id="run-list"></ul>
      </section>

      <!-- ── R3 · CONSTRAINT LEDGER (Move 6) ───────────────────────────────────────────
           Three fixed-height, non-scrolling annotations attached to the roster — an unboxed
           ledger, not a KPI rail: R3a money vs the hard cap (`ON-G4`), R3b health detail (a
           mirror only), R3c bounded composition (`ON-G7`). -->
      <div class="r3" data-r3-stack>
        <section class="r3a" data-region="R3a" role="region" aria-label="Cost against budget">
          <h2 class="region-title">COST <span class="region-prov" id="cost-prov" data-region-prov="R3a"></span></h2>
          <div class="cost-grid" data-answer="ON-G4" id="cost-grid"></div>
        </section>
        <section class="r3b" data-region="R3b" role="region" aria-label="Health detail">
          <h2 class="region-title">HEALTH</h2>
          <div class="health-lines" id="health-lines"></div>
        </section>
        <section class="r3c" data-region="R3c" role="region" aria-label="Composition">
          <h2 class="region-title sr-only">COMPOSITION</h2>
          <div class="composition" data-answer="ON-G7" id="composition"></div>
        </section>
      </div>
    </div>

    <!-- ── R4 · SELECTION DOCK (drill-down only; Move 2, Move 5, Move 7) ───────────────
         Hidden at rest. Opening it is drill-down, never navigation; the resting regions stay
         in place and the roster is never hidden behind a modal. Per the reconciled IA
         (docs/research/control_room_ia.md §2 R4), it has four named sub-regions:
           R4a address/identity · R4b per-worker event stream + action band ·
           R4c evidence ladder · R4d step timings.
         `data-dock-region` (not `data-region`) keeps the resting `[data-region]` contract
         untouched; the dock never carries a `data-answer`. -->
    <aside class="selection-dock" id="selection-dock" hidden
           role="dialog" aria-modal="true" aria-label="Selected run evidence">
      <header class="dock-head">
        <h2 id="dock-title">RUN DETAIL</h2>
        <!-- Move 5: a stable, copyable typed address for the object under inspection. -->
        <code class="dock-address" id="dock-address" data-dock-address></code>
        <button class="icon-button" id="dock-close" type="button">
          <span aria-hidden="true">&#x2715;</span><span class="sr-only">Close run detail</span>
        </button>
      </header>
      <!-- R4a — identity/scope facts for the selected run (re-housed cell panel). -->
      <div class="dock-region dock-address-region" data-dock-region="address"
           id="dock-address-region" aria-label="Selected run identity"></div>
      <!-- R4b — the restored per-worker surface: one live event stream plus the governed
           action band. The stream is the same endpoint the old room used
           (`GET /api/events/<cell_id>`); the action band fires the same mutation routes. -->
      <div class="dock-region dock-worker" data-dock-region="worker" id="dock-worker">
        <div class="dock-region-head">
          <h3 class="dock-region-title">WORKER</h3>
          <span class="dock-worker-target" id="dock-worker-target">—</span>
          <button class="feed-toggle" id="dock-stream-toggle" type="button"
                  data-feed-follow="follow" aria-pressed="false">Pause</button>
        </div>
        <ol class="feed-list" id="dock-event-feed" data-event-feed aria-live="off"></ol>
        <div class="dock-actions" id="dock-actions" data-action-band></div>
      </div>
      <!-- R4c — the attempt-scoped causal ladder (visuals.js) + the bounded attempt feed. -->
      <div class="dock-region dock-evidence" data-dock-region="evidence" id="dock-evidence">
        <div class="evidence-ladder" id="evidence-ladder"></div>
      </div>
      <!-- R4d — per-attempt step timings (queue wait, service time, first token, duration,
           retries, tokens by answer/explanation, cost, exit, verification). A value the
           portal cannot observe renders as an explicit `unknown`, never a fabricated 0. -->
      <div class="dock-region dock-timing" data-dock-region="timing" id="dock-timing">
        <h3 class="dock-region-title">STEP TIMINGS</h3>
        <div class="timing-grid" id="timing-grid" data-timing-grid></div>
      </div>
    </aside>

    <!-- ── TRENDS LENS (drill-down; hidden at rest) ────────────────────────────────────
         The four catalog-derived charts (spend · throughput · failure · dependency health).
         Every card states its question, decision, baseline, scope and fallback; a missing
         value is a gap, fewer than two samples is an explicit empty state, and a failed
         projection is an explicit error state — never a blank panel. -->
    <section class="chart-lens" id="chart-lens" data-chart-lens hidden
             role="dialog" aria-modal="false" aria-labelledby="lens-title">
      <header class="lens-head">
        <h2 id="lens-title">TRENDS</h2>
        <span class="lens-scope" id="lens-scope">retained window: this browser session</span>
        <button class="icon-button" id="lens-close" type="button">
          <span aria-hidden="true">&#x2715;</span><span class="sr-only">Close the trends lens</span>
        </button>
      </header>
      <div class="chart-grid" id="chart-grid"></div>
    </section>

    <!-- ── WORKBENCH (drill-down only; the re-housed destination boards) ───────────────
         The facelift dropped the old room's five destination boards and System overflow. Per
         the reconciled IA (docs/research/control_room_ia.md §6/§14), each is re-housed as a
         deliberate lens: fleet, attention, money, registry, sessions, queue, routing, docs,
         audit, health, the workforce step-timing aggregate, and the step-11/12
         Operations/Surfaces read views (including the batch lane). Hidden at rest; every panel
         lazy-loads the SAME endpoint the old room used, so no capability is a stub. The panel
         nav is an accelerator, not navigation-from-rest (§4.3). -->
    <section class="workbench" id="workbench" data-workbench hidden
             role="dialog" aria-modal="true" aria-labelledby="workbench-title">
      <header class="wb-head">
        <h2 id="workbench-title">WORKBENCH</h2>
        <nav class="wb-nav" id="workbench-nav" aria-label="Workbench lenses"></nav>
        <button class="icon-button" id="workbench-close" type="button">
          <span aria-hidden="true">&#x2715;</span><span class="sr-only">Close the workbench</span>
        </button>
      </header>
      <div class="wb-body" id="workbench-body">
        <section class="wb-panel" data-lens="fleet" id="wb-fleet" hidden aria-label="Fleet"></section>
        <section class="wb-panel" data-lens="attention" id="wb-attention" hidden aria-label="Attention"></section>
        <section class="wb-panel" data-lens="money" id="wb-money" hidden aria-label="Money"></section>
        <section class="wb-panel" data-lens="registry" id="wb-registry" hidden aria-label="Registry"></section>
        <section class="wb-panel" data-lens="sessions" id="wb-sessions" hidden aria-label="Sessions"></section>
        <section class="wb-panel" data-lens="queue" id="wb-queue" hidden aria-label="Queue"></section>
        <section class="wb-panel" data-lens="routing" id="wb-routing" hidden aria-label="Routing"></section>
        <section class="wb-panel" data-lens="docs" id="wb-docs" hidden aria-label="Docs health"></section>
        <section class="wb-panel" data-lens="audit" id="wb-audit" hidden aria-label="Recording audit"></section>
        <section class="wb-panel" data-lens="health" id="wb-health" hidden aria-label="Projection health"></section>
        <section class="wb-panel" data-lens="workforce" id="wb-workforce" hidden aria-label="Workforce step timings"></section>
        <!-- Step-11/12 read views (kept from main inside the refreshed presentation): the
             operational packet + run detail and the step-5/6/7 read-model surfaces (including
             the batch discount lane). Each panel renders the payload's own states verbatim. -->
        <section class="wb-panel" data-lens="operations" id="wb-operations" hidden aria-label="Operations"></section>
        <section class="wb-panel" data-lens="surfaces" id="wb-surfaces" hidden aria-label="Surfaces"></section>
      </div>
    </section>

    <!-- One polite live region announces transitions only; ordinary changing metrics are
         labelled and readable but never announced. -->
    <div class="sr-only" id="announcer" aria-live="polite" role="status"></div>

    <!-- Static no-JS fallback: if the client never runs, the resting contract is still stated. -->
    <noscript>
      <p class="noscript">The Control Room needs JavaScript to stream live run state.</p>
    </noscript>
  </div>
  <!-- keyed-list.js is main's shared reconciler, loaded first (as main loaded it): parity.js's
       re-housed polled lenses consume `window.ControlRoomKeyedList` so a refresh updates rows in
       place rather than rebuilding the list and losing focus/scroll. It is dependency-free. -->
  <script src="/static/keyed-list.js"></script>
  <script src="/static/app.js"></script>
  <!-- charts.js / visuals.js are classic scripts loaded after app.js: app.js calls their
       `update` / `render` seams at render/selection time, always after all scripts parsed.
       parity.js re-houses the old room's operational surfaces (R4b/R4d + the workbench
       lenses) and is loaded last so it can extend window.ControlRoom* seams. -->
  <script src="/static/charts.js"></script>
  <script src="/static/visuals.js"></script>
  <script src="/static/parity.js"></script>
</body>
</html>
